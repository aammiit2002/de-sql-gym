n both the key and the timestamp retrieves the full winning row.", "Because timestamps are unique per customer here, exactly one row survives per key."], "explanation": "The classic pre-window idiom, still everywhere in legacy ETL. Be sure to state its weakness unprompted: with tied timestamps it silently fan-outs and returns duplicates, which is precisely why ROW_NUMBER with an explicit tie-breaker replaced it.", "company": null, "seen": "Core DE pattern"}, {"id": "q85", "title": "Basic Statistics per Group", "difficulty": "Medium", "pattern": "Statistical aggregation", "topics": ["Aggregation", "Statistics"], "prompt": "For each region return count, mean, min, max, and the **population standard deviation** of `amount`, rounded to 2 decimals. SQLite has no STDDEV — compute it.\n\n**Output columns:** `region`, `n`, `mean_amt`, `min_amt`, `max_amt`, `stddev_amt`\n**Order by:** `region`", "setup": "CREATE TABLE sales (region TEXT, amount REAL);\nINSERT INTO sales VALUES ('APAC',10),('APAC',20),('APAC',30),('EMEA',5),('EMEA',15),('AMER',100),('AMER',100),('AMER',100);", "solution": "SELECT region, COUNT(*) AS n, ROUND(AVG(amount),2) AS mean_amt,\n       MIN(amount) AS min_amt, MAX(amount) AS max_amt,\n       ROUND(SQRT(AVG(amount*amount) - AVG(amount)*AVG(amount)),2) AS stddev_amt\nFROM sales GROUP BY region ORDER BY region;", "ordered": true, "hints": ["Population variance = E[x²] - (E[x])², both of which are plain AVGs.", "AMER has zero variance — all values identical."], "walkthrough": ["`AVG(amount*amount)` gives the mean of the squares.", "`AVG(amount)*AVG(amount)` gives the square of the mean.", "Their difference is the population variance; SQRT turns it into a standard deviation."], "explanation": "Tests whether you can express a statistic from first principles when the built-in is missing. Caveat worth mentioning: this computational form is numerically unstable for large values (catastrophic cancellation), which is why real engines use Welford's algorithm. Also know STDDEV_POP vs STDDEV_SAMP — the sample version divides by n-1.", "company": null, "seen": "Core DE pattern"}, {"id": "q86", "title": "Prefix Sum for Anomaly Detection", "difficulty": "Medium", "pattern": "Cumulative comparison", "topics": ["Window Functions", "Data Quality"], "prompt": "Row counts are logged per daily load. Flag days where the count deviates from the running average of all prior days by more than 50%.\n\n**Output columns:** `d`, `row_count`, `prior_avg` (rounded to 2 decimals, NULL on day 1), `is_anomaly` (1/0)\n**Order by:** `d`", "setup": "CREATE TABLE load_stats (d TEXT, row_count INTEGER);\nINSERT INTO load_stats VALUES ('2024-03-01',1000),('2024-03-02',1050),('2024-03-03',980),\n('2024-03-04',1020),('2024-03-05',150),('2024-03-06',1010);", "solution": "WITH a AS (\n  SELECT d, row_count,\n         AVG(row_count) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS prior_avg\n  FROM load_stats)\nSELECT d, row_count, ROUND(prior_avg,2) AS prior_avg,\n  CASE WHEN prior_avg IS NOT NULL AND ABS(row_count - prior_avg) > 0.5*prior_avg THEN 1 ELSE 0 END AS is_anomaly\nFROM a ORDER BY d;", "ordered": true, "hints": ["The frame `UNBOUNDED PRECEDING AND 1 PRECEDING` excludes the current row from its own baseline.", "Day 1 has no prior rows, so the average is NULL."], "walkthrough": ["The window frame stops one row before the current row, so the average covers only history.", "Comparing the current count against that baseline detects the drop on 03-05.", "The NULL guard keeps day 1 from being flagged."], "explanation": "This is volume-anomaly detection, one of the standard freshness/completeness checks in any observability layer. The frame ending at `1 PRECEDING` is the key detail — including the current row in its own baseline dilutes the very anomaly you're hunting.", "company": null, "seen": "Core DE pattern"}, {"id": "q87", "title": "Multi-Table Join With Correct Grain", "difficulty": "Medium", "pattern": "Multi-table join", "topics": ["Joins", "Aggregation"], "prompt": "Join customers, orders and order items to return per customer: number of distinct orders and total item revenue.\n\nCustomers with no orders should show 0 and 0.0.\n\n**Output columns:** `customer_id`, `name`, `order_count`, `revenue` (rounded to 2 decimals)\n**Order by:** `customer_id`", "setup": "CREATE TABLE customers (customer_id INTEGER, name TEXT);\nINSERT INTO customers VALUES (1,'Asha'),(2,'Ravi'),(3,'Meera');\nCREATE TABLE orders (order_id INTEGER, customer_id INTEGER);\nINSERT INTO orders VALUES (10,1),(11,1),(12,2);\nCREATE TABLE order_items (order_id INTEGER, qty INTEGER, price REAL);\nINSERT INTO order_items VALUES (10,2,50),(10,1,25),(11,3,10),(12,1,200);", "solution": "SELECT c.customer_id, c.name,\n       COUNT(DISTINCT o.order_id) AS order_count,\n       ROUND(COALESCE(SUM(i.qty*i.price),0),2) AS revenue\nFROM customers c\nLEFT JOIN orders o ON o.customer_id=c.customer_id\nLEFT JOIN order_items i ON i.order_id=o.order_id\nGROUP BY c.customer_id, c.name ORDER BY c.customer_id;", "ordered": true, "hints": ["The join to order_items multiplies order rows — COUNT(DISTINCT o.order_id) protects the order count.", "Keep LEFT JOINs all the way down or Meera disappears."], "walkthrough": ["Chained LEFT JOINs preserve customers and orders that have no children.", "The item join fans out order rows, so a plain COUNT of orders would over-count — DISTINCT fixes it.", "Revenue sums correctly across the fanned-out rows because each item row should be counted once."], "explanation": "A compact version of the fan-out trap where one metric needs DISTINCT and the other doesn't. Being able to articulate *which* metrics survive a fan-out and which don't is the difference between a query that looks right and one that is right.", "company": null, "seen": "Core DE pattern"}, {"id": "q88", "title": "Partition Pruning Simulation", "difficulty": "Medium", "pattern": "Partitioning", "topics": ["Performance", "Dates"], "prompt": "The table is partitioned by `dt`. Return, for a query covering `2024-03-02` to `2024-03-04`, which partitions would be scanned and how many rows each holds.\n\n**Output columns:** `dt`, `rows_in_partition`\n**Order by:** `dt`", "setup": "CREATE TABLE events (event_id INTEGER, dt TEXT, payload TEXT);\nINSERT INTO events VALUES (1,'2024-03-01','a'),(2,'2024-03-02','b'),(3,'2024-03-02','c'),\n(4,'2024-03-03','d'),(5,'2024-03-04','e'),(6,'2024-03-04','f'),(7,'2024-03-05','g');", "solution": "SELECT dt, COUNT(*) AS rows_in_partition\nFROM events WHERE dt >= '2024-03-02' AND dt <= '2024-03-04'\nGROUP BY dt ORDER BY dt;", "ordered": true, "hints": ["Filter on the partition column directly so the engine can eliminate files before reading.", "Any function applied to dt would force a full scan of every partition."], "walkthrough": ["The predicate is on the raw partition column, so only three partitions qualify.", "Grouping by `dt` reports the per-partition row counts that would actually be read.", "Partitions for 03-01 and 03-05 are never touched."], "explanation": "Conceptually identical to how Delta Lake, Iceberg and Hive prune files using partition metadata. The interview point: filter on the *partition column itself*, not a derived expression — `WHERE year(dt)=2024` scans everything, `WHERE dt >= '2024-01-01'` prunes. Over-partitioning (by hour on a small table) creates the small-files problem, which is the natural follow-up.", "company": null, "seen": "Core DE pattern"}, {"id": "q89", "title": "Compare Two Loads for Row-Level Drift", "difficulty": "Hard", "pattern": "Checksum comparison", "topics": ["Data Quality", "Joins", "Strings"], "prompt": "Compare yesterday's and today's snapshot for the same keys and report keys whose non-key attributes changed. Build a concatenated fingerprint of the attributes rather than comparing column by column.\n\n**Output columns:** `id`, `old_fingerprint`, `new_fingerprint`\n**Order by:** `id`", "setup": "CREATE TABLE snap_old (id INTEGER, name TEXT, city TEXT, tier TEXT);\nINSERT INTO snap_old VALUES (1,'Asha','HYD','gold'),(2,'Ravi','BLR','silver'),(3,'Meera','PNQ',NULL);\nCREATE TABLE snap_new (id INTEGER, name TEXT, city TEXT, tier TEXT);\nINSERT INTO snap_new VALUES (1,'Asha','HYD','gold'),(2,'Ravi','MUM','silver'),(3,'Meera','PNQ','bronze');", "solution": "WITH o AS (SELECT id, COALESCE(name,'~')||'|'||COALESCE(city,'~')||'|'||COALESCE(tier,'~') AS fp FROM snap_old),\n     n AS (SELECT id, COALESCE(name,'~')||'|'||COALESCE(city,'~')||'|'||COALESCE(tier,'~') AS fp FROM snap_new)\nSELECT o.id, o.fp AS old_fingerprint, n.fp AS new_fingerprint\nFROM o JOIN n ON n.id=o.id WHERE o.fp <> n.fp ORDER BY o.id;", "ordered": true, "hints": ["COALESCE every column before concatenating, or one NULL makes the whole fingerprint NULL.", "Use a delimiter that cannot appear in the data, otherwise 'ab'+'c' collides with 'a'+'bc'."], "walkthrough": ["Each side builds one string per row from all non-key attributes.", "NULLs become a sentinel so they compare equal to each other instead of poisoning the concatenation.", "Joining on the key and comparing fingerprints surfaces only changed rows."], "explanation": "This is how SCD2 change detection actually works at scale — you hash the fingerprint (MD5/SHA) into a `row_hash` column and compare hashes instead of 40 columns. Both traps here are real production bugs: NULL-poisoned concatenation, and delimiter collisions creating false negatives.", "company": null, "seen": "Core DE pattern"}, {"id": "q90", "title": "Rank Within Rolling Time Window", "difficulty": "Hard", "pattern": "Windowed ranking", "topics": ["Window Functions", "Dates"], "prompt": "For each day, return the product with the highest sales over that day and the two days before it (a trailing 3-day window).\n\nOnly consider days present in the table. Ties go to the alphabetically first product.\n\n**Output columns:** `d`, `top_product`, `window_sales`\n**Order by:** `d`", "setup": "CREATE TABLE sales (d TEXT, product TEXT, amount REAL);\nINSERT INTO sales VALUES\n('2024-03-01','a',100),('2024-03-01','b',50),\n('2024-03-02','a',20),('2024-03-02','b',200),\n('2024-03-03','a',10),('2024-03-03','c',400),\n('2024-03-04','b',10),('2024-03-04','c',5);", "solution": "WITH days AS (SELECT DISTINCT d FROM sales),\nw AS (\n  SELECT dd.d, s.product, SUM(s.amount) AS window_sales\n  FROM days dd JOIN sales s ON s.d <= dd.d AND s.d >= date(dd.d,'-2 day')\n  GROUP BY dd.d, s.product),\nr AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY d ORDER BY window_sales DESC, product) AS rn FROM w)\nSELECT d, product AS top_product, window_sales FROM r WHERE rn=1 ORDER BY d;", "ordered": true, "hints": ["Self-join each day to the sales rows falling inside its trailing window, then aggregate per product.", "Rank within each day and keep rank 1."], "walkthrough": ["A distinct list of days becomes the anchor for each window.", "The range join gathers all sales within the 3-day trailing span for each anchor day.", "Summing per product then ranking within the day yields the leader for each window."], "explanation": "Combines a range self-join with ranking — a genuinely hard shape that shows up as 'trending items', 'top seller this week' and leaderboard refresh logic. A window function alone can't do it because the aggregation grain (product) differs from the ranking grain (day).", "company": null, "seen": "Core DE pattern"}, {"id": "q91", "title": "Merge Overlapping Date Ranges", "difficulty": "Hard", "pattern": "Interval merging", "topics": ["Gaps and Islands", "Dates"], "prompt": "Collapse overlapping or adjacent subscription periods per customer into consolidated continuous ranges.\n\nAdjacent means the next range starts on or before the day after the previous one ends.\n\n**Output columns:** `customer_id`, `range_start`, `range_end`\n**Order by:** `customer_id`, `range_start`", "setup": "CREATE TABLE subs (customer_id INTEGER, start_date TEXT, end_date TEXT);\nINSERT INTO subs VALUES\n(1,'2024-01-01','2024-01-31'),(1,'2024-01-15','2024-02-20'),(1,'2024-02-21','2024-03-10'),(1,'2024-05-01','2024-05-31'),\n(2,'2024-01-01','2024-01-10'),(2,'2024-03-01','2024-03-05');", "solution": "WITH ordered AS (\n  SELECT customer_id, start_date, end_date,\n         MAX(end_date) OVER (PARTITION BY customer_id ORDER BY start_date\n              ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS prev_max_end\n  FROM subs),\nflagged AS (\n  SELECT *, CASE WHEN prev_max_end IS NULL OR start_date > date(prev_max_end,'+1 day') THEN 1 ELSE 0 END AS is_new\n  FROM ordered),\ngrp AS (\n  SELECT *, SUM(is_new) OVER (PARTITION BY customer_id ORDER BY start_date\n             ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS g\n  FROM flagged)\nSELECT customer_id, MIN(start_date) AS range_start, MAX(end_date) AS range_end\nFROM grp GROUP BY customer_id, g ORDER BY customer_id, range_start;", "ordered": true, "hints": ["Carry the running maximum end date seen *before* the current row — not just the previous row's end.", "A new island starts when the current start is later than that running max plus one day."], "walkthrough": ["Ordering by start date, the running MAX of prior end dates tells you how far coverage already extends.", "A gap exists only when the current start jumps past that coverage by more than a day.", "Flag-then-cumulative-sum groups the rows, and MIN/MAX collapse each group to one merged range."], "explanation": "Harder than it looks: using `LAG(end_date)` instead of the running MAX fails when a short range is fully contained inside a longer earlier one. This exact shape appears in subscription tenure, hospital-stay merging, and de-overlapping SCD2 intervals.", "company": null, "seen": "Core DE pattern"}, {"id": "q92", "title": "Allocate Payments to Invoices FIFO", "difficulty": "Hard", "pattern": "Running allocation", "topics": ["Window Functions", "Aggregation"], "prompt": "A customer's total payments must be applied to their invoices oldest-first. For each invoice return how much of it is covered.\n\n**Output columns:** `customer_id`, `invoice_id`, `amount`, `allocated` (rounded to 2 decimals)\n**Order by:** `customer_id`, `invoice_id`", "setup": "CREATE TABLE invoices (customer_id INTEGER, invoice_id INTEGER, amount REAL);\nINSERT INTO invoices VALUES (1,101,100),(1,102,200),(1,103,50),(2,201,80),(2,202,80);\nCREATE TABLE payments (customer_id INTEGER, paid REAL);\nINSERT INTO payments VALUES (1,250),(2,100);", "solution": "WITH c AS (\n  SELECT i.customer_id, i.invoice_id, i.amount, p.paid,\n         SUM(i.amount) OVER (PARTITION BY i.customer_id ORDER BY i.invoice_id\n              ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cum\n  FROM invoices i JOIN payments p ON p.customer_id=i.customer_id)\nSELECT customer_id, invoice_id, amount,\n       ROUND(MAX(0, MIN(amount, paid - (cum - amount))),2) AS allocated\nFROM c ORDER BY customer_id, invoice_id;", "ordered": true, "hints": ["`cum - amount` is how much was owed before this invoice; subtract it from the payment pot to see what's left.", "Clamp the result between 0 and the invoice amount."], "walkthrough": ["The running total of invoice amounts gives the cumulative debt through each invoice.", "`paid - (cum - amount)` is the money still available when this invoice is reached.", "MIN caps the allocation at the invoice amount and MAX(0,...) floors it at zero for fully unfunded invoices."], "explanation": "A genuinely hard financial-logic problem that shows up in billing, inventory FIFO costing and capacity allocation. The clamp expression is the crux — writing it without an iterative loop is what interviewers are testing. In SQLite MIN/MAX with two scalar arguments act as scalar functions, not aggregates; other engines call these LEAST and GREATEST.", "company": null, "seen": "Core DE pattern"}, {"id": "q93", "title": "Late-Arriving Backdated SCD2 Change", "difficulty": "Hard", "pattern": "SCD2 correction", "topics": ["SCD", "Window Functions"], "prompt": "A backdated change arrived after the dimension was already built. Rebuild the complete SCD2 history from the union of existing change events and the late one, so all ranges are correct and non-overlapping.\n\n**Output columns:** `customer_id`, `segment`, `effective_from`, `effective_to`, `is_current`\n**Order by:** `customer_id`, `effective_from`", "setup": "CREATE TABLE change_events (customer_id INTEGER, segment TEXT, changed_on TEXT);\nINSERT INTO change_events VALUES (1,'bronze','2024-01-01'),(1,'gold','2024-06-01');\nCREATE TABLE late_events (customer_id INTEGER, segment TEXT, changed_on TEXT);\nINSERT INTO late_events VALUES (1,'silver','2024-03-15');", "solution": "WITH allc AS (\n  SELECT customer_id, segment, changed_on FROM change_events\n  UNION ALL SELECT customer_id, segment, changed_on FROM late_events)\nSELECT customer_id, segment, changed_on AS effective_from,\n  COALESCE(date(LEAD(changed_on) OVER (PARTITION BY customer_id ORDER BY changed_on),'-1 day'),'9999-12-31') AS effective_to,\n  CASE WHEN LEAD(changed_on) OVER (PARTITION BY customer_id ORDER BY changed_on) IS NULL THEN 1 ELSE 0 END AS is_current\nFROM allc ORDER BY customer_id, effective_from;", "ordered": true, "hints": ["Union all events first, then rebuild — don't try to patch the existing rows in place.", "The backdated event splits the previously open bronze range into two."], "walkthrough": ["Combining both event sources gives the full, correct change timeline.", "Sorting by change date and using LEAD closes each interval the day before the next one.", "Bronze now ends 2024-03-14 instead of 2024-05-31, and silver occupies the gap."], "explanation": "The realistic follow-up to the SCD2 build question, and the honest answer is uncomfortable: correcting backdated history usually means recomputing the affected keys from the full event log, not patching rows. That is precisely why immutable event tables plus rebuildable dimensions (the dbt snapshot / Delta approach) beat in-place UPDATE pipelines.", "company": null, "seen": "Core DE pattern"}, {"id": "q94", "title": "Detect Duplicate Customers by Fuzzy Key", "difficulty": "Hard", "pattern": "Entity resolution", "topics": ["Strings", "Dedup", "Data Quality"], "prompt": "Find likely duplicate customer records: rows whose normalised email (lower-cased, trimmed) matches another row's. Return one row per duplicate group with the count and the smallest id.\n\n**Output columns:** `norm_email`, `dup_count`, `keep_id`\n**Order by:** `norm_email`", "setup": "CREATE TABLE customers (customer_id INTEGER, name TEXT, email TEXT);\nINSERT INTO customers VALUES (1,'Asha','ASHA@X.COM'),(2,'Asha R',' asha@x.com '),(3,'Ravi','ravi@y.com'),\n(4,'Meera','MEERA@Z.COM'),(5,'M K','meera@z.com'),(6,'Meera K','  Meera@Z.com'),(7,'John','john@w.com');", "solution": "SELECT LOWER(TRIM(email)) AS norm_email, COUNT(*) AS dup_count, MIN(customer_id) AS keep_id\nFROM customers GROUP BY LOWER(TRIM(email)) HAVING COUNT(*) > 1\nORDER BY norm_email;", "ordered": true, "hints": ["Normalise before grouping — the raw values all differ, the normalised ones don't.", "MIN(customer_id) is the survivor under a 'keep oldest' merge rule."], "walkthrough": ["`LOWER(TRIM(email))` collapses casing and whitespace variants to a single canonical key.", "Grouping on that expression clusters the duplicates.", "HAVING keeps only real collision groups, and MIN picks the record to survive a merge."], "explanation": "Entity resolution starts exactly here. Real systems go further — Soundex/Levenshtein on names, normalising Gmail dots and plus-addressing, and blocking keys to avoid O(n²) comparisons — but the interview answer is: normalise into a canonical key, group, then define a deterministic survivorship rule.", "company": null, "seen": "Core DE pattern"}, {"id": "q95", "title": "Rank Customers With Multiple Tie-Breakers", "difficulty": "Medium", "pattern": "Composite ordering", "topics": ["Ranking", "Window Functions"], "prompt": "Rank customers by total spend descending; break ties by earliest signup date, then by customer id.\n\n**Output columns:** `customer_id`, `total_spend`, `signup_date`, `rnk`\n**Order by:** `rnk`", "setup": "CREATE TABLE customers (customer_id INTEGER, signup_date TEXT);\nINSERT INTO customers VALUES (1,'2023-05-01'),(2,'2022-01-15'),(3,'2024-02-02'),(4,'2021-11-30');\nCREATE TABLE orders (customer_id INTEGER, amount REAL);\nINSERT INTO orders VALUES (1,300),(2,200),(2,100),(3,150),(3,150),(4,50);", "solution": "WITH s AS (\n  SELECT c.customer_id, c.signup_date, COALESCE(SUM(o.amount),0) AS total_spend\n  FROM customers c LEFT JOIN orders o ON o.customer_id=c.customer_id\n  GROUP BY c.customer_id, c.signup_date)\nSELECT customer_id, total_spend, signup_date,\n       ROW_NUMBER() OVER (ORDER BY total_spend DESC, signup_date ASC, customer_id ASC) AS rnk\nFROM s ORDER BY rnk;", "ordered": true, "hints": ["Three customers tie at 300 — the tie-breakers must resolve them deterministically.", "Aggregate before ranking, not after."], "walkthrough": ["The CTE totals spend per customer, keeping customers with no orders at 0.", "Customers 1, 2 and 3 all reach 300, so the ORDER BY falls through to signup date.", "Customer 2 signed up earliest among them, so it ranks first."], "explanation": "Deterministic ordering matters more than it sounds: without full tie-breakers, the same query returns different row assignments on different runs or after a repartition, which makes downstream diffs and incremental loads unstable. Always make ROW_NUMBER's ORDER BY a total order.", "company": null, "seen": "Core DE pattern"}, {"id": "q96", "title": "QUALIFY Equivalent", "difficulty": "Medium", "pattern": "Dialect translation", "topics": ["Window Functions", "Dedup"], "prompt": "In Snowflake and Databricks you would write `QUALIFY ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_ts DESC) = 1`. SQLite has no QUALIFY — write the portable equivalent to keep each user's latest event.\n\n**Output columns:** `user_id`, `event_type`, `event_ts`\n**Order by:** `user_id`", "setup": "CREATE TABLE events (user_id INTEGER, event_type TEXT, event_ts TEXT);\nINSERT INTO events VALUES (1,'login','2024-03-01 09:00:00'),(1,'purchase','2024-03-01 11:00:00'),\n(2,'login','2024-03-02 08:00:00'),(3,'view','2024-03-01 07:00:00'),(3,'logout','2024-03-05 22:00:00');", "solution": "SELECT user_id, event_type, event_ts FROM (\n  SELECT user_id, event_type, event_ts,\n         ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_ts DESC) AS rn\n  FROM events) WHERE rn = 1 ORDER BY user_id;", "ordered": true, "hints": ["Window functions are evaluated after WHERE, so you need a nesting level to filter on them.", "A CTE and a subquery are equally valid wrappers."], "walkthrough": ["The inner query computes the row number per user.", "The outer query can now reference `rn` because the window has already been evaluated.", "Filtering `rn = 1` keeps only each user's most recent event."], "explanation": "QUALIFY is syntactic sugar for exactly this nesting, and it only exists in Snowflake, Databricks, BigQuery and Teradata. Knowing both forms matters because your interview may be on one dialect and your job on another — and 'why can't I filter a window function in WHERE?' is a favourite conceptual probe about logical execution order.", "company": null, "seen": "Core DE pattern"}, {"id": "q97", "title": "Which Rows Would MERGE Reject", "difficulty": "Hard", "pattern": "MERGE semantics", "topics": ["Incremental Load", "Dedup", "Data Quality"], "prompt": "A Delta Lake `MERGE INTO` fails when the source contains more than one row matching the same target key. Before merging, find the offending source keys and how many rows each has.\n\n**Output columns:** `id`, `source_rows`\n**Order by:** `id`", "setup": "CREATE TABLE target (id INTEGER, val TEXT);\nINSERT INTO target VALUES (1,'a'),(2,'b'),(3,'c');\nCREATE TABLE source (id INTEGER, val TEXT, updated_at TEXT);\nINSERT INTO source VALUES (1,'a1','2024-03-01'),(1,'a2','2024-03-02'),(2,'b1','2024-03-01'),\n(4,'d1','2024-03-01'),(4,'d2','2024-03-02'),(4,'d3','2024-03-03');", "solution": "SELECT id, COUNT(*) AS source_rows FROM source GROUP BY id HAVING COUNT(*) > 1 ORDER BY id;", "ordered": true, "hints": ["The check is on the source alone — duplicates in the source key are what break MERGE.", "Key 4 doesn't exist in the target yet, but multiple inserts for one key are still ambiguous."], "walkthrough": ["Group the source by the merge key.", "Any group with more than one row is non-deterministic for MERGE to apply.", "Both key 1 (matched) and key 4 (unmatched) qualify."], "explanation": "Delta throws `UNSUPPORTED_MERGE_MULTIPLE_SOURCE_ROWS`; Snowflake either errors or silently picks one depending on ERROR_ON_NONDETERMINISTIC_MERGE. The production fix is always to deduplicate the source to one row per key first — usually ROW_NUMBER on the latest timestamp. Running this check as a pre-merge assertion is a genuinely good practice to mention.", "company": null, "seen": "Core DE pattern"}, {"id": "q98", "title": "Time Travel Diff Between Versions", "difficulty": "Medium", "pattern": "Version comparison", "topics": ["Data Quality", "Joins"], "prompt": "Two table versions are stored as separate tables (simulating Delta `VERSION AS OF`). Classify every key as `inserted`, `deleted`, `updated` or `unchanged`.\n\n**Output columns:** `id`, `change_type`\n**Order by:** `id`", "setup": "CREATE TABLE v1 (id INTEGER, val TEXT);\nINSERT INTO v1 VALUES (1,'a'),(2,'b'),(3,'c'),(4,'d');\nCREATE TABLE v2 (id INTEGER, val TEXT);\nINSERT INTO v2 VALUES (1,'a'),(2,'B'),(4,'d'),(5,'e');", "solution": "SELECT id, change_type FROM (\n  SELECT v1.id AS id,\n         CASE WHEN v2.id IS NULL THEN 'deleted'\n              WHEN v1.val <> v2.val THEN 'updated' ELSE 'unchanged' END AS change_type\n  FROM v1 LEFT JOIN v2 ON v2.id=v1.id\n  UNION ALL\n  SELECT v2.id, 'inserted' FROM v2 WHERE NOT EXISTS (SELECT 1 FROM v1 WHERE v1.id=v2.id)\n) ORDER BY id;", "ordered": true, "hints": ["Left side classifies deleted/updated/unchanged; a second branch adds the inserts.", "Compare values only for keys present on both sides."], "walkthrough": ["The LEFT JOIN covers every key in v1: missing on the right means deleted, differing value means updated.", "The anti-join branch finds keys that exist only in v2, which are inserts.", "Stacking both branches gives a complete change classification."], "explanation": "This is what `SELECT * FROM t VERSION AS OF 5 EXCEPT SELECT * FROM t VERSION AS OF 6` gives you in Delta, and what Iceberg snapshot diffs and Snowflake Time Travel are for. Useful in interviews to show you think about auditability and rollback, not just forward loads.", "company": null, "seen": "Core DE pattern"}, {"id": "q99", "title": "Flatten a JSON Array", "difficulty": "Hard", "pattern": "Semi-structured explode", "topics": ["JSON", "Recursive CTE"], "prompt": "Each order stores its items as a JSON array. Produce one row per item.\n\n**Output columns:** `order_id`, `sku`, `qty`\n**Order by:** `order_id`, `sku`", "setup": "CREATE TABLE orders_json (order_id INTEGER, items TEXT);\nINSERT INTO orders_json VALUES\n(1,'[{\"sku\":\"A1\",\"qty\":2},{\"sku\":\"B2\",\"qty\":1}]'),\n(2,'[{\"sku\":\"C3\",\"qty\":5}]'),\n(3,'[{\"sku\":\"A1\",\"qty\":1},{\"sku\":\"D4\",\"qty\":3},{\"sku\":\"E5\",\"qty\":7}]');", "solution": "WITH RECURSIVE idx(order_id, items, i, n) AS (\n  SELECT order_id, items, 0, json_array_length(items) FROM orders_json\n  UNION ALL\n  SELECT order_id, items, i+1, n FROM idx WHERE i+1 < n)\nSELECT order_id,\n       json_extract(items,'$['||i||'].sku') AS sku,\n       json_extract(items,'$['||i||'].qty') AS qty\nFROM idx ORDER BY order_id, sku;", "ordered": true, "hints": ["json_array_length gives the element count; recurse over indices 0..n-1.", "Build the JSON path dynamically by concatenating the index."], "walkthrough": ["The anchor emits index 0 for each order along with the array length.", "Each recursive step increments the index while it remains below the length.", "Extracting `$[i].field` for every index yields one row per array element."], "explanation": "The portable version of `LATERAL FLATTEN(input => items)` in Snowflake or `explode(from_json(...))` in Spark. Bronze layers are full of nested arrays, so this shape is common in Databricks/Snowflake-flavoured interviews — and knowing the manual version proves you understand what FLATTEN actually does.", "company": null, "seen": "Core DE pattern"}, {"id": "q100", "title": "Watermark With Late-Arriving Window", "difficulty": "Hard", "pattern": "Late data handling", "topics": ["Streaming", "Incremental Load", "Dates"], "prompt": "Events carry both an `event_ts` (when it happened) and an `ingest_ts` (when it landed). With a 2-day lateness allowance, return per event day the count of events that arrived on time and the count that arrived late.\n\n**Output columns:** `event_day`, `on_time`, `late`\n**Order by:** `event_day`", "setup": "CREATE TABLE events (event_id INTEGER, event_ts TEXT, ingest_ts TEXT);\nINSERT INTO events VALUES\n(1,'2024-03-01','2024-03-01'),(2,'2024-03-01','2024-03-02'),(3,'2024-03-01','2024-03-06'),\n(4,'2024-03-02','2024-03-02'),(5,'2024-03-02','2024-03-09'),\n(6,'2024-03-03','2024-03-04'),(7,'2024-03-03','2024-03-05');", "solution": "SELECT event_ts AS event_day,\n  SUM(CASE WHEN julianday(ingest_ts)-julianday(event_ts) <= 2 THEN 1 ELSE 0 END) AS on_time,\n  SUM(CASE WHEN julianday(ingest_ts)-julianday(event_ts) >  2 THEN 1 ELSE 0 END) AS late\nFROM events GROUP BY event_ts ORDER BY event_day;", "ordered": true, "hints": ["Lateness is the gap between ingest time and event time, not a fixed calendar date.", "Exactly 2 days counts as on time here — mind the boundary."], "walkthrough": ["Subtracting julian days gives the ingestion delay per event.", "Conditional sums split each event day into on-time and late counts.", "Event 3 (5 days late) and event 5 (7 days late) fall outside the allowance."], "explanation": "This is the core tension in streaming: a watermark closes a window so results can be emitted, but anything arriving after it is either dropped or forces a restatement. Spark Structured Streaming's `withWatermark`, Flink's allowed lateness and Kafka Streams' grace period all encode this trade-off. Knowing that late data is a *business* decision, not just a config value, is the senior answer.", "company": null, "seen": "Core DE pattern"}, {"id": "q101", "title": "Small Files Detection", "difficulty": "Medium", "pattern": "Storage profiling", "topics": ["Performance", "Aggregation"], "prompt": "From a file manifest, return partitions where the average file size is below 32 MB (33554432 bytes) and there are more than 2 files — the classic small-files problem.\n\n**Output columns:** `partition_dt`, `file_count`, `avg_bytes` (rounded to 0 decimals)\n**Order by:** `file_count` descending, then `partition_dt`", "setup": "CREATE TABLE file_manifest (partition_dt TEXT, file_name TEXT, size_bytes INTEGER);\nINSERT INTO file_manifest VALUES\n('2024-03-01','f1',134217728),('2024-03-01','f2',134217728),\n('2024-03-02','g1',1048576),('2024-03-02','g2',2097152),('2024-03-02','g3',1048576),('2024-03-02','g4',524288),\n('2024-03-03','h1',20971520),('2024-03-03','h2',20971520),('2024-03-03','h3',20971520),\n('2024-03-04','i1',500000);", "solution": "SELECT partition_dt, COUNT(*) AS file_count, ROUND(AVG(size_bytes),0) AS avg_bytes\nFROM file_manifest GROUP BY partition_dt\nHAVING AVG(size_bytes) < 33554432 AND COUNT(*) > 2\nORDER BY file_count DESC, partition_dt;", "ordered": true, "hints": ["Both conditions are aggregates, so both belong in HAVING.", "A single small file isn't a problem — it's many small files that hurt."], "walkthrough": ["Group the manifest by partition.", "Average file size below the threshold identifies fragmented partitions.", "Requiring more than 2 files excludes low-volume partitions that are small simply because there's little data."], "explanation": "Directly relevant to Delta/Iceberg operations — this is the query behind deciding when to run OPTIMIZE / compaction. Each small file costs a separate task launch and metadata read, so thousands of them can dominate job runtime. Mention auto-compaction, optimizeWrite, and target file sizes around 128 MB to 1 GB.", "company": null, "seen": "Core DE pattern"}, {"id": "q102", "title": "Second Purchase Date per Customer", "difficulty": "Medium", "pattern": "Nth event per group", "topics": ["Window Functions"], "prompt": "Return each customer's second purchase date. Customers with fewer than two purchases must not appear.\n\n**Output columns:** `customer_id`, `second_purchase_date`\n**Order by:** `customer_id`", "setup": "CREATE TABLE purchases (customer_id INTEGER, purchase_date TEXT);\nINSERT INTO purchases VALUES (1,'2024-01-01'),(1,'2024-02-15'),(1,'2024-03-20'),\n(2,'2024-01-10'),(3,'2024-02-01'),(3,'2024-02-05'),(4,'2024-04-01');", "solution": "SELECT customer_id, purchase_date AS second_purchase_date FROM (\n  SELECT customer_id, purchase_date,\n         ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY purchase_date) AS rn\n  FROM purchases) WHERE rn=2 ORDER BY customer_id;", "ordered": true, "hints": ["Number each customer's purchases chronologically and take number 2.", "Customers with one purchase never produce an rn=2 row, so they drop out naturally."], "walkthrough": ["ROW_NUMBER orders each customer's purchases by date.", "Selecting rn = 2 picks the second one.", "Customers 2 and 4 have a single purchase, so they produce no row at all."], "explanation": "Time-to-second-purchase is a core retention metric, and this is its building block. Natural follow-up: return the *gap* between first and second purchase, which is a LAG or a self-join on rn — and the average of that gap is what growth teams actually track.", "company": null, "seen": "Core DE pattern"}, {"id": "q103", "title": "Customers Who Bought A but Not B", "difficulty": "Medium", "pattern": "Set difference on behaviour", "topics": ["Set Operations", "Joins"], "prompt": "Return customers who purchased product `'A'` but never purchased product `'B'`.\n\n**Output columns:** `customer_id`\n**Order by:** `customer_id`", "setup": "CREATE TABLE purchases (customer_id INTEGER, product TEXT);\nINSERT INTO purchases VALUES (1,'A'),(1,'B'),(2,'A'),(2,'C'),(3,'B'),(4,'A'),(5,'A'),(5,'A'),(6,'C');", "solution": "SELECT DISTINCT p.customer_id FROM purchases p\nWHERE p.product='A'\n  AND NOT EXISTS (SELECT 1 FROM purchases q WHERE q.customer_id=p.customer_id AND q.product='B')\nORDER BY p.customer_id;", "ordered": true, "hints": ["The condition is on the customer, not the row — a single WHERE with both predicates returns nothing.", "EXCEPT on two customer-id sets is an equally valid answer."], "walkthrough": ["Rows with product A identify candidate customers.", "The NOT EXISTS check tests the customer's entire purchase history for a B.", "DISTINCT collapses customer 5's two A purchases into one output row."], "explanation": "The classic mistake is `WHERE product='A' AND product<>'B'`, which is always true for A rows and returns everyone. Recognising that the predicate applies at the *entity* level rather than the row level is the actual skill — and it generalises to cross-sell, churn and eligibility queries.", "company": null, "seen": "Core DE pattern"}, {"id": "q104", "title": "Pivot Without Knowing the Values", "difficulty": "Hard", "pattern": "Grouping sets / rollup", "topics": ["Aggregation", "CASE"], "prompt": "Return sales totalled by region, by category, and overall, in one result set — a rollup.\n\nUse `'ALL'` as the placeholder in whichever column is being aggregated over.\n\n**Output columns:** `region`, `category`, `total`\n**Order by:** `region`, `category`", "setup": "CREATE TABLE sales (region TEXT, category TEXT, amount REAL);\nINSERT INTO sales VALUES ('APAC','elec',100),('APAC','food',50),('EMEA','elec',200),('EMEA','food',80),('EMEA','toys',20);", "solution": "SELECT region, category, SUM(amount) AS total FROM sales GROUP BY region, category\nUNION ALL\nSELECT region,'ALL', SUM(amount) FROM sales GROUP BY region\nUNION ALL\nSELECT 'ALL','ALL', SUM(amount) FROM sales\nORDER BY region, category;", "ordered": true, "hints": ["Each aggregation level is its own SELECT, stacked with UNION ALL.", "Engines with GROUPING SETS / ROLLUP do this in one pass."], "walkthrough": ["The first branch gives the finest grain: region by category.", "The second aggregates away the category, leaving region subtotals.", "The third collapses everything to a grand total; UNION ALL stacks all three levels."], "explanation": "Postgres, Snowflake, Databricks and SQL Server support `GROUP BY ROLLUP(region, category)` or `GROUPING SETS`, which do this in a single scan rather than three. Knowing both matters: the UNION ALL form is portable but reads the table once per level, which is a real cost on large fact tables.", "company": null, "seen": "Core DE pattern"}, {"id": "q105", "title": "Correlated Update Simulation", "difficulty": "Medium", "pattern": "Correlated subquery", "topics": ["Subquery", "Joins"], "prompt": "Each product's price should be updated to its category's average price. Return what the table would look like after that update.\n\n**Output columns:** `product_id`, `category`, `old_price`, `new_price` (rounded to 2 decimals)\n**Order by:** `product_id`", "setup": "CREATE TABLE products (product_id INTEGER, category TEXT, price REAL);\nINSERT INTO products VALUES (1,'elec',100),(2,'elec',200),(3,'elec',300),(4,'food',10),(5,'food',20);", "solution": "SELECT p.product_id, p.category, p.price AS old_price,\n  ROUND((SELECT AVG(p2.price) FROM products p2 WHERE p2.category=p.category),2) AS new_price\nFROM products p ORDER BY p.product_id;", "ordered": true, "hints": ["The subquery is correlated: it references the outer row's category.", "AVG(price) OVER (PARTITION BY category) is the window-function equivalent."], "walkthrough": ["For each product, the subquery averages prices within that product's own category.", "Elec averages to 200, food to 15.", "The result shows the before and after values side by side."], "explanation": "Correlated subqueries execute conceptually once per outer row, which is why they're slow at scale and why the window version is preferred. But they're unavoidable in `UPDATE ... SET x = (SELECT ...)` statements in engines without UPDATE FROM — worth knowing both forms.", "company": null, "seen": "Core DE pattern"}, {"id": "q106", "title": "Find the Missing Sequence Numbers", "difficulty": "Medium", "pattern": "Gap detection", "topics": ["Gaps and Islands", "Data Quality"], "prompt": "Kafka offsets should be contiguous. Given the offsets that landed, return the missing ones between the min and max.\n\n**Output columns:** `missing_offset`\n**Order by:** `missing_offset`", "setup": "CREATE TABLE ingested (offset_id INTEGER);\nINSERT INTO ingested VALUES (100),(101),(102),(105),(106),(109),(110);", "solution": "WITH RECURSIVE r(n) AS (\n  SELECT MIN(offset_id) FROM ingested\n  UNION ALL\n  SELECT n+1 FROM r WHERE n < (SELECT MAX(offset_id) FROM ingested))\nSELECT n AS missing_offset FROM r\nWHERE n NOT IN (SELECT offset_id FROM ingested) ORDER BY n;", "ordered": true, "hints": ["Generate the full integer range, then anti-join against what actually landed.", "NOT IN is safe here only because offset_id has no NULLs."], "walkthrough": ["The recursive CTE counts from the minimum offset to the maximum.", "Anti-joining against the ingested offsets leaves only the gaps.", "Offsets 103, 104, 107 and 108 are missing."], "explanation": "Completeness checking for streaming ingestion. The alternative pattern is to compare `MAX - MIN + 1` against `COUNT(*)` for a quick cardinality check, then only enumerate gaps when the counts disagree — much cheaper on large partitions. Also mention that a NULL in the anti-join column would break NOT IN entirely.", "company": null, "seen": "Core DE pattern"}, {"id": "q107", "title": "Deduplicate Across Overlapping Batches", "difficulty": "Hard", "pattern": "Batch overlap dedup", "topics": ["Dedup", "Incremental Load", "Window Functions"], "prompt": "Two overlapping extract batches were loaded. For each business key keep the row from the highest `batch_id`, and within a batch the latest `updated_at`.\n\n**Output columns:** `business_key`, `val`, `batch_id`, `updated_at`\n**Order by:** `business_key`", "setup": "CREATE TABLE staged (business_key TEXT, val TEXT, batch_id INTEGER, updated_at TEXT);\nINSERT INTO staged VALUES\n('K1','v1',1,'2024-03-01 10:00:00'),('K1','v2',2,'2024-03-01 09:00:00'),\n('K2','w1',1,'2024-03-01 08:00:00'),('K2','w2',1,'2024-03-01 12:00:00'),\n('K3','x1',2,'2024-03-02 10:00:00'),\n('K4','y1',1,'2024-03-01 07:00:00'),('K4','y2',2,'2024-03-02 06:00:00'),('K4','y3',2,'2024-03-02 08:00:00');", "solution": "SELECT business_key, val, batch_id, updated_at FROM (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY business_key ORDER BY batch_id DESC, updated_at DESC) AS rn\n  FROM staged) WHERE rn=1 ORDER BY business_key;", "ordered": true, "hints": ["The ordering is hierarchical: batch first, then timestamp within the batch.", "K1 is the trap — the newer batch carries an older timestamp."], "walkthrough": ["Partition by the business key and order by batch descending, then timestamp descending.", "K1 picks `v2` from batch 2 even though its timestamp is earlier, because batch precedence wins.", "Filtering rn = 1 leaves exactly one row per key."], "explanation": "Reprocessing and backfills constantly produce overlapping batches, and the K1 case forces you to make the precedence rule explicit. There is no universally right answer — batch-wins is correct for full-refresh extracts, timestamp-wins for CDC. State the assumption; that's what's being graded.", "company": null, "seen": "Core DE pattern"}, {"id": "q108", "title": "Compute Retention Percentage", "difficulty": "Hard", "pattern": "Cohort with denominator", "topics": ["Cohort", "Aggregation", "Dates"], "prompt": "Extend cohort retention to percentages: for each signup-month cohort return the cohort size and the retention rate for months 0, 1 and 2.\n\n**Output columns:** `cohort_month`, `month_number`, `active_users`, `cohort_size`, `retention_pct` (rounded to 2 decimals)\n**Order by:** `cohort_month`, `month_number`", "setup": "CREATE TABLE users (user_id INTEGER, signup_date TEXT);\nINSERT INTO users VALUES (1,'2024-01-05'),(2,'2024-01-15'),(3,'2024-01-25'),(4,'2024-02-10'),(5,'2024-02-20');\nCREATE TABLE activity (user_id INTEGER, activity_date TEXT);\nINSERT INTO activity VALUES (1,'2024-01-06'),(2,'2024-01-16'),(3,'2024-01-26'),\n(1,'2024-02-06'),(2,'2024-02-16'),(1,'2024-03-06'),\n(4,'2024-02-11'),(5,'2024-02-21'),(4,'2024-03-11');", "solution": "WITH c AS (SELECT user_id, strftime('%Y-%m',signup_date) AS cohort_month FROM users),\nsz AS (SELECT cohort_month, COUNT(*) AS cohort_size FROM c GROUP BY cohort_month),\na AS (SELECT c.cohort_month,\n        (CAST(strftime('%Y',ac.activity_date) AS INTEGER)*12+CAST(strftime('%m',ac.activity_date) AS INTEGER))\n      - (CAST(strftime('%Y',u.signup_date) AS INTEGER)*12+CAST(strftime('%m',u.signup_date) AS INTEGER)) AS month_number,\n        ac.user_id\n      FROM activity ac JOIN users u ON u.user_id=ac.user_id JOIN c ON c.user_id=ac.user_id)\nSELECT a.cohort_month, a.month_number, COUNT(DISTINCT a.user_id) AS active_users, sz.cohort_size,\n       ROUND(100.0*COUNT(DISTINCT a.user_id)/sz.cohort_size,2) AS retention_pct\nFROM a JOIN sz ON sz.cohort_month=a.cohort_month\nWHERE a.month_number BETWEEN 0 AND 2\nGROUP BY a.cohort_month, a.month_number, sz.cohort_size\nORDER BY a.cohort_month, a.month_number;", "ordered": true, "hints": ["The cohort size must be computed from the users table, not from the activity table.", "Join the size back on cohort_month so every row carries its denominator."], "walkthrough": ["Assign each user a cohort month from their signup date and count cohort sizes separately.", "Compute the month offset between each activity and that user's signup.", "Divide distinct actives by the cohort size to get the retention rate."], "explanation": "The denominator is where people go wrong: deriving cohort size from users who *were active* rather than users who *signed up* inflates retention to look artificially healthy. Month 0 should be at or near 100% — if it isn't, that's a data-quality signal, not a product insight.", "company": null, "seen": "Core DE pattern"}, {"id": "q109", "title": "Self-Join on a Range Condition", "difficulty": "Hard", "pattern": "Range join", "topics": ["Joins", "Performance"], "prompt": "For each support ticket, count how many other tickets from the same customer were opened within 7 days before it (excluding itself).\n\n**Output columns:** `ticket_id`, `customer_id`, `opened_on`, `prior_7d_tickets`\n**Order by:** `ticket_id`", "setup": "CREATE TABLE tickets (ticket_id INTEGER, customer_id INTEGER, opened_on TEXT);\nINSERT INTO tickets VALUES (1,1,'2024-03-01'),(2,1,'2024-03-03'),(3,1,'2024-03-06'),(4,1,'2024-03-20'),\n(5,2,'2024-03-02'),(6,2,'2024-03-04');", "solution": "SELECT t.ticket_id, t.customer_id, t.opened_on,\n  (SELECT COUNT(*) FROM tickets p\n   WHERE p.customer_id=t.customer_id AND p.ticket_id<>t.ticket_id\n     AND p.opened_on < t.opened_on AND p.opened_on >= date(t.opened_on,'-7 day')) AS prior_7d_tickets\nFROM tickets t ORDER BY t.ticket_id;", "ordered": true, "hints": ["Strictly-before plus within-7-days defines the lookback window.", "Ticket 4 is 14 days after ticket 3, so its window is empty."], "walkthrough": ["For each ticket, the correlated subquery scans the same customer's other tickets.", "The two date predicates bound the window to the 7 days before it.", "Ticket 3 sees both tickets 1 and 2; ticket 4 sees none."], "explanation": "Range joins are expensive because they can't use a hash join — the engine falls back to nested loops or sort-merge. In Databricks you'd add a RANGE_JOIN hint with a bin size; in Spark generally you'd bucket by date first. `RANGE BETWEEN INTERVAL '7' DAY PRECEDING` is the window-function alternative where the dialect supports it.", "company": null, "seen": "Core DE pattern"}, {"id": "q110", "title": "Weighted Average", "difficulty": "Medium", "pattern": "Weighted aggregation", "topics": ["Aggregation"], "prompt": "Return the weighted average price per product, weighted by quantity — not the simple average of the unit prices.\n\n**Output columns:** `product`, `simple_avg` (rounded to 2 decimals), `weighted_avg` (rounded to 2 decimals)\n**Order by:** `product`", "setup": "CREATE TABLE sales (product TEXT, qty INTEGER, unit_price REAL);\nINSERT INTO sales VALUES ('a',1,100),('a',99,10),('b',5,20),('b',5,40),('c',10,7.5);", "solution": "SELECT product, ROUND(AVG(unit_price),2) AS simple_avg,\n       ROUND(SUM(qty*unit_price)/SUM(qty),2) AS weighted_avg\nFROM sales GROUP BY product ORDER BY product;", "ordered": true, "hints": ["Weighted average = SUM(value * weight) / SUM(weight).", "Product 'a' shows a dramatic gap between the two — that's the point."], "walkthrough": ["`AVG(unit_price)` treats both rows for product a equally, giving 55.", "The weighted version divides total revenue by total quantity, giving 10.9.", "The second number reflects what customers actually paid on average."], "explanation": "A conceptual trap disguised as arithmetic. Averaging an average is one of the most common analytical errors in reporting — average order value, average conversion rate and average price all need weighting. The general rule: ratios don't aggregate; recompute them from summed numerators and denominators.", "company": null, "seen": "Core DE pattern"}, {"id": "q111", "title": "Find Consecutive Failures", "difficulty": "Hard", "pattern": "Consecutive run of a state", "topics": ["Gaps and Islands", "Window Functions", "Data Quality"], "prompt": "Alert when a pipeline fails 3 or more times in a row. Return each qualifying failure streak.\n\n**Output columns:** `pipeline`, `streak_len`, `streak_start`, `streak_end`\n**Order by:** `pipeline`, `streak_start`", "setup": "CREATE TABLE runs (pipeline TEXT, run_date TEXT, status TEXT);\nINSERT INTO runs VALUES\n('ingest','2024-03-01','failed'),('ingest','2024-03-02','failed'),('ingest','2024-03-03','failed'),('ingest','2024-03-04','success'),\n('ingest','2024-03-05','failed'),('ingest','2024-03-06','failed'),\n('agg','2024-03-01','success'),('agg','2024-03-02','failed'),('agg','2024-03-03','failed'),\n('agg','2024-03-04','failed'),('agg','2024-03-05','failed');", "solution": "WITH n AS (\n  SELECT pipeline, run_date, status,\n         ROW_NUMBER() OVER (PARTITION BY pipeline ORDER BY run_date) AS rn_all,\n         ROW_NUMBER() OVER (PARTITION BY pipeline, status ORDER BY run_date) AS rn_status\n  FROM runs),\ng AS (SELECT * , rn_all - rn_status AS grp FROM n WHERE status='failed')\nSELECT pipeline, COUNT(*) AS streak_len, MIN(run_date) AS streak_start, MAX(run_date) AS streak_end\nFROM g GROUP BY pipeline, grp HAVING COUNT(*) >= 3 ORDER BY pipeline, streak_start;", "ordered": true, "hints": ["The difference between an overall row number and a per-status row number is constant within a run of the same status.", "Filter to failures only after computing both row numbers."], "walkthrough": ["Number all runs per pipeline, and separately number runs within each status.", "For a consecutive block of the same status, the difference between those two numbers stays constant.", "Grouping failures by that difference gives the streaks; HAVING keeps ones of length 3 or more."], "explanation": "The two-row-number variant of gaps-and-islands, used when the grouping is by a *state* rather than a date sequence. It's the query behind alerting rules like 'page me after 3 consecutive failures' and behind detecting sustained anomalies rather than one-off blips.", "company": null, "seen": "Core DE pattern"}, {"id": "q112", "title": "Distinct Count per Rolling Window", "difficulty": "Hard", "pattern": "Rolling distinct", "topics": ["Window Functions", "Dates", "Aggregation"], "prompt": "Return, for each day present in the data, the number of distinct users active over that day and the two prior days (trailing 3-day unique users).\n\n**Output columns:** `d`, `unique_users_3d`\n**Order by:** `d`", "setup": "CREATE TABLE activity (user_id INTEGER, d TEXT);\nINSERT INTO activity VALUES (1,'2024-03-01'),(2,'2024-03-01'),(1,'2024-03-02'),(3,'2024-03-02'),\n(4,'2024-03-03'),(1,'2024-03-03'),(5,'2024-03-04'),(2,'2024-03-05'),(5,'2024-03-05');", "solution": "WITH days AS (SELECT DISTINCT d FROM activity)\nSELECT dd.d, COUNT(DISTINCT a.user_id) AS unique_users_3d\nFROM days dd JOIN activity a ON a.d <= dd.d AND a.d >= date(dd.d,'-2 day')\nGROUP BY dd.d ORDER BY dd.d;", "ordered": true, "hints": ["COUNT(DISTINCT) can't be used as a window function — use a range self-join instead.", "Each anchor day gathers the rows inside its own trailing window."], "walkthrough": ["A distinct list of days provides the anchors.", "The range join attaches every activity row within the trailing 3-day span of each anchor.", "Counting distinct users inside each group gives rolling unique users."], "explanation": "Rolling DAU/WAU/MAU is a genuinely hard SQL problem precisely because distinct counts are non-additive — you cannot sum daily uniques to get weekly uniques. That's why production systems store HyperLogLog sketches per day and merge them, which is the answer that impresses in an interview.", "company": null, "seen": "Core DE pattern"}, {"id": "q113", "title": "Bridge Table Many-to-Many", "difficulty": "Medium", "pattern": "Bridge / junction table", "topics": ["Joins", "Modeling"], "prompt": "Products belong to multiple categories via a bridge table. Return total sales per category, and explain-by-output that a product's sales are counted in every category it belongs to.\n\n**Output columns:** `category`, `attributed_sales` (rounded to 2 decimals)\n**Order by:** `category`", "setup": "CREATE TABLE product_sales (product_id INTEGER, amount REAL);\nINSERT INTO product_sales VALUES (1,100),(2,200),(3,50);\nCREATE TABLE product_category (product_id INTEGER, category TEXT);\nINSERT INTO product_category VALUES (1,'elec'),(1,'gadgets'),(2,'elec'),(3,'toys'),(3,'gadgets');", "solution": "SELECT pc.category, ROUND(SUM(ps.amount),2) AS attributed_sales\nFROM product_sales ps JOIN product_category pc ON pc.product_id=ps.product_id\nGROUP BY pc.category ORDER BY pc.category;", "ordered": true, "hints": ["The join through the bridge intentionally duplicates each sale once per category.", "The category totals will sum to more than total sales — that's expected here."], "walkthrough": ["Joining sales to the bridge fans each sale out to one row per category membership.", "Grouping by category sums those attributed rows.", "Product 1's 100 counts in both elec and gadgets, so category totals exceed the 350 true total."], "explanation": "Many-to-many dimensions break additivity, and interviewers want you to notice unprompted. The two standard fixes are an allocation factor in the bridge (weights summing to 1 per product) so totals reconcile, or clearly labelling the metric as 'attributed' and never summing across categories.", "company": null, "seen": "Core DE pattern"}, {"id": "q114", "title": "Grain Check — Prove Uniqueness", "difficulty": "Medium", "pattern": "Grain validation", "topics": ["Data Quality", "Aggregation"], "prompt": "Verify the claimed grain of a fact table (one row per `order_id` + `line_no`). Return a single row reporting whether the grain holds.\n\n**Output columns:** `total_rows`, `distinct_keys`, `grain_holds` (1/0)", "setup": "CREATE TABLE fact_order_line (order_id INTEGER, line_no INTEGER, sku TEXT);\nINSERT INTO fact_order_line VALUES (1,1,'a'),(1,2,'b'),(2,1,'c'),(2,2,'d'),(2,2,'d'),(3,1,'e');", "solution": "SELECT COUNT(*) AS total_rows,\n       (SELECT COUNT(*) FROM (SELECT DISTINCT order_id, line_no FROM fact_order_line)) AS distinct_keys,\n       CASE WHEN COUNT(*) = (SELECT COUNT(*) FROM (SELECT DISTINCT order_id, line_no FROM fact_order_line))\n            THEN 1 ELSE 0 END AS grain_holds\nFROM fact_order_line;", "ordered": false, "hints": ["Compare COUNT(*) against the count of distinct key combinations.", "If they differ, the declared grain is violated."], "walkthrough": ["Count every row in the table.", "Count the distinct combinations of the claimed key columns.", "Order 2 line 2 appears twice, so the counts differ by one and the grain fails."], "explanation": "The single most valuable habit in data engineering: state the grain, then prove it. This exact query is what dbt's `unique` test on a surrogate key compiles to. Every fan-out bug and every double-counted metric traces back to an unverified grain assumption.", "company": null, "seen": "Core DE pattern"}, {"id": "q115", "title": "Compare Metric Across Two Periods Side by Side", "difficulty": "Medium", "pattern": "Period comparison", "topics": ["CASE", "Aggregation", "Dates"], "prompt": "For each region compare Q1 (Jan-Mar) against Q2 (Apr-Jun) 2024 revenue and the absolute difference.\n\n**Output columns:** `region`, `q1_revenue`, `q2_revenue`, `diff`\n**Order by:** `region`", "setup": "CREATE TABLE sales (region TEXT, sale_date TEXT, amount REAL);\nINSERT INTO sales VALUES ('APAC','2024-01-15',100),('APAC','2024-05-10',150),\n('EMEA','2024-02-20',300),('EMEA','2024-03-01',100),('EMEA','2024-04-15',200),\n('AMER','2024-06-30',500);", "solution": "SELECT region,\n  SUM(CASE WHEN sale_date>='2024-01-01' AND sale_date<'2024-04-01' THEN amount ELSE 0 END) AS q1_revenue,\n  SUM(CASE WHEN sale_date>='2024-04-01' AND sale_date<'2024-07-01' THEN amount ELSE 0 END) AS q2_revenue,\n  SUM(CASE WHEN sale_date>='2024-04-01' AND sale_date<'2024-07-01' THEN amount ELSE 0 END)\n  - SUM(CASE WHEN sale_date>='2024-01-01' AND sale_date<'2024-04-01' THEN amount ELSE 0 END) AS diff\nFROM sales GROUP BY region ORDER BY region;", "ordered": true, "hints": ["One conditional SUM per period, both in the same GROUP BY pass.", "AMER has no Q1 sales — the ELSE 0 keeps it at zero rather than NULL."], "walkthrough": ["Each CASE restricts the sum to one quarter using half-open date ranges.", "Both quarters are computed in a single scan of the table.", "The difference column reuses the same two expressions."], "explanation": "Faster and cleaner than self-joining two filtered subqueries, because it reads the table once. The half-open ranges matter again here: `BETWEEN '2024-01-01' AND '2024-03-31'` would drop any timestamped row later than midnight on the 31st.", "company": null, "seen": "Core DE pattern"}, {"id": "q116", "title": "Identify Slowly Changing Attributes", "difficulty": "Medium", "pattern": "Change frequency profiling", "topics": ["Modeling", "Aggregation", "Data Quality"], "prompt": "Before choosing SCD types, profile how often each attribute actually changes. Return per attribute the number of customers whose value changed at least once.\n\n**Output columns:** `attribute`, `customers_changed`\n**Order by:** `customers_changed` descending, then `attribute`", "setup": "CREATE TABLE customer_history (customer_id INTEGER, snapshot_date TEXT, city TEXT, tier TEXT, email TEXT);\nINSERT INTO customer_history VALUES\n(1,'2024-01-01','HYD','gold','a@x.com'),(1,'2024-02-01','HYD','gold','a@x.com'),(1,'2024-03-01','BLR','gold','a2@x.com'),\n(2,'2024-01-01','PNQ','silver','b@x.com'),(2,'2024-02-01','PNQ','gold','b@x.com'),\n(3,'2024-01-01','MUM','bronze','c@x.com'),(3,'2024-02-01','MUM','bronze','c@x.com');", "solution": "WITH d AS (\n  SELECT customer_id,\n    COUNT(DISTINCT city) AS n_city, COUNT(DISTINCT tier) AS n_tier, COUNT(DISTINCT email) AS n_email\n  FROM customer_history GROUP BY customer_id)\nSELECT 'city' AS attribute, SUM(CASE WHEN n_city>1 THEN 1 ELSE 0 END) AS customers_changed FROM d\nUNION ALL SELECT 'tier', SUM(CASE WHEN n_tier>1 THEN 1 ELSE 0 END) FROM d\nUNION ALL SELECT 'email', SUM(CASE WHEN n_email>1 THEN 1 ELSE 0 END) FROM d\nORDER BY customers_changed DESC, attribute;", "ordered": true, "hints": ["More than one distinct value per customer means the attribute changed at some point.", "Compute all the distinct counts in one pass, then unpivot with UNION ALL."], "walkthrough": ["Per customer, count distinct values of each attribute across all snapshots.", "A count above 1 means that attribute changed for that customer.", "Summing the flags per attribute gives the change frequency profile."], "explanation": "Practical modeling work: attributes that never change can stay Type 1, volatile ones need Type 2, and extremely volatile ones (like a session count) probably belong in a fact table rather than a dimension. Profiling before deciding is what distinguishes a designed model from a guessed one.", "company": null, "seen": "Core DE pattern"}, {"id": "q117", "title": "Backfill Missing Values Forward", "difficulty": "Hard", "pattern": "Forward fill / LOCF", "topics": ["Window Functions", "Data Quality"], "prompt": "A sensor reports intermittently. Forward-fill each missing reading with the most recent prior non-NULL value for that sensor.\n\n**Output columns:** `sensor_id`, `d`, `raw_value`, `filled_value`\n**Order by:** `sensor_id`, `d`", "setup": "CREATE TABLE readings (sensor_id INTEGER, d TEXT, raw_value REAL);\nINSERT INTO readings VALUES\n(1,'2024-03-01',10),(1,'2024-03-02',NULL),(1,'2024-03-03',NULL),(1,'2024-03-04',20),(1,'2024-03-05',NULL),\n(2,'2024-03-01',NULL),(2,'2024-03-02',5),(2,'2024-03-03',NULL);", "solution": "WITH g AS (\n  SELECT sensor_id, d, raw_value,\n    (SELECT MAX(r2.d) FROM readings r2\n     WHERE r2.sensor_id=r.sensor_id AND r2.d<=r.d AND r2.raw_value IS NOT NULL) AS src_d\n  FROM readings r)\nSELECT g.sensor_id, g.d, g.raw_value,\n  (SELECT r3.raw_value FROM readings r3 WHERE r3.sensor_id=g.sensor_id AND r3.d=g.src_d) AS filled_value\nFROM g ORDER BY g.sensor_id, g.d;", "ordered": true, "hints": ["Find the latest date at or before the current row that has a non-NULL value, then fetch that value.", "Sensor 2's first row has no prior reading, so it stays NULL."], "walkthrough": ["For each row, locate the most recent date with an actual reading for that sensor.", "Look up the value at that date.", "Rows with no prior reading (sensor 2, day 1) correctly remain NULL."], "explanation": "Last-observation-carried-forward is standard in IoT, pricing and inventory pipelines. Engines with `IGNORE NULLS` support write this as `LAST_VALUE(raw_value IGNORE NULLS) OVER (PARTITION BY sensor_id ORDER BY d)` — available in Snowflake, BigQuery, Oracle and recent Postgres, but not SQLite. Worth stating both, plus the caveat that forward-filling can mask a genuinely dead sensor.", "company": null, "seen": "Core DE pattern"}, {"id": "q118", "title": "Anti-Entropy Check Between Systems", "difficulty": "Hard", "pattern": "Aggregate reconciliation", "topics": ["Data Quality", "Aggregation", "Joins"], "prompt": "Compare daily aggregates between an OLTP export and the warehouse fact table. Report days where either the row count or the summed amount disagrees.\n\n**Output columns:** `d`, `src_rows`, `dw_rows`, `src_amount`, `dw_amount`\n**Order by:** `d`", "setup": "CREATE TABLE src_orders (d TEXT, amount REAL);\nINSERT INTO src_orders VALUES ('2024-03-01',100),('2024-03-01',50),('2024-03-02',200),\n('2024-03-03',75),('2024-03-03',25),('2024-03-04',300);\nCREATE TABLE dw_orders (d TEXT, amount REAL);\nINSERT INTO dw_orders VALUES ('2024-03-01',100),('2024-03-01',50),('2024-03-02',200),\n('2024-03-03',75),('2024-03-04',300),('2024-03-04',10);", "solution": "WITH s AS (SELECT d, COUNT(*) AS r, SUM(amount) AS a FROM src_orders GROUP BY d),\n     w AS (SELECT d, COUNT(*) AS r, SUM(amount) AS a FROM dw_orders GROUP BY d)\nSELECT COALESCE(s.d,w.d) AS d,\n       COALESCE(s.r,0) AS src_rows, COALESCE(w.r,0) AS dw_rows,\n       ROUND(COALESCE(s.a,0),2) AS src_amount, ROUND(COALESCE(w.a,0),2) const SKEY = 'desqlgym:v1';
const TKEY = 'desqlgym:token';
const UKEY = 'desqlgym:username';

/* ============ auth ============ */
function getToken(){ return localStorage.getItem(TKEY); }
function getUsername(){ return localStorage.getItem(UKEY); }
function setSession(token, username){ localStorage.setItem(TKEY, token); localStorage.setItem(UKEY, username); }
function clearSession(){ localStorage.removeItem(TKEY); localStorage.removeItem(UKEY); }
function authHeaders(){ const t=getToken(); return t ? {'Authorization':'Bearer '+t} : {}; }

let authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('on', mode==='login');
  document.getElementById('tabSignup').classList.toggle('on', mode==='signup');
  document.getElementById('authSubmit').textContent = mode==='login' ? 'Log in' : 'Create account';
  document.getElementById('authPass').autocomplete = mode==='login' ? 'current-password' : 'new-password';
  document.getElementById('authErr').textContent='';
}
function showAuthScreen(err){
  document.getElementById('mask').style.display='none';
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('authErr').textContent = err || '';
  document.getElementById('authUser').focus();
}
function hideAuthScreen(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='';
}
document.getElementById('tabLogin').onclick=()=>setAuthMode('login');
document.getElementById('tabSignup').onclick=()=>setAuthMode('signup');
document.getElementById('btnLogout').onclick=()=>{ clearSession(); location.reload(); };
document.getElementById('authForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const btn = document.getElementById('authSubmit');
  const errEl = document.getElementById('authErr');
  btn.disabled = true;
  errEl.textContent = '';
  try{
    const res = await fetch('/api/auth', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:authMode, username, password})
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || 'Something went wrong.'; return; }
    setSession(data.token, data.username);
    hideAuthScreen();
    document.getElementById('mask').style.display='flex';
    boot();
  }catch(err){
    errEl.textContent = 'Network error — try again.';
  }finally{
    btn.disabled = false;
  }
});

/* ============ storage ============ */
// Preferred: Netlify function backed by Blobs, keyed per logged-in user.
// Fallback: browser localStorage, used when the file is opened directly (file://)
// or the local server.js dev copy without accounts is serving the page.
let PROG = {};
let memFallback = false;
let usingServer = false;
let authFailed = false;
async function loadProgress(){
  authFailed = false;
  try{
    const res = await fetch('/api/progress', {cache:'no-store', headers: authHeaders()});
    if(res.status===401){ authFailed = true; return; }
    if(res.ok){ PROG = await res.json(); usingServer = true; return; }
  }catch(e){ /* not running via the local server */ }
  try{
    const raw = localStorage.getItem(SKEY);
    PROG = raw ? JSON.parse(raw) : {};
  }catch(e){ PROG = {}; memFallback = true; }
}
let saveTimer=null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const body = JSON.stringify(PROG);
    if(usingServer){
      try{
        const res = await fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body});
        if(res.status===401){ clearSession(); showAuthScreen('Session expired — please log in again.'); return; }
        if(res.ok){ memFallback=false; return; }
      }catch(e){ /* server dropped — fall through to localStorage this save */ }
    }
    try{ localStorage.setItem(SKEY, body); memFallback=false; }
    catch(e){ memFallback = true; }
  },400);
}
function rec(id){ if(!PROG[id]) PROG[id]={status:'none',attempts:0,code:'',notes:''}; return PROG[id]; }

/* ============ engine ============ */
let SQL=null, current=null, cm=null;
async function boot(){
  if(!getToken()){ showAuthScreen(); return; }
  try{
    SQL = await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f});
  }catch(e){
    document.getElementById('maskmsg').innerHTML =
      'Could not load the SQLite engine.<br>Check your connection and reload.';
    document.querySelector('.spin').style.display='none';
    return;
  }
  await loadProgress();
  if(authFailed){ clearSession(); showAuthScreen('Session expired — please log in again.'); return; }
  document.getElementById('whoami').textContent = getUsername() ? ('Logged in as '+getUsername()) : '';
  initUI();
  document.getElementById('mask').style.display='none';
}
function freshDb(setup){
  const db = new SQL.Database();
  db.run(setup);
  return db;
}
function runSql(db, sql){
  const res = db.exec(sql);
  return res.length ? res[res.length-1] : {columns:[],values:[]};
}

/* ============ comparison ============ */
function norm(v){
  if(v===null||v===undefined) return '\u2205';
  if(typeof v==='number'){
    if(Number.isInteger(v)) return String(v);
    return String(Math.round(v*1e6)/1e6);
  }
  const s=String(v).trim();
  if(/^-?\d+\.\d+$/.test(s)) return String(Math.round(parseFloat(s)*1e6)/1e6);
  return s;
}
function rowKey(r){ return r.map(norm).join('\u0001'); }
function compare(user, exp, ordered){
  if(!user || !user.columns || user.columns.length===0)
    return {ok:false, reason:'Your query returned no result set. A SELECT is expected.'};
  if(user.columns.length !== exp.columns.length)
    return {ok:false, reason:`Wrong number of columns: expected ${exp.columns.length} (${exp.columns.join(', ')}), got ${user.columns.length} (${user.columns.join(', ')}).`};
  let u = user.values.map(rowKey), e = exp.values.map(rowKey);
  if(u.length !== e.length)
    return {ok:false, reason:`Wrong number of rows: expected ${e.length}, got ${u.length}.`};
  if(!ordered){ u=[...u].sort(); e=[...e].sort(); }
  for(let i=0;i<e.length;i++){
    if(u[i]!==e[i]){
      const label = ordered ? `Row ${i+1} differs` : 'A row does not match';
      return {ok:false, reason:`${label}.\n  expected: ${e[i].split('\u0001').join(' | ')}\n  yours:    ${u[i].split('\u0001').join(' | ')}` +
        (ordered? '\n\nThis problem is order-sensitive — check your ORDER BY.' : '')};
    }
  }
  return {ok:true};
}

/* ============ rendering ============ */
const $ = s=>document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(t){
  return esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .split('\n\n').map(b=>{
      if(b.split('\n').every(l=>l.trim().startsWith('- ')))
        return '<ul>'+b.split('\n').map(l=>'<li>'+l.trim().slice(2)+'</li>').join('')+'</ul>';
      return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
    }).join('');
}
function tableHtml(cols, rows, cap){
  if(!rows.length) return '<div style="color:var(--dim2);font-size:12px">(no rows)</div>';
  let h='<div class="tblwrap"><table class="grid"><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
  rows.slice(0,cap||200).forEach(r=>{
    h+='<tr>'+r.map(v=>v===null?'<td class="nul">NULL</td>':'<td>'+esc(v)+'</td>').join('')+'</tr>';
  });
  h+='</table></div>';
  if(rows.length>(cap||200)) h+='<div style="color:var(--dim2);font-size:11px;margin-top:5px">'+(rows.length-(cap||200))+' more rows…</div>';
  return h;
}

function renderList(){
  const s=$('#fsearch').value.toLowerCase(), d=$('#fdiff').value, st=$('#fstat').value, tp=$('#ftopic').value, co=$('#fco').value;
  const groups={Easy:[],Medium:[],Hard:[]};
  QUESTIONS.forEach((q,i)=>{
    const r=rec(q.id);
    if(d && q.difficulty!==d) return;
    if(st && r.status!==st) return;
    if(tp && !q.topics.includes(tp)) return;
    if(co && q.company!==co) return;
    if(s && !(q.title+' '+q.topics.join(' ')+' '+q.pattern+' '+(q.company||'')).toLowerCase().includes(s)) return;
    groups[q.difficulty].push({q,i});
  });
  let h='';
  ['Easy','Medium','Hard'].forEach(k=>{
    if(!groups[k].length) return;
    h+=`<div class="qgroup">${k} · ${groups[k].length}</div>`;
    groups[k].forEach(({q,i})=>{
      const r=rec(q.id);
      const mark = r.status==='solved'?'✓':(r.status==='attempted'?'●':'○');
      h+=`<div class="qitem ${current&&current.id===q.id?'active':''}" data-id="${q.id}">
        <div class="tick ${r.status}">${mark}</div>
        <div class="qidx">${String(i+1).padStart(2,'0')}</div>
        <div class="qmeta"><div class="qtitle">${esc(q.title)}</div>
        <div class="qsub"><span class="dif ${q.difficulty}">${q.difficulty}</span><span>${esc(q.pattern)}</span></div></div></div>`;
    });
  });
  $('#qlist').innerHTML = h || '<div style="padding:20px;color:var(--dim2);font-size:12.5px">No problems match those filters.</div>';
  $('#qlist').querySelectorAll('.qitem').forEach(el=>el.onclick=()=>open(el.dataset.id));
  const solved=QUESTIONS.filter(q=>rec(q.id).status==='solved').length;
  $('#pcount').textContent=`${solved} / ${QUESTIONS.length}`;
  $('#pbar').style.width=(100*solved/QUESTIONS.length)+'%';
}
