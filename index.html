<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DE SQL Gym — Data Engineering SQL Interview Practice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
:root{
  --bg:#0d1117; --panel:#131922; --panel2:#0f151d; --line:#232c39;
  --txt:#dfe6ef; --dim:#8b98a9; --dim2:#5f6b7c;
  --acc:#e2007a; --acc2:#ff3d9a;
  --ok:#2ea86a; --okbg:#0f2a1d; --err:#e5484d; --errbg:#2c1416;
  --easy:#3fb950; --med:#d9a441; --hard:#f0616d;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b3543;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{font-weight:700;letter-spacing:-.3px;font-size:15px;display:flex;align-items:center;gap:8px}
.logo span.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block}
.logo small{color:var(--dim2);font-weight:500;font-size:11px;margin-left:2px}
.hspace{flex:1}
.hstat{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:10px}
.bar{width:130px;height:6px;background:#1d2530;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%}
.hbtn{background:#1b232e;border:1px solid var(--line);color:var(--dim);padding:6px 11px;border-radius:6px;font-size:12px}
.hbtn:hover{color:var(--txt);border-color:#38424f}
.hbtn.on{color:#fff;background:var(--acc);border-color:var(--acc)}

main{display:flex;flex:1;min-height:0}

/* ---------- sidebar ---------- */
#side{width:308px;flex:0 0 308px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sfilters{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sfilters input,.sfilters select{width:100%;background:#0b1016;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit}
.sfilters input:focus,.sfilters select:focus{outline:none;border-color:var(--acc)}
.frow{display:flex;gap:8px}
#qlist{overflow:auto;flex:1;padding:4px 0}
.qgroup{padding:12px 12px 5px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);font-weight:700}
.qitem{padding:8px 12px;border-left:3px solid transparent;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.qitem:hover{background:#151c26}
.qitem.active{background:#182231;border-left-color:var(--acc)}
.qidx{font:11px var(--mono);color:var(--dim2);min-width:20px;padding-top:2px}
.qmeta{flex:1;min-width:0}
.qtitle{font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qsub{font-size:10.5px;color:var(--dim2);margin-top:2px;display:flex;gap:7px;align-items:center}
.dif{font-weight:700;font-size:10px}
.dif.Easy{color:var(--easy)}.dif.Medium{color:var(--med)}.dif.Hard{color:var(--hard)}
.tick{width:15px;text-align:center;font-size:12px;padding-top:2px}
.tick.solved{color:var(--ok)}.tick.attempted{color:var(--med)}.tick.none{color:#2b3543}

/* ---------- content ---------- */
#content{flex:1;display:flex;min-width:0}
#left{width:44%;min-width:330px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel2)}
#right{flex:1;display:flex;flex-direction:column;min-width:0}

.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.tab{padding:11px 12px;font-size:12.5px;color:var(--dim);border-bottom:2px solid transparent;background:none;border:none}
.tab.on{color:var(--txt);border-bottom-color:var(--acc)}
.pane{overflow:auto;flex:1;padding:18px 20px;min-height:0}
.pane.hide{display:none}

h1.ptitle{font-size:19px;margin:0 0 8px;letter-spacing:-.3px}
.pmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{font-size:10.5px;padding:3px 8px;border-radius:20px;background:#1b232e;color:var(--dim);border:1px solid var(--line)}
.chip.p{background:#2a0f1e;color:var(--acc2);border-color:#4a1932}
.prose{font-size:14px;color:#c9d3df}
.prose p{margin:0 0 11px}
.prose code{background:#1b2530;padding:1.5px 5px;border-radius:4px;font:12.5px var(--mono);color:#8ed3ff}
.prose strong{color:#fff}
.prose ul{margin:0 0 11px;padding-left:20px}
.prose li{margin-bottom:4px}

.schema{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.stbl{margin-bottom:14px}
.stname{font:12px var(--mono);color:var(--acc2);margin-bottom:5px}
table.grid{border-collapse:collapse;width:100%;font:11.5px var(--mono)}
table.grid th{background:#182029;color:var(--dim);text-align:left;padding:5px 8px;border:1px solid var(--line);font-weight:600;white-space:nowrap}
table.grid td{padding:4px 8px;border:1px solid var(--line);color:#c3ccd8;white-space:nowrap}
table.grid td.nul{color:#5f6b7c;font-style:italic}
.tblwrap{overflow:auto;max-height:280px;border-radius:6px}

.example{margin:20px 0 6px;border:1px solid var(--line);border-radius:9px;background:#111823;overflow:hidden}
.exhead{padding:8px 13px;background:#182231;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700;border-bottom:1px solid var(--line)}
.exblk{padding:11px 13px;border-bottom:1px solid #1b2431}
.exlbl{font-size:11px;color:var(--dim2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.exlbl b{color:var(--acc2);font-family:var(--mono);text-transform:none;letter-spacing:0;font-size:11.5px}
.exlbl.out{color:var(--ok)}
.exwhy{padding:11px 13px;font-size:12.5px;color:#b9c4d1;background:#0f1620}
.exwhy b{color:var(--txt)}
.chip.co{background:#132433;border-color:#1e3a4f;color:#7fc4f0;cursor:help}
details.hint{margin-top:10px;background:#141c26;border:1px solid var(--line);border-radius:7px;padding:9px 12px}
details.hint summary{cursor:pointer;font-size:12.5px;color:var(--med);list-style:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary:before{content:"▸ ";color:var(--dim2)}
details.hint[open] summary:before{content:"▾ "}
details.hint .body{margin-top:9px;font-size:13px;color:#b9c4d1}
details.hint.sol summary{color:var(--acc2)}
details.hint pre{background:#0b1016;padding:11px;border-radius:6px;overflow:auto;font:12.5px var(--mono);color:#9ee6b4;margin:8px 0 0}

/* editor */
.edbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.edbar .lbl{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.btn{border:1px solid var(--line);background:#1b232e;color:var(--txt);padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:#3d4a59}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:none;color:var(--dim)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#edwrap{flex:1;min-height:120px;position:relative;overflow:hidden}
.CodeMirror{height:100%;font:13px/1.55 var(--mono)}
#fallback{width:100%;height:100%;background:#0b1016;color:var(--txt);border:none;padding:12px;font:13px/1.55 var(--mono);resize:none}
#fallback:focus{outline:none}

#out{height:42%;min-height:150px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel2)}
.outbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;flex:0 0 auto}
.verdict{font-weight:700;font-size:12.5px}
.verdict.ok{color:var(--ok)}.verdict.err{color:var(--err)}.verdict.n{color:var(--dim)}
.outbody{flex:1;overflow:auto;padding:12px}
.msg{font:12.5px var(--mono);white-space:pre-wrap;padding:10px 12px;border-radius:6px}
.msg.err{background:var(--errbg);color:#ff9ba0;border:1px solid #4a1f22}
.msg.ok{background:var(--okbg);color:#7ee0a5;border:1px solid #1d4a33}
.side2{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.side2>div{flex:1;min-width:230px}
.side2 h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim2)}

/* stats */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:#141c26;border:1px solid var(--line);border-radius:9px;padding:14px}
.card b{display:block;font-size:24px;letter-spacing:-.5px}
.card small{color:var(--dim2);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.trow .nm{width:150px;color:var(--dim);flex:0 0 150px}
.trow .tb{flex:1;height:7px;background:#1d2530;border-radius:4px;overflow:hidden}
.trow .tb>i{display:block;height:100%;background:var(--acc)}
.trow .ct{width:56px;text-align:right;color:var(--dim2);font:11px var(--mono)}
#notes{width:100%;min-height:110px;background:#0b1016;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:11px;font:13px var(--mono);resize:vertical}
#notes:focus{outline:none;border-color:var(--acc)}
.loadmask{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:99;font-size:13px;color:var(--dim)}
.spin{width:26px;height:26px;border:3px solid #232c39;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
.authbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;width:300px;display:flex;flex-direction:column;gap:16px}
.authbox .logo{justify-content:center;font-size:16px}
.authtabs{display:flex;gap:4px;background:#0b1016;border:1px solid var(--line);border-radius:7px;padding:3px}
.authtab{flex:1;background:transparent;border:none;color:var(--dim);padding:7px;border-radius:5px;font-size:12.5px;font-family:inherit}
.authtab.on{background:var(--acc);color:#fff}
#authForm{display:flex;flex-direction:column;gap:10px}
#authForm input{background:#0b1016;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:9px 10px;font-size:13px;font-family:inherit;width:100%}
#authForm input:focus{outline:none;border-color:var(--acc)}
#authForm button{background:var(--acc);border:1px solid var(--acc);color:#fff;padding:9px;border-radius:6px;font-size:13px;font-weight:600}
#authForm button:disabled{opacity:.6;cursor:default}
.autherr{color:var(--err);font-size:12px;min-height:14px;text-align:center}
.whoami{color:var(--dim);font-size:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.kbd{font:10.5px var(--mono);background:#1b232e;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--dim)}
@media(max-width:1100px){#side{width:250px;flex-basis:250px}#left{width:50%}}
</style>
</head>
<body>
<div class="loadmask" id="mask"><div class="spin"></div><div id="maskmsg">Booting SQLite engine…</div></div>

<div class="loadmask" id="authScreen" style="display:none">
  <div class="authbox">
    <div class="logo"><span class="dot"></span>DE SQL Gym</div>
    <div class="authtabs">
      <button type="button" class="authtab on" id="tabLogin">Log in</button>
      <button type="button" class="authtab" id="tabSignup">Sign up</button>
    </div>
    <form id="authForm">
      <input id="authUser" placeholder="Username" autocomplete="username" required/>
      <input id="authPass" type="password" placeholder="Password" autocomplete="current-password" required/>
      <button type="submit" id="authSubmit">Log in</button>
    </form>
    <div id="authErr" class="autherr"></div>
  </div>
</div>

<div id="app">
<header>
  <div class="logo"><span class="dot"></span>DE SQL Gym <small>123 problems · data-engineering focused</small></div>
  <div class="hspace"></div>
  <div class="hstat"><span id="pcount">0 / 123</span><div class="bar"><i id="pbar"></i></div></div>
  <button class="hbtn" id="btnRandom">Random unsolved</button>
  <button class="hbtn" id="btnStats">Progress</button>
  <span class="whoami" id="whoami"></span>
  <button class="hbtn" id="btnLogout">Log out</button>
</header>

<main>
  <aside id="side">
    <div class="sfilters">
      <input id="fsearch" placeholder="Search title, topic, pattern…"/>
      <div class="frow">
        <select id="fdiff"><option value="">All difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
        <select id="fstat"><option value="">All status</option><option value="solved">Solved</option><option value="attempted">Attempted</option><option value="none">Unsolved</option></select>
      </div>
      <select id="ftopic"><option value="">All topics</option></select>
      <select id="fco"><option value="">All companies (as tagged by sources)</option></select>
    </div>
    <div id="qlist"></div>
  </aside>

  <section id="content">
    <div id="left">
      <div class="tabs">
        <button class="tab on" data-p="desc">Problem</button>
        <button class="tab" data-p="schema">Schema &amp; Data</button>
        <button class="tab" data-p="notes">My notes</button>
      </div>
      <div class="pane" id="pane-desc"></div>
      <div class="pane hide" id="pane-schema"></div>
      <div class="pane hide" id="pane-notes">
        <h4 style="margin:0 0 8px;font-size:11px;letter-spacing:.8px;color:var(--dim2);text-transform:uppercase">Notes for this problem</h4>
        <textarea id="notes" placeholder="What tripped you up? The one-line insight you want to remember before the interview…"></textarea>
        <p style="color:var(--dim2);font-size:11.5px;margin-top:8px">Saved automatically.</p>
      </div>
    </div>

    <div id="right">
      <div class="edbar">
        <span class="lbl">SQL Editor</span>
        <span style="color:var(--dim2);font-size:11px">SQLite dialect</span>
        <div class="hspace" style="flex:1"></div>
        <button class="btn ghost" id="btnReset">Reset</button>
        <button class="btn" id="btnRun">Run <span class="kbd">Ctrl↵</span></button>
        <button class="btn primary" id="btnSubmit">Submit</button>
      </div>
      <div id="edwrap"><textarea id="fallback" spellcheck="false"></textarea></div>
      <div id="out">
        <div class="outbar">
          <span class="verdict n" id="verdict">Ready</span>
          <span style="color:var(--dim2)" id="vsub"></span>
          <div class="hspace" style="flex:1"></div>
          <span style="color:var(--dim2);font-size:11px" id="attempts"></span>
        </div>
        <div class="outbody" id="outbody"><div style="color:var(--dim2);font-size:12.5px">Run your query to see results. Submit checks it against the expected output.</div></div>
      </div>
    </div>

    <div class="pane hide" id="pane-stats" style="flex:1;padding:26px 30px"></div>
  </section>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script>
const QUESTIONS = [{"id": "q01", "title": "Second Highest Salary (NULL-safe)", "difficulty": "Easy", "pattern": "Ranking / offset", "topics": ["Aggregation", "Subquery"], "prompt": "Return the **second highest distinct** salary from `employees` as a column named `second_highest`.\n\nIf there is no second distinct salary, the query must return a single row containing `NULL` (not an empty result set).\n\n**Output columns:** `second_highest`", "setup": "CREATE TABLE employees (emp_id INTEGER, name TEXT, dept TEXT, salary INTEGER);\nINSERT INTO employees VALUES\n (1,'Asha','ENG',120000),(2,'Ravi','ENG',95000),(3,'Meera','DATA',120000),\n (4,'John','DATA',80000),(5,'Sara','SALES',95000),(6,'Deep','SALES',60000);", "solution": "SELECT (SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1) AS second_highest;", "ordered": false, "hints": ["MAX(salary) WHERE salary < (SELECT MAX(salary)) also works and is NULL-safe by construction.", "A bare `LIMIT 1 OFFSET 1` returns zero rows when there is no second salary — wrapping it in a scalar subquery forces one row of NULL."], "explanation": "The classic warm-up. The trap is the empty-result case: interviewers explicitly ask 'what if there is only one salary?'. Wrapping the query as a scalar subquery, or using MAX(...) WHERE salary < MAX, both guarantee a single NULL row. DENSE_RANK()=2 is the third valid answer and generalises to Nth.", "walkthrough": "Distinct salaries descending are 120000, 95000, 80000, 60000 — the second is 95000. Note 120000 and 95000 each appear twice; DISTINCT collapses them before the offset applies.", "company": null, "seen": "Core DE pattern"}, {"id": "q02", "title": "Find Duplicates on a Composite Key", "difficulty": "Easy", "pattern": "Dedup / data quality", "topics": ["Aggregation", "Data Quality"], "prompt": "The landing table `raw_orders` should have one row per (`order_id`, `order_date`) but the source system replays files.\n\nReturn every (`order_id`, `order_date`) combination that appears more than once, along with how many times it appears.\n\n**Output columns:** `order_id`, `order_date`, `dup_count`\n**Order by:** `order_id`", "setup": "CREATE TABLE raw_orders (order_id INTEGER, customer_id INTEGER, order_date TEXT, amount REAL);\nINSERT INTO raw_orders VALUES\n (101,1,'2024-03-01',250.0),(101,1,'2024-03-01',250.0),(102,2,'2024-03-01',80.0),\n (103,3,'2024-03-02',400.0),(103,3,'2024-03-02',400.0),(103,3,'2024-03-02',400.0),\n (104,4,'2024-03-03',120.0);", "solution": "SELECT order_id, order_date, COUNT(*) AS dup_count\nFROM raw_orders\nGROUP BY order_id, order_date\nHAVING COUNT(*) > 1\nORDER BY order_id;", "ordered": true, "hints": ["GROUP BY the key you believe is unique, then HAVING COUNT(*) > 1.", "WHERE filters rows before grouping; HAVING filters after."], "explanation": "Asked in almost every DE screen. Follow-ups: (a) how do you delete the duplicates keeping one — ROW_NUMBER() in a CTE then DELETE; (b) how do you stop it happening — idempotent loads keyed on a natural key, or MERGE instead of INSERT.", "walkthrough": "Order 101 appears twice and order 103 three times, so both are returned with their counts. Orders 102 and 104 appear once and are excluded.", "seen": "prepare.sh DE track", "company": "JPMorgan"}, {"id": "q03", "title": "Deduplicate Keeping the Latest Record", "difficulty": "Easy", "pattern": "Dedup-latest", "topics": ["Window Functions", "Dedup"], "prompt": "`customer_stg` holds every version of a customer row that has landed. Return **one row per customer** — the most recent one by `updated_at`.\n\n**Output columns:** `customer_id`, `name`, `email`, `updated_at`\n**Order by:** `customer_id`", "setup": "CREATE TABLE customer_stg (customer_id INTEGER, name TEXT, email TEXT, updated_at TEXT);\nINSERT INTO customer_stg VALUES\n (1,'Asha','asha@old.com','2024-01-05 09:00:00'),\n (1,'Asha R','asha@new.com','2024-03-11 18:30:00'),\n (2,'Ravi','ravi@x.com','2024-02-01 10:00:00'),\n (3,'Meera','meera@a.com','2024-01-20 08:00:00'),\n (3,'Meera K','meera@b.com','2024-02-15 08:00:00'),\n (3,'Meera K','meera@c.com','2024-04-02 12:45:00');", "solution": "WITH ranked AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) AS rn\n  FROM customer_stg\n)\nSELECT customer_id, name, email, updated_at FROM ranked WHERE rn = 1 ORDER BY customer_id;", "ordered": true, "hints": ["ROW_NUMBER() OVER (PARTITION BY key ORDER BY ts DESC), then keep rn = 1.", "You cannot filter a window function in WHERE — wrap it in a CTE or subquery (Snowflake/Databricks let you use QUALIFY)."], "explanation": "The single most common DE SQL pattern. In Snowflake/Databricks you'd write `QUALIFY ROW_NUMBER() OVER (...) = 1`. Be ready for the tie question: if two rows share the max timestamp, add a deterministic tie-breaker (file sequence, ingestion id) or you get non-deterministic output across runs.", "walkthrough": "Customer 1 has two versions — the March row wins. Customer 3 has three; the April row wins even though an earlier row shares the same name.", "seen": "prepare.sh DE track", "company": "DoorDash"}, {"id": "q04", "title": "NULL-Safe Aggregation", "difficulty": "Easy", "pattern": "NULL semantics", "topics": ["Aggregation", "NULL Handling"], "prompt": "For each customer in `orders` return:\n- `total_orders` — number of order rows\n- `discounted_orders` — number of orders where `discount` is not NULL\n- `net_amount` — SUM of (`amount` minus `discount`), treating a NULL discount as 0, rounded to 2 decimals\n\n**Output columns:** `customer_id`, `total_orders`, `discounted_orders`, `net_amount`\n**Order by:** `customer_id`", "setup": "CREATE TABLE orders (order_id INTEGER, customer_id INTEGER, amount REAL, discount REAL);\nINSERT INTO orders VALUES\n (1,1,100.0,10.0),(2,1,200.0,NULL),(3,1,50.0,5.5),\n (4,2,300.0,NULL),(5,2,120.0,NULL),\n (6,3,75.0,25.0);", "solution": "SELECT customer_id,\n       COUNT(*) AS total_orders,\n       COUNT(discount) AS discounted_orders,\n       ROUND(SUM(amount - COALESCE(discount,0)),2) AS net_amount\nFROM orders GROUP BY customer_id ORDER BY customer_id;", "ordered": true, "hints": ["COUNT(*) counts rows; COUNT(col) skips NULLs. That difference is the whole question.", "Any arithmetic involving NULL yields NULL — wrap the nullable column in COALESCE before subtracting."], "explanation": "Interviewers use this to check you know NULL is 'unknown', not zero. `amount - discount` silently nulls out entire rows and quietly under-reports revenue — a real production bug class.", "walkthrough": "Customer 1 has 3 orders but only 2 carry a discount, so total_orders=3 and discounted_orders=2. Net = (100-10)+(200-0)+(50-5.5) = 334.50 — the NULL discount must become 0, not wipe the row.", "company": null, "seen": "Core DE pattern"}, {"id": "q05", "title": "Customers With No Orders (NOT IN vs NOT EXISTS)", "difficulty": "Easy", "pattern": "Anti-join", "topics": ["Joins", "NULL Handling"], "prompt": "Return customers who have never placed an order.\n\nNote: `orders.customer_id` is nullable and one row has a NULL customer_id.\n\n**Output columns:** `customer_id`, `name`\n**Order by:** `customer_id`", "setup": "CREATE TABLE customers (customer_id INTEGER, name TEXT);\nINSERT INTO customers VALUES (1,'Asha'),(2,'Ravi'),(3,'Meera'),(4,'John'),(5,'Sara');\nCREATE TABLE orders (order_id INTEGER, customer_id INTEGER, amount REAL);\nINSERT INTO orders VALUES (10,1,100.0),(11,3,250.0),(12,NULL,90.0),(13,1,40.0);", "solution": "SELECT c.customer_id, c.name\nFROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)\nORDER BY c.customer_id;", "ordered": true, "hints": ["Try NOT IN first and look at the result — then explain why it returned nothing.", "NOT EXISTS and LEFT JOIN ... WHERE right.key IS NULL are both NULL-safe."], "explanation": "The NULL trap: `NOT IN (subquery containing NULL)` evaluates to UNKNOWN for every row, so you get an empty result. This is a favourite gotcha — say out loud that NOT EXISTS or a LEFT JOIN anti-pattern is safe, and that NOT EXISTS usually optimises to the same anti-join plan.", "walkthrough": "Customers 2, 4 and 5 have no orders. The orders table contains a row with a NULL customer_id, which is what makes a NOT IN solution return an empty set.", "seen": "prepare.sh DE track", "company": "LinkedIn"}, {"id": "q06", "title": "Bucket Customers With CASE", "difficulty": "Easy", "pattern": "Conditional logic", "topics": ["CASE", "Aggregation"], "prompt": "Bucket every customer by `lifetime_value`: below 1000 -> `Low`, 1000 to below 5000 -> `Medium`, 5000 and above -> `High`.\n\nReturn the number of customers in each tier.\n\n**Output columns:** `tier`, `customers`\n**Order by:** `tier` (alphabetical)", "setup": "CREATE TABLE customers (customer_id INTEGER, name TEXT, lifetime_value REAL);\nINSERT INTO customers VALUES\n (1,'Asha',250.0),(2,'Ravi',1000.0),(3,'Meera',4999.99),(4,'John',5000.0),\n (5,'Sara',12000.0),(6,'Deep',0.0),(7,'Nita',3200.0);", "solution": "SELECT CASE WHEN lifetime_value < 1000 THEN 'Low'\n            WHEN lifetime_value < 5000 THEN 'Medium'\n            ELSE 'High' END AS tier,\n       COUNT(*) AS customers\nFROM customers GROUP BY tier ORDER BY tier;", "ordered": true, "hints": ["CASE evaluates top-down and stops at the first match, so you don't need BETWEEN ranges.", "You can GROUP BY the CASE alias in SQLite/Postgres; in older engines repeat the whole expression."], "explanation": "Trivially easy but boundary values are deliberately planted at exactly 1000 and 5000 — interviewers check whether your buckets are half-open and whether you mishandle the edges.", "walkthrough": "Deep (0) and Asha (250) are Low; Ravi (1000) and Nita (3200) are Medium; Meera at 4999.99 is Medium while John at exactly 5000 crosses into High.", "company": null, "seen": "Core DE pattern"}, {"id": "q07", "title": "Monthly Rollup From Timestamps", "difficulty": "Easy", "pattern": "Date truncation", "topics": ["Dates", "Aggregation"], "prompt": "From `page_views`, return per calendar month: total views and distinct users.\n\n**Output columns:** `month` (format `YYYY-MM`), `views`, `unique_users`\n**Order by:** `month`", "setup": "CREATE TABLE page_views (view_id INTEGER, user_id INTEGER, viewed_at TEXT);\nINSERT INTO page_views VALUES\n (1,10,'2024-01-05 14:23:11'),(2,10,'2024-01-19 08:00:00'),(3,11,'2024-01-31 23:59:59'),\n (4,12,'2024-02-01 00:00:01'),(5,10,'2024-02-14 12:00:00'),(6,13,'2024-02-28 19:30:00'),\n (7,11,'2024-03-02 09:15:00'),(8,11,'2024-03-02 09:45:00');", "solution": "SELECT strftime('%Y-%m', viewed_at) AS month,\n       COUNT(*) AS views,\n       COUNT(DISTINCT user_id) AS unique_users\nFROM page_views GROUP BY month ORDER BY month;", "ordered": true, "hints": ["SQLite: strftime('%Y-%m', ts). Postgres: to_char(ts,'YYYY-MM') or date_trunc('month', ts).", "COUNT(DISTINCT user_id) is not the same as COUNT(user_id)."], "explanation": "Dialect awareness is being tested as much as SQL. Know the equivalent in each engine: DATE_TRUNC (Postgres/Snowflake/Databricks), DATE_FORMAT (MySQL/Spark), FORMAT_DATE (BigQuery). Mention that COUNT(DISTINCT) does not roll up — you cannot sum monthly distinct users to get a yearly figure.", "walkthrough": "January has 3 views from 2 distinct users, February 3 views from 3 users, March 2 views but both from user 11 — so unique_users is 1, not 2.", "company": null, "seen": "Core DE pattern"}, {"id": "q08", "title": "Combine Two Regional Feeds", "difficulty": "Easy", "pattern": "Set operations", "topics": ["Set Operations"], "prompt": "`orders_us` and `orders_eu` are two regional extracts with the same shape. Return every order with `amount > 100` from both feeds, tagged with its region. Keep every row (do not deduplicate).\n\n**Output columns:** `order_id`, `region`, `amount`\n**Order by:** `order_id`, then `region`", "setup": "CREATE TABLE orders_us (order_id INTEGER, amount REAL);\nINSERT INTO orders_us VALUES (1,150.0),(2,90.0),(3,300.0),(4,101.0);\nCREATE TABLE orders_eu (order_id INTEGER, amount REAL);\nINSERT INTO orders_eu VALUES (3,300.0),(5,220.0),(6,50.0);", "solution": "SELECT order_id, 'US' AS region, amount FROM orders_us WHERE amount > 100\nUNION ALL\nSELECT order_id, 'EU' AS region, amount FROM orders_eu WHERE amount > 100\nORDER BY order_id, region;", "ordered": true, "hints": ["UNION ALL concatenates; UNION additionally sorts/hashes to remove duplicates.", "ORDER BY at the end applies to the whole combined set."], "explanation": "Cheap question, real point: UNION does an implicit DISTINCT which costs a full sort or hash over both inputs. In a pipeline processing billions of rows that is a serious, avoidable cost — default to UNION ALL and dedupe deliberately only where required.", "walkthrough": "Amounts over 100 are kept: US orders 1, 3, 4 and EU orders 3, 5. Order 3 exists in both feeds and appears twice because UNION ALL does not deduplicate.", "company": null, "seen": "Core DE pattern"}, {"id": "q09", "title": "Departments Above the Bar", "difficulty": "Easy", "pattern": "Filter after aggregate", "topics": ["Aggregation"], "prompt": "Return departments that have at least 2 employees **and** an average salary above 60000.\n\n**Output columns:** `dept`, `headcount`, `avg_salary` (rounded to 2 decimals)\n**Order by:** `avg_salary` descending", "setup": "CREATE TABLE employees (emp_id INTEGER, name TEXT, dept TEXT, salary INTEGER);\nINSERT INTO employees VALUES\n (1,'Asha','ENG',120000),(2,'Ravi','ENG',95000),(3,'Meera','DATA',120000),\n (4,'John','DATA',80000),(5,'Sara','SALES',55000),(6,'Deep','SALES',50000),\n (7,'Nita','HR',90000);", "solution": "SELECT dept, COUNT(*) AS headcount, ROUND(AVG(salary),2) AS avg_salary\nFROM employees\nGROUP BY dept\nHAVING COUNT(*) >= 2 AND AVG(salary) > 60000\nORDER BY avg_salary DESC;", "ordered": true, "hints": ["HAVING can reference aggregates that are not in the SELECT list.", "HR has one employee — it must not appear even though its salary is high."], "explanation": "Logical execution order is the real lesson: FROM -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY. That is why you can't use a SELECT alias in WHERE, but you can in ORDER BY.", "walkthrough": "ENG averages 107500 with 2 people and DATA averages 100000 with 2 — both qualify. SALES averages only 52500, and HR averages 90000 but has just one employee.", "seen": "DWP 28-day list", "company": "Google"}, {"id": "q10", "title": "Employees and Their Managers", "difficulty": "Easy", "pattern": "Self join", "topics": ["Joins"], "prompt": "Return every employee with their manager's name. Employees with no manager must still appear, with `manager_name` as NULL.\n\n**Output columns:** `emp_id`, `emp_name`, `manager_name`\n**Order by:** `emp_id`", "setup": "CREATE TABLE employees (emp_id INTEGER, name TEXT, manager_id INTEGER);\nINSERT INTO employees VALUES\n (1,'Asha',NULL),(2,'Ravi',1),(3,'Meera',1),(4,'John',2),(5,'Sara',2),(6,'Deep',3);", "solution": "SELECT e.emp_id, e.name AS emp_name, m.name AS manager_name\nFROM employees e\nLEFT JOIN employees m ON m.emp_id = e.manager_id\nORDER BY e.emp_id;", "ordered": true, "hints": ["Alias the same table twice — one alias plays 'employee', the other plays 'manager'.", "INNER JOIN would silently drop the CEO."], "explanation": "Warm-up for the recursive hierarchy question that usually follows. Whenever a table has a foreign key to itself, LEFT JOIN is almost always correct — INNER JOIN quietly drops the root.", "walkthrough": "Asha is the root and gets a NULL manager_name — an INNER JOIN would drop her entirely. Everyone else resolves to their manager's name.", "seen": "prepare.sh DE track", "company": "Meta"}, {"id": "q11", "title": "The Fan-Out Trap", "difficulty": "Medium", "pattern": "Join granularity", "topics": ["Joins", "Aggregation"], "prompt": "Each order has multiple line items and may have multiple payments. A naive three-way join multiplies rows and inflates both totals.\n\nFor each order return the correct item revenue (`SUM(qty * price)`) and the correct total paid.\n\n**Output columns:** `order_id`, `item_revenue`, `paid_amount` (both rounded to 2 decimals)\n**Order by:** `order_id`", "setup": "CREATE TABLE orders (order_id INTEGER, customer_id INTEGER);\nINSERT INTO orders VALUES (1,100),(2,101),(3,102);\nCREATE TABLE order_items (order_id INTEGER, item_id INTEGER, qty INTEGER, price REAL);\nINSERT INTO order_items VALUES\n (1,1,2,50.0),(1,2,1,30.0),(1,3,4,10.0),\n (2,4,1,200.0),\n (3,5,3,15.0),(3,6,2,25.0);\nCREATE TABLE payments (order_id INTEGER, payment_id INTEGER, amount REAL);\nINSERT INTO payments VALUES\n (1,900,100.0),(1,901,70.0),\n (2,902,200.0),\n (3,903,95.0);", "solution": "WITH i AS (SELECT order_id, SUM(qty*price) AS item_revenue FROM order_items GROUP BY order_id),\n     p AS (SELECT order_id, SUM(amount) AS paid_amount FROM payments GROUP BY order_id)\nSELECT o.order_id, ROUND(i.item_revenue,2) AS item_revenue, ROUND(p.paid_amount,2) AS paid_amount\nFROM orders o JOIN i ON i.order_id=o.order_id JOIN p ON p.order_id=o.order_id\nORDER BY o.order_id;", "ordered": true, "hints": ["Join two one-to-many tables to the same parent and you get a cartesian product per key (3 items x 2 payments = 6 rows).", "Pre-aggregate each side to the order grain in its own CTE, then join 1:1."], "explanation": "This is the single most common silent-corruption bug in real warehouses, and senior interviewers love it. Say the word **grain** out loud: 'one row represents exactly one order'. Alternatives: aggregate in scalar subqueries, or SUM(DISTINCT ...) tricks (fragile — avoid).", "walkthrough": "Order 1 has 3 line items and 2 payments. Joined naively that is 6 rows, inflating item revenue to 330 and payments to 510. Pre-aggregating gives the true 170 and 170.", "company": null, "seen": "Core DE pattern"}, {"id": "q12", "title": "LEFT JOIN Filter Placement", "difficulty": "Medium", "pattern": "ON vs WHERE", "topics": ["Joins", "Dates"], "prompt": "Return every customer with the number of orders they placed in **March 2024**. Customers with zero March orders must appear with `march_orders = 0`.\n\n**Output columns:** `customer_id`, `name`, `march_orders`\n**Order by:** `customer_id`", "setup": "CREATE TABLE customers (customer_id INTEGER, name TEXT);\nINSERT INTO customers VALUES (1,'Asha'),(2,'Ravi'),(3,'Meera'),(4,'John');\nCREATE TABLE orders (order_id INTEGER, customer_id INTEGER, order_date TEXT);\nINSERT INTO orders VALUES\n (10,1,'2024-03-04'),(11,1,'2024-03-22'),(12,1,'2024-02-28'),\n (13,2,'2024-04-01'),(14,3,'2024-03-15');", "solution": "SELECT c.customer_id, c.name, COUNT(o.order_id) AS march_orders\nFROM customers c\nLEFT JOIN orders o\n  ON o.customer_id = c.customer_id\n AND o.order_date >= '2024-03-01' AND o.order_date < '2024-04-01'\nGROUP BY c.customer_id, c.name\nORDER BY c.customer_id;", "ordered": true, "hints": ["Put the date predicate in the ON clause, not WHERE — WHERE runs after the join and kills the NULL-extended rows.", "COUNT(o.order_id) ignores NULLs, so unmatched customers correctly get 0. COUNT(*) would give 1."], "explanation": "Two traps in one: filter placement (ON vs WHERE turns a LEFT JOIN into an INNER JOIN) and COUNT(*) vs COUNT(col). Also note the half-open date range `>= start AND < next_start` — safer than BETWEEN, which breaks the moment the column carries a time component.", "walkthrough": "Customer 1 has 2 March orders (the February one is excluded), customer 3 has 1, and customers 2 and 4 have 0 but must still appear. Putting the date filter in WHERE would drop customers 2 and 4 entirely.", "company": null, "seen": "Core DE pattern"}, {"id": "q13", "title": "Date Spine — Report Zero Days", "difficulty": "Medium", "pattern": "Calendar spine", "topics": ["Recursive CTE", "Dates"], "prompt": "Return daily signup counts for every day from `2024-03-01` to `2024-03-10` inclusive. Days with no signups must appear with `signups = 0`.\n\nThere is no calendar table — generate the date range yourself.\n\n**Output columns:** `d`, `signups`\n**Order by:** `d`", "setup": "CREATE TABLE signups (user_id INTEGER, signup_date TEXT);\nINSERT INTO signups VALUES\n (1,'2024-03-01'),(2,'2024-03-01'),(3,'2024-03-03'),\n (4,'2024-03-07'),(5,'2024-03-07'),(6,'2024-03-07'),(7,'2024-03-10');", "solution": "WITH RECURSIVE cal(d) AS (\n  SELECT '2024-03-01'\n  UNION ALL\n  SELECT date(d,'+1 day') FROM cal WHERE d < '2024-03-10'\n)\nSELECT cal.d, COUNT(s.user_id) AS signups\nFROM cal LEFT JOIN signups s ON s.signup_date = cal.d\nGROUP BY cal.d ORDER BY cal.d;", "ordered": true, "hints": ["WITH RECURSIVE cal(d) AS (SELECT start UNION ALL SELECT date(d,'+1 day') FROM cal WHERE d < end).", "The spine must be the LEFT side of the join."], "explanation": "Dashboards break when a zero day silently disappears — a gap looks like a flat line instead of a crash. Real warehouses keep a physical `dim_date`; be ready to say that generating a spine per query is fine for small ranges but a dim table is the production answer. Dialects: generate_series (Postgres), sequence/explode (Spark/Databricks), GENERATOR (Snowflake).", "walkthrough": "March 1 has 2 signups, March 3 has 1, March 7 has 3 and March 10 has 1. The other six days have no rows in signups but must appear with 0.", "company": null, "seen": "Core DE pattern"}, {"id": "q14", "title": "Pipeline Run Status Pivot", "difficulty": "Medium", "pattern": "Conditional aggregation", "topics": ["CASE", "Aggregation", "Data Quality"], "prompt": "From the orchestrator log `job_runs`, produce one row per pipeline with the count of runs in each status.\n\n**Output columns:** `pipeline`, `success`, `failed`, `running`\n**Order by:** `pipeline`", "setup": "CREATE TABLE job_runs (run_id INTEGER, pipeline TEXT, run_date TEXT, status TEXT);\nINSERT INTO job_runs VALUES\n (1,'ingest_sales','2024-03-01','success'),(2,'ingest_sales','2024-03-02','failed'),\n (3,'ingest_sales','2024-03-03','success'),(4,'ingest_sales','2024-03-04','running'),\n (5,'load_dim','2024-03-01','success'),(6,'load_dim','2024-03-02','success'),\n (7,'agg_metrics','2024-03-01','failed'),(8,'agg_metrics','2024-03-02','failed');", "solution": "SELECT pipeline,\n       SUM(CASE WHEN status='success' THEN 1 ELSE 0 END) AS success,\n       SUM(CASE WHEN status='failed'  THEN 1 ELSE 0 END) AS failed,\n       SUM(CASE WHEN status='running' THEN 1 ELSE 0 END) AS running\nFROM job_runs GROUP BY pipeline ORDER BY pipeline;", "ordered": true, "hints": ["SUM(CASE WHEN ... THEN 1 ELSE 0 END) is the portable PIVOT.", "COUNT(CASE WHEN ... THEN 1 END) works too — the ELSE NULL is skipped by COUNT."], "explanation": "Rows-to-columns without a PIVOT operator. Portable across every engine, unlike Snowflake's PIVOT or SQL Server's PIVOT. Note the COUNT variant has no ELSE — COUNT ignores NULL, SUM would need the explicit 0.", "walkthrough": "ingest_sales has 2 successes, 1 failure and 1 running. load_dim has 2 successes and zeros elsewhere. agg_metrics has 2 failures and zeros elsewhere.", "company": null, "seen": "Core DE pattern"}, {"id": "q15", "title": "Source-to-Target Reconciliation", "difficulty": "Medium", "pattern": "Reconciliation", "topics": ["Joins", "Data Quality"], "prompt": "After a load, compare `src_customers` against `tgt_customers` and report every discrepancy:\n- key present in source but not target -> `missing_in_target`\n- key present in target but not source -> `missing_in_source`\n- key in both but `name` differs -> `mismatch`\n\n**Output columns:** `customer_id`, `issue`\n**Order by:** `customer_id`, then `issue`", "setup": "CREATE TABLE src_customers (customer_id INTEGER, name TEXT);\nINSERT INTO src_customers VALUES (1,'Asha'),(2,'Ravi'),(3,'Meera'),(4,'John');\nCREATE TABLE tgt_customers (customer_id INTEGER, name TEXT);\nINSERT INTO tgt_customers VALUES (1,'Asha'),(2,'Ravi Kumar'),(3,'Meera'),(5,'Sara');", "solution": "SELECT s.customer_id, 'missing_in_target' AS issue\nFROM src_customers s LEFT JOIN tgt_customers t ON t.customer_id=s.customer_id\nWHERE t.customer_id IS NULL\nUNION ALL\nSELECT t.customer_id, 'missing_in_source'\nFROM tgt_customers t LEFT JOIN src_customers s ON s.customer_id=t.customer_id\nWHERE s.customer_id IS NULL\nUNION ALL\nSELECT s.customer_id, 'mismatch'\nFROM src_customers s JOIN tgt_customers t ON t.customer_id=s.customer_id\nWHERE s.name <> t.name\nORDER BY 1, 2;", "ordered": true, "hints": ["Two LEFT JOIN anti-joins in opposite directions cover the missing cases; an INNER JOIN with an inequality covers mismatches.", "Careful with NULL-able compare columns: `a <> b` is UNKNOWN when either is NULL — use IS NOT (SQLite) or IS DISTINCT FROM (Postgres)."], "explanation": "Every migration and every CDC pipeline needs this. A FULL OUTER JOIN with COALESCE is the compact version, but not all engines/versions support it — the UNION ALL form is universally portable. Follow-up: at scale you'd compare hashed row checksums per key, not column by column.", "walkthrough": "Customer 4 is missing in target, customer 5 is missing in source, and customer 2's name differs between the two. Customers 1 and 3 match exactly and are not reported.", "company": null, "seen": "Core DE pattern"}, {"id": "q16", "title": "Products Bought Together", "difficulty": "Medium", "pattern": "Self join / pairs", "topics": ["Joins", "Aggregation"], "prompt": "Find product pairs that appear in the same order. Each unordered pair must appear once (`A,B` — never also `B,A`) with the number of orders containing both.\n\n**Output columns:** `product_a`, `product_b`, `pair_count`\n**Order by:** `pair_count` descending, then `product_a`, then `product_b`", "setup": "CREATE TABLE order_items (order_id INTEGER, product TEXT);\nINSERT INTO order_items VALUES\n (1,'bread'),(1,'milk'),(1,'eggs'),\n (2,'bread'),(2,'milk'),\n (3,'milk'),(3,'eggs'),\n (4,'bread'),(4,'jam'),\n (5,'bread'),(5,'milk');", "solution": "SELECT a.product AS product_a, b.product AS product_b, COUNT(*) AS pair_count\nFROM order_items a\nJOIN order_items b ON b.order_id = a.order_id AND a.product < b.product\nGROUP BY a.product, b.product\nORDER BY pair_count DESC, product_a, product_b;", "ordered": true, "hints": ["Self-join on order_id and use `a.product < b.product` to keep each pair once and drop self-pairs.", "`<>` instead of `<` gives you every pair twice."], "explanation": "Market-basket in one line. The `<` predicate is the whole trick — it simultaneously removes self-matches and the mirrored duplicates. Follow-up at scale: this is O(n²) per order, so cap basket size or use approximate frequent-itemset algorithms.", "walkthrough": "bread+milk appear together in orders 1, 2 and 5 (count 3). bread+eggs and milk+eggs appear in order 1 and 3 respectively. The `a.product < b.product` guard stops milk+bread appearing as a separate pair.", "seen": "DWP 28-day list", "company": "Coca-Cola"}, {"id": "q17", "title": "Percent of Total Without a Self Join", "difficulty": "Medium", "pattern": "Window aggregate", "topics": ["Window Functions", "Aggregation"], "prompt": "For each region return total sales and that region's share of the grand total.\n\n**Output columns:** `region`, `region_total`, `pct_of_total` (rounded to 2 decimals, e.g. 41.67)\n**Order by:** `region`", "setup": "CREATE TABLE sales (region TEXT, rep TEXT, amount REAL);\nINSERT INTO sales VALUES\n ('APAC','a',100.0),('APAC','b',150.0),\n ('EMEA','c',300.0),('EMEA','d',50.0),\n ('AMER','e',400.0);", "solution": "SELECT region,\n       SUM(amount) AS region_total,\n       ROUND(100.0*SUM(amount)/SUM(SUM(amount)) OVER (),2) AS pct_of_total\nFROM sales GROUP BY region ORDER BY region;", "ordered": true, "hints": ["You can nest an aggregate inside a window function: SUM(SUM(amount)) OVER ().", "Multiply by 100.0 (not 100) — integer division silently truncates in several engines."], "explanation": "The window runs *after* the GROUP BY, so `SUM(SUM(x)) OVER ()` gives the grand total alongside each group without a second scan. The alternative — a CROSS JOIN to a scalar subquery — reads the table twice.", "walkthrough": "Grand total is 1000. AMER 400 is 40%, EMEA 350 is 35%, APAC 250 is 25%.", "company": null, "seen": "Core DE pattern"}, {"id": "q18", "title": "Orphan Fact Rows", "difficulty": "Medium", "pattern": "Referential integrity check", "topics": ["Joins", "Data Quality"], "prompt": "The warehouse has no enforced foreign keys. Find `product_id` values present in `fact_sales` but missing from `dim_product`, with how many fact rows and how much revenue are affected.\n\n**Output columns:** `product_id`, `orphan_rows`, `orphan_amount` (rounded to 2 decimals)\n**Order by:** `product_id`", "setup": "CREATE TABLE dim_product (product_id INTEGER, product_name TEXT);\nINSERT INTO dim_product VALUES (1,'Widget'),(2,'Gadget'),(3,'Doohickey');\nCREATE TABLE fact_sales (sale_id INTEGER, product_id INTEGER, amount REAL);\nINSERT INTO fact_sales VALUES\n (1,1,100.0),(2,2,50.0),(3,9,75.0),(4,9,25.0),(5,7,300.0),(6,3,10.0);", "solution": "SELECT f.product_id, COUNT(*) AS orphan_rows, ROUND(SUM(f.amount),2) AS orphan_amount\nFROM fact_sales f\nWHERE NOT EXISTS (SELECT 1 FROM dim_product d WHERE d.product_id = f.product_id)\nGROUP BY f.product_id ORDER BY f.product_id;", "ordered": true, "hints": ["Anti-join the fact to the dimension, then aggregate what's left.", "Quantifying the blast radius (rows AND revenue) is what turns this from a query into an answer."], "explanation": "A standard nightly data-quality check. Follow-up you should volunteer: orphans usually mean a late-arriving dimension, and the production fix is to route them to a `-1` unknown surrogate key rather than dropping the fact rows.", "walkthrough": "product_id 9 has 2 fact rows worth 100 total, and product_id 7 has 1 row worth 300. Neither exists in dim_product, so 400 of revenue is currently unattributable.", "company": null, "seen": "Core DE pattern"}, {"id": "q19", "title": "Top 2 Products per Category (Ties Kept)", "difficulty": "Medium", "pattern": "Top-N per group", "topics": ["Window Functions", "Ranking"], "prompt": "Return the top 2 products by revenue **within each category**. If products tie on revenue at a ranking position, keep all of them.\n\n**Output columns:** `category`, `product`, `revenue`, `rnk`\n**Order by:** `category`, `revenue` descending, `product`", "setup": "CREATE TABLE products (category TEXT, product TEXT, revenue REAL);\nINSERT INTO products VALUES\n ('electronics','tv',5000.0),('electronics','phone',5000.0),('electronics','laptop',3000.0),('electronics','cable',100.0),\n ('grocery','rice',900.0),('grocery','oil',700.0),('grocery','salt',50.0),\n ('toys','puzzle',200.0);", "solution": "WITH r AS (\n  SELECT category, product, revenue,\n         DENSE_RANK() OVER (PARTITION BY category ORDER BY revenue DESC) AS rnk\n  FROM products\n)\nSELECT category, product, revenue, rnk FROM r WHERE rnk <= 2\nORDER BY category, revenue DESC, product;", "ordered": true, "hints": ["ROW_NUMBER picks an arbitrary winner among ties; RANK skips positions after a tie; DENSE_RANK keeps a true 2nd place.", "Electronics has a tie at the top — with DENSE_RANK you should get three electronics rows."], "explanation": "Interviewers are watching how you handle ties, not whether you know window syntax. State your choice before being asked: ROW_NUMBER for deterministic dedup, DENSE_RANK when tied rows should all survive, RANK when position gaps are meaningful (leaderboards).", "walkthrough": "Electronics has tv and phone tied at 5000 (both DENSE_RANK 1) and laptop at 3000 (rank 2) — three rows survive. Toys has only one product, which is still rank 1.", "seen": "prepare.sh DE track", "company": "Coinbase"}, {"id": "q20", "title": "Running Balance per Customer", "difficulty": "Medium", "pattern": "Running total", "topics": ["Window Functions"], "prompt": "Return every transaction with a running total of `amount` per customer, ordered by date.\n\n**Output columns:** `customer_id`, `txn_date`, `amount`, `running_total` (rounded to 2 decimals)\n**Order by:** `customer_id`, `txn_date`", "setup": "CREATE TABLE transactions (customer_id INTEGER, txn_date TEXT, amount REAL);\nINSERT INTO transactions VALUES\n (1,'2024-01-01',100.0),(1,'2024-01-05',-30.0),(1,'2024-02-11',250.0),\n (2,'2024-01-03',400.0),(2,'2024-01-04',-100.0),\n (3,'2024-03-01',75.5);", "solution": "SELECT customer_id, txn_date, amount,\n       ROUND(SUM(amount) OVER (PARTITION BY customer_id ORDER BY txn_date\n             ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW),2) AS running_total\nFROM transactions ORDER BY customer_id, txn_date;", "ordered": true, "hints": ["SUM(x) OVER (PARTITION BY k ORDER BY d) already defaults to a running total.", "The default frame is RANGE UNBOUNDED PRECEDING — with duplicate dates that sums all tied rows at once. ROWS gives you row-by-row."], "explanation": "Know the RANGE vs ROWS distinction cold — it is the most common senior follow-up on this question. With ties in the ORDER BY column, RANGE (the default) lumps peers together and ROWS does not.", "walkthrough": "Customer 1 runs 100 → 70 (after a -30) → 320. Customer 2 runs 400 → 300. Customer 3 has a single transaction so the running total equals the amount.", "seen": "prepare.sh DE track", "company": "Uber"}, {"id": "q21", "title": "Month-over-Month Growth", "difficulty": "Medium", "pattern": "Period-over-period", "topics": ["Window Functions", "Dates"], "prompt": "Aggregate `orders` to monthly revenue, then show the previous month's revenue and the percentage change.\n\n`pct_change` = (this - prev) / prev * 100, rounded to 2 decimals, NULL for the first month.\n\n**Output columns:** `month` (`YYYY-MM`), `revenue`, `prev_revenue`, `pct_change`\n**Order by:** `month`", "setup": "CREATE TABLE orders (order_id INTEGER, order_date TEXT, amount REAL);\nINSERT INTO orders VALUES\n (1,'2024-01-04',100.0),(2,'2024-01-20',150.0),\n (3,'2024-02-02',200.0),(4,'2024-02-14',100.0),\n (5,'2024-03-09',600.0),\n (6,'2024-04-01',300.0),(7,'2024-04-30',300.0);", "solution": "WITH m AS (\n  SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS revenue\n  FROM orders GROUP BY 1\n)\nSELECT month, revenue,\n       LAG(revenue) OVER (ORDER BY month) AS prev_revenue,\n       ROUND(100.0*(revenue - LAG(revenue) OVER (ORDER BY month))/LAG(revenue) OVER (ORDER BY month),2) AS pct_change\nFROM m ORDER BY month;", "ordered": true, "hints": ["Aggregate to the month grain first, then LAG over the aggregated set.", "The first month's LAG is NULL, and NULL arithmetic yields NULL — which is exactly what's wanted here."], "explanation": "Interview follow-up: what if a month has zero orders? LAG walks over *rows present in the result*, so a missing month silently compares March to January. The fix is to LEFT JOIN a month spine first — which is why the date-spine question exists.", "walkthrough": "January 250, February 300 (+20%), March 600 (+100%), April 600 (0%). January has no previous month, so prev_revenue and pct_change are NULL.", "seen": "DWP 28-day list", "company": "CGI"}, {"id": "q22", "title": "7-Day Rolling Average", "difficulty": "Medium", "pattern": "Moving window", "topics": ["Window Functions"], "prompt": "Return each day's DAU plus the 7-day rolling average (current day and the 6 days before it).\n\n**Output columns:** `d`, `dau`, `rolling_7d` (rounded to 2 decimals)\n**Order by:** `d`", "setup": "CREATE TABLE daily_active (d TEXT, dau INTEGER);\nINSERT INTO daily_active VALUES\n ('2024-03-01',100),('2024-03-02',120),('2024-03-03',90),('2024-03-04',150),\n ('2024-03-05',160),('2024-03-06',130),('2024-03-07',110),('2024-03-08',200),\n ('2024-03-09',210),('2024-03-10',180);", "solution": "SELECT d, dau,\n       ROUND(AVG(dau) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW),2) AS rolling_7d\nFROM daily_active ORDER BY d;", "ordered": true, "hints": ["ROWS BETWEEN 6 PRECEDING AND CURRENT ROW = a 7-row window including the current row.", "The first 6 rows average over fewer days — that is expected unless the question says otherwise."], "explanation": "Off-by-one on the frame is the usual mistake (`7 PRECEDING` gives you 8 days). Mention that ROWS counts rows while RANGE INTERVAL '6 days' counts calendar days — they differ the moment a date is missing from the table.", "walkthrough": "The first row's average is just itself (100). By 2024-03-07 the window is full at 7 days. From 2024-03-08 onward the window slides, dropping the oldest day as it adds the newest.", "seen": "prepare.sh DE track", "company": "DeutscheBank"}, {"id": "q23", "title": "First and Last Order per Customer", "difficulty": "Medium", "pattern": "First/last value", "topics": ["Window Functions"], "prompt": "For each customer return the date and amount of their first and last order.\n\n**Output columns:** `customer_id`, `first_order_date`, `first_amount`, `last_order_date`, `last_amount`\n**Order by:** `customer_id`", "setup": "CREATE TABLE orders (order_id INTEGER, customer_id INTEGER, order_date TEXT, amount REAL);\nINSERT INTO orders VALUES\n (1,1,'2024-01-10',50.0),(2,1,'2024-02-14',75.0),(3,1,'2024-05-02',20.0),\n (4,2,'2024-03-01',300.0),\n (5,3,'2024-01-01',10.0),(6,3,'2024-01-02',20.0);", "solution": "WITH r AS (\n  SELECT customer_id, order_date, amount,\n         ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date ASC)  AS rn_asc,\n         ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC) AS rn_desc\n  FROM orders\n)\nSELECT customer_id,\n       MAX(CASE WHEN rn_asc=1  THEN order_date END) AS first_order_date,\n       MAX(CASE WHEN rn_asc=1  THEN amount END)     AS first_amount,\n       MAX(CASE WHEN rn_desc=1 THEN order_date END) AS last_order_date,\n       MAX(CASE WHEN rn_desc=1 THEN amount END)     AS last_amount\nFROM r GROUP BY customer_id ORDER BY customer_id;", "ordered": true, "hints": ["Two ROW_NUMBERs (ASC and DESC) then conditional aggregation collapses to one row per customer.", "If you use LAST_VALUE, remember the default frame stops at the current row — you must add ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING."], "explanation": "The LAST_VALUE frame trap is a classic senior filter — most candidates write LAST_VALUE(x) OVER (PARTITION BY k ORDER BY d) and get the current row back instead of the last. The two-ROW_NUMBER pattern sidesteps it entirely.", "walkthrough": "Customer 1's first order is 2024-01-10 for 50 and last is 2024-05-02 for 20. Customer 2 has a single order, so first and last are the same row.", "company": null, "seen": "Core DE pattern"}, {"id": "q24", "title": "ROW_NUMBER vs RANK vs DENSE_RANK", "difficulty": "Medium", "pattern": "Ranking functions", "topics": ["Window Functions", "Ranking"], "prompt": "Return every player with all three ranking values over `score` descending. Break ROW_NUMBER ties by `player` ascending so the output is deterministic.\n\n**Output columns:** `player`, `score`, `rn`, `rnk`, `dns`\n**Order by:** `score` descending, then `player`", "setup": "CREATE TABLE scores (player TEXT, score INTEGER);\nINSERT INTO scores VALUES ('ann',100),('bob',100),('cat',90),('dan',90),('eve',80),('fay',70);", "solution": "SELECT player, score,\n       ROW_NUMBER() OVER (ORDER BY score DESC, player) AS rn,\n       RANK()       OVER (ORDER BY score DESC) AS rnk,\n       DENSE_RANK() OVER (ORDER BY score DESC) AS dns\nFROM scores ORDER BY score DESC, player;", "ordered": true, "hints": ["Watch what happens at row 3: RANK jumps to 3 while DENSE_RANK says 2.", "ROW_NUMBER needs a tie-breaker in ORDER BY or its output is non-deterministic between runs."], "explanation": "Be able to explain the difference in one sentence each, plus when each is correct: ROW_NUMBER for dedup and pagination, RANK for competition standings, DENSE_RANK for 'top N distinct values'. Non-determinism in ROW_NUMBER is a genuine production bug — it makes reruns produce different data.", "walkthrough": "ann and bob tie at 100. ROW_NUMBER gives them 1 and 2 (broken by name), RANK gives both 1 then jumps cat to 3, DENSE_RANK gives both 1 then cat 2.", "seen": "prepare.sh DE track", "company": "Amazon"}, {"id": "q25", "title": "Quartile Customers by Spend", "difficulty": "Medium", "pattern": "Bucketing", "topics": ["Window Functions"], "prompt": "Split customers into 4 equal-sized buckets by `spend`, with quartile 1 being the **highest** spenders.\n\n**Output columns:** `customer_id`, `spend`, `quartile`\n**Order by:** `spend` descending, then `customer_id`", "setup": "CREATE TABLE customers (customer_id INTEGER, spend REAL);\nINSERT INTO customers VALUES\n (1,900.0),(2,800.0),(3,700.0),(4,600.0),(5,500.0),(6,400.0),(7,300.0),(8,200.0);", "solution": "SELECT customer_id, spend,\n       NTILE(4) OVER (ORDER BY spend DESC, customer_id) AS quartile\nFROM customers ORDER BY spend DESC, customer_id;", "ordered": true, "hints": ["NTILE(4) OVER (ORDER BY ...) — the ORDER BY direction decides which bucket is 'top'.", "When rows don't divide evenly, NTILE puts the extra rows in the earlier buckets."], "explanation": "Used constantly for RFM segmentation and A/B cohorting. Know the caveat: NTILE splits by *row count*, not by value, so identical values can land in different buckets — if that matters use explicit thresholds or PERCENT_RANK.", "walkthrough": "Eight customers split into four buckets of two. Quartile 1 is the 900 and 800 spenders because the ORDER BY is descending; quartile 4 is 300 and 200.", "company": null, "seen": "Core DE pattern"}, {"id": "q26", "title": "Time Between Consecutive Logins", "difficulty": "Medium", "pattern": "LAG on timestamps", "topics": ["Window Functions", "Dates"], "prompt": "For each login, return the number of whole minutes since that user's previous login (NULL for their first login).\n\n**Output columns:** `user_id`, `login_at`, `mins_since_prev`\n**Order by:** `user_id`, `login_at`", "setup": "CREATE TABLE logins (user_id INTEGER, login_at TEXT);\nINSERT INTO logins VALUES\n (1,'2024-03-01 09:00:00'),(1,'2024-03-01 09:20:00'),(1,'2024-03-01 11:00:00'),\n (2,'2024-03-01 08:00:00'),(2,'2024-03-02 08:30:00'),\n (3,'2024-03-05 22:15:00');", "solution": "SELECT user_id, login_at,\n       CAST(ROUND((julianday(login_at) - julianday(LAG(login_at) OVER (PARTITION BY user_id ORDER BY login_at)))*1440) AS INTEGER) AS mins_since_prev\nFROM logins ORDER BY user_id, login_at;", "ordered": true, "hints": ["SQLite has no timestamp subtraction — use (julianday(a) - julianday(b)) * 1440 for minutes.", "Postgres: EXTRACT(EPOCH FROM (a-b))/60. Spark/Databricks: (unix_timestamp(a) - unix_timestamp(b))/60."], "explanation": "The building block for sessionization. Floating-point julianday arithmetic needs an explicit ROUND — a common source of 19.999999 minutes. Always partition by user; forgetting it silently compares across users.", "walkthrough": "User 1's second login is 20 minutes after the first and the third is 100 minutes after that. User 3 has one login only, so the value is NULL.", "company": null, "seen": "Core DE pattern"}, {"id": "q27", "title": "Cumulative New Users", "difficulty": "Hard", "pattern": "Cumulative distinct", "topics": ["Window Functions", "Aggregation"], "prompt": "From an event stream, return for each date: how many users were seen for the **first time** that day, and the cumulative count of distinct users up to and including that day.\n\nOnly include dates that have events.\n\n**Output columns:** `d`, `new_users`, `cumulative_users`\n**Order by:** `d`", "setup": "CREATE TABLE events (user_id INTEGER, event_date TEXT);\nINSERT INTO events VALUES\n (1,'2024-03-01'),(2,'2024-03-01'),(1,'2024-03-01'),\n (1,'2024-03-02'),(3,'2024-03-02'),\n (2,'2024-03-03'),(4,'2024-03-03'),(5,'2024-03-03'),\n (1,'2024-03-04'),(3,'2024-03-04');", "solution": "WITH firsts AS (\n  SELECT user_id, MIN(event_date) AS first_date FROM events GROUP BY user_id\n), per_day AS (\n  SELECT first_date AS d, COUNT(*) AS new_users FROM firsts GROUP BY first_date\n)\nSELECT d, new_users,\n       SUM(new_users) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cumulative_users\nFROM per_day ORDER BY d;", "ordered": true, "hints": ["You cannot do a running COUNT(DISTINCT) with a window function in most engines.", "Collapse to each user's first-seen date, count per day, then take a plain running SUM."], "explanation": "Tests whether you know that COUNT(DISTINCT) is not supported as a window function. The reduction — 'distinct users up to day D' equals 'users whose first day <= D' — is the insight interviewers are looking for. At scale the production answer is HyperLogLog sketches.", "walkthrough": "March 1 introduces users 1 and 2 (cumulative 2). March 2 adds user 3 (3). March 3 adds users 4 and 5 (5). March 4 has activity from users 1 and 3 but they are not new, so that date does not appear.", "seen": "DWP 28-day list", "company": "Tiger Analytics"}, {"id": "q28", "title": "Median Salary per Department", "difficulty": "Hard", "pattern": "Median without percentile", "topics": ["Window Functions", "Aggregation"], "prompt": "Return the median salary for each department, without using a percentile/median built-in. For an even number of rows take the average of the two middle values.\n\n**Output columns:** `dept`, `median_salary` (rounded to 2 decimals)\n**Order by:** `dept`", "setup": "CREATE TABLE salaries (dept TEXT, emp_id INTEGER, salary REAL);\nINSERT INTO salaries VALUES\n ('DATA',1,50000),('DATA',2,60000),('DATA',3,70000),('DATA',4,90000),\n ('ENG',5,100000),('ENG',6,120000),('ENG',7,140000),\n ('HR',8,45000);", "solution": "WITH r AS (\n  SELECT dept, salary,\n         ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary) AS rn,\n         COUNT(*)     OVER (PARTITION BY dept) AS cnt\n  FROM salaries\n)\nSELECT dept, ROUND(AVG(salary),2) AS median_salary\nFROM r\nWHERE rn IN ((cnt+1)/2, (cnt+2)/2)\nGROUP BY dept ORDER BY dept;", "ordered": true, "hints": ["Number the rows within each group and also carry the group size.", "Integer division makes (cnt+1)/2 and (cnt+2)/2 collapse to the same row for odd counts and the two middle rows for even counts."], "explanation": "Whiteboard favourite because there is no single built-in everywhere: Postgres/Snowflake have PERCENTILE_CONT, Spark has percentile_approx, MySQL 5.7 had nothing. The ROW_NUMBER + COUNT trick is the portable answer — and knowing why medians can't be pre-aggregated (non-additive metric) is a good thing to volunteer.", "walkthrough": "DATA has 4 salaries (50k, 60k, 70k, 90k) so the median is the average of 60k and 70k = 65000. ENG has 3 so the median is the middle value 120000. HR has one row.", "seen": "prepare.sh DE track", "company": "ActivisionBlizzard"}, {"id": "q29", "title": "Build an SCD Type 2 Dimension", "difficulty": "Hard", "pattern": "SCD Type 2", "topics": ["SCD", "Window Functions", "Modeling"], "prompt": "`customer_changes` is a change log of customer addresses. Turn it into an SCD Type 2 dimension.\n\n- `effective_from` = the date the value started\n- `effective_to` = the day **before** the next change, or `9999-12-31` for the current row\n- `is_current` = 1 for the latest row per customer, else 0\n\n**Output columns:** `customer_id`, `address`, `effective_from`, `effective_to`, `is_current`\n**Order by:** `customer_id`, `effective_from`", "setup": "CREATE TABLE customer_changes (customer_id INTEGER, address TEXT, changed_at TEXT);\nINSERT INTO customer_changes VALUES\n (1,'Hyderabad','2022-01-01'),(1,'Bengaluru','2023-06-15'),(1,'Pune','2024-02-01'),\n (2,'Delhi','2023-03-10'),\n (3,'Chennai','2021-11-05'),(3,'Mumbai','2024-01-01');", "solution": "SELECT customer_id, address,\n       changed_at AS effective_from,\n       COALESCE(date(LEAD(changed_at) OVER (PARTITION BY customer_id ORDER BY changed_at),'-1 day'),'9999-12-31') AS effective_to,\n       CASE WHEN LEAD(changed_at) OVER (PARTITION BY customer_id ORDER BY changed_at) IS NULL THEN 1 ELSE 0 END AS is_current\nFROM customer_changes\nORDER BY customer_id, effective_from;", "ordered": true, "hints": ["LEAD(changed_at) gives you the start of the next version; subtract a day for a closed [from, to] range.", "The row where LEAD is NULL is the current row."], "explanation": "The most-asked modeling-plus-SQL question in DE interviews. Be ready for the follow-ups: (1) closed `[from, to]` vs half-open `[from, to)` ranges — half-open avoids the -1 day fiddle and timestamp gaps; (2) what happens with a backdated late-arriving change (you must re-close the surrounding rows); (3) how you'd implement it incrementally with MERGE / Delta Lake MERGE INTO rather than a full rebuild.", "walkthrough": "Customer 1 has three address versions: Hyderabad closes the day before the Bengaluru change (2023-06-14), Bengaluru closes 2024-01-31, and Pune is current with 9999-12-31 and is_current=1.", "company": null, "seen": "Core DE pattern"}, {"id": "q30", "title": "Validate an SCD2 Dimension", "difficulty": "Hard", "pattern": "SCD integrity check", "topics": ["SCD", "Data Quality", "Window Functions"], "prompt": "Audit `dim_customer` for two defects:\n- `overlap` — a row whose `effective_to` is on or after the next row's `effective_from` for the same customer\n- `multiple_current` — a customer with more than one row flagged `is_current = 1`\n\nReport one row per (customer, issue); report a customer only once per issue type.\n\n**Output columns:** `customer_id`, `issue`\n**Order by:** `customer_id`, `issue`", "setup": "CREATE TABLE dim_customer (customer_id INTEGER, address TEXT, effective_from TEXT, effective_to TEXT, is_current INTEGER);\nINSERT INTO dim_customer VALUES\n (1,'Hyderabad','2022-01-01','2023-06-14',0),\n (1,'Bengaluru','2023-06-15','9999-12-31',1),\n (2,'Delhi','2023-01-01','2023-12-31',0),\n (2,'Noida','2023-11-01','9999-12-31',1),\n (3,'Chennai','2021-01-01','2022-12-31',1),\n (3,'Mumbai','2023-01-01','9999-12-31',1);", "solution": "WITH nxt AS (\n  SELECT customer_id, effective_from, effective_to,\n         LEAD(effective_from) OVER (PARTITION BY customer_id ORDER BY effective_from) AS next_from\n  FROM dim_customer\n)\nSELECT DISTINCT customer_id, 'overlap' AS issue\nFROM nxt WHERE next_from IS NOT NULL AND effective_to >= next_from\nUNION ALL\nSELECT customer_id, 'multiple_current'\nFROM dim_customer WHERE is_current = 1\nGROUP BY customer_id HAVING COUNT(*) > 1\nORDER BY 1, 2;", "ordered": true, "hints": ["LEAD(effective_from) lets you compare each interval with the next one for the same key.", "Customer 2's ranges overlap in November; customer 3 has two current rows."], "explanation": "The realistic version of the SCD question — 'you inherited this dimension, prove it's correct.' Same shape as detecting overlapping bookings or double-billing periods. Add checks for gaps (next_from > date(effective_to,'+1 day')) and for exactly one current row per key.", "walkthrough": "Customer 2's first range ends 2023-12-31 but the next starts 2023-11-01 — they overlap in November. Customer 3 has two rows both flagged is_current=1. Customer 1 is clean.", "seen": "prepare.sh DE track", "company": "X"}, {"id": "q31", "title": "Incremental Load Watermark", "difficulty": "Medium", "pattern": "Incremental extraction", "topics": ["Incremental Load", "Joins"], "prompt": "`load_log` stores the high-water mark from the last successful run. Return the rows from `source_orders` that the next incremental batch should pick up — rows whose `updated_at` is strictly greater than the watermark.\n\n**Output columns:** `order_id`, `status`, `updated_at`\n**Order by:** `updated_at`, `order_id`", "setup": "CREATE TABLE source_orders (order_id INTEGER, status TEXT, updated_at TEXT);\nINSERT INTO source_orders VALUES\n (1,'shipped','2024-03-01 10:00:00'),(2,'placed','2024-03-02 09:00:00'),\n (3,'placed','2024-03-03 23:59:59'),(4,'cancelled','2024-03-04 00:00:01'),\n (5,'shipped','2024-03-04 12:00:00'),(6,'placed','2024-03-05 06:00:00');\nCREATE TABLE load_log (table_name TEXT, last_watermark TEXT, load_status TEXT);\nINSERT INTO load_log VALUES\n ('source_orders','2024-03-02 09:00:00','success'),\n ('source_orders','2024-03-03 23:59:59','success'),\n ('source_orders','2024-03-04 12:00:00','failed');", "solution": "SELECT order_id, status, updated_at\nFROM source_orders\nWHERE updated_at > (SELECT MAX(last_watermark) FROM load_log\n                    WHERE table_name='source_orders' AND load_status='success')\nORDER BY updated_at, order_id;", "ordered": true, "hints": ["The watermark is the max of *successful* runs only — a failed run must not advance it.", "Use strictly greater-than to avoid reprocessing the boundary row."], "explanation": "Directly mirrors an ADF/Airflow incremental pattern. Talk through the edge cases: `>` vs `>=` (duplicate boundary rows vs missed rows), clock skew and open transactions committing after the watermark was read, and why hard deletes are invisible to a watermark — which is the argument for CDC.", "walkthrough": "The watermark is the max over *successful* loads only: 2024-03-03 23:59:59. The failed run at 2024-03-04 12:00:00 must not advance it, so orders 4, 5 and 6 are all picked up.", "company": null, "seen": "Core DE pattern"}, {"id": "q32", "title": "Apply a Delta Batch (MERGE Simulation)", "difficulty": "Hard", "pattern": "Upsert / MERGE", "topics": ["Incremental Load", "Window Functions"], "prompt": "`target_snapshot` is the current table. `delta_batch` carries operations: `I` insert, `U` update, `D` delete. A key may appear multiple times in the batch — only the latest operation by `op_ts` applies.\n\nReturn the state of the table **after** applying the batch.\n\n**Output columns:** `id`, `val`\n**Order by:** `id`", "setup": "CREATE TABLE target_snapshot (id INTEGER, val TEXT);\nINSERT INTO target_snapshot VALUES (1,'a'),(2,'b'),(3,'c'),(4,'d');\nCREATE TABLE delta_batch (id INTEGER, val TEXT, op TEXT, op_ts TEXT);\nINSERT INTO delta_batch VALUES\n (2,'b2','U','2024-03-01 10:00:00'),\n (3,NULL,'D','2024-03-01 10:05:00'),\n (5,'e','I','2024-03-01 10:10:00'),\n (5,'e2','U','2024-03-01 11:00:00'),\n (6,'f','I','2024-03-01 11:30:00'),\n (6,NULL,'D','2024-03-01 12:00:00');", "solution": "WITH latest AS (\n  SELECT id, val, op FROM (\n    SELECT id, val, op, ROW_NUMBER() OVER (PARTITION BY id ORDER BY op_ts DESC) AS rn\n    FROM delta_batch\n  ) WHERE rn = 1\n)\nSELECT id, val FROM (\n  SELECT t.id, t.val FROM target_snapshot t\n  WHERE NOT EXISTS (SELECT 1 FROM latest l WHERE l.id = t.id)\n  UNION ALL\n  SELECT l.id, l.val FROM latest l WHERE l.op <> 'D'\n) ORDER BY id;", "ordered": true, "hints": ["Collapse the batch to one row per key first (latest op wins) — otherwise id 5 and 6 double-apply.", "Untouched target rows + surviving delta rows = final state. Rows whose final op is D disappear entirely."], "explanation": "This is MERGE INTO written by hand, and it's exactly what Delta Lake / Snowflake MERGE does under the covers. Critically, MERGE errors out if the source has duplicate keys — the dedup CTE is not optional. Id 6 (inserted then deleted in the same batch) is the edge case interviewers plant.", "walkthrough": "Id 1 is untouched. Id 2 is updated to b2. Id 3 is deleted. Id 4 is untouched. Id 5 is inserted then updated, so only e2 survives. Id 6 is inserted then deleted in the same batch and must not appear at all.", "company": null, "seen": "Core DE pattern"}, {"id": "q33", "title": "Longest Login Streak (Gaps and Islands)", "difficulty": "Hard", "pattern": "Gaps and islands", "topics": ["Gaps and Islands", "Window Functions", "Dates"], "prompt": "`user_activity` has one row per user per active day. Find each user's **longest run of consecutive days**.\n\nIf a user has two runs of the same length, return the one that starts earliest.\n\n**Output columns:** `user_id`, `streak_len`, `streak_start`, `streak_end`\n**Order by:** `user_id`", "setup": "CREATE TABLE user_activity (user_id INTEGER, activity_date TEXT);\nINSERT INTO user_activity VALUES\n (1,'2024-03-01'),(1,'2024-03-02'),(1,'2024-03-03'),(1,'2024-03-07'),(1,'2024-03-08'),\n (2,'2024-03-01'),(2,'2024-03-03'),(2,'2024-03-04'),(2,'2024-03-05'),(2,'2024-03-06'),\n (3,'2024-03-10');", "solution": "WITH grp AS (\n  SELECT user_id, activity_date,\n         date(activity_date, '-' || ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY activity_date) || ' day') AS island\n  FROM user_activity\n), runs AS (\n  SELECT user_id, island, COUNT(*) AS streak_len,\n         MIN(activity_date) AS streak_start, MAX(activity_date) AS streak_end\n  FROM grp GROUP BY user_id, island\n), best AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY streak_len DESC, streak_start) AS rn\n  FROM runs\n)\nSELECT user_id, streak_len, streak_start, streak_end FROM best WHERE rn=1 ORDER BY user_id;", "ordered": true, "hints": ["Subtract the row number (as days) from the date — consecutive dates all collapse to the same constant.", "Group by that constant to get islands, then pick the largest per user."], "explanation": "The canonical hard-tier pattern, and it reappears as consecutive wins, streaming-session runs, and consecutive months of activity. The trick: for consecutive dates, date - row_number is invariant. For integer sequences it's simply `value - row_number`. Say the name 'gaps and islands' out loud — interviewers grade recognition speed.", "walkthrough": "User 1 has runs of 3 days (Mar 1-3) and 2 days (Mar 7-8) — the longer wins. User 2 has a single day then a 4-day run (Mar 3-6). User 3 has one day, a streak of length 1.", "seen": "DWP 28-day list", "company": "Cognizant"}, {"id": "q34", "title": "Sessionize an Event Stream", "difficulty": "Hard", "pattern": "Sessionization", "topics": ["Sessionization", "Window Functions"], "prompt": "Group events into sessions per user. A new session starts when the gap from the previous event is **more than 30 minutes**.\n\nNumber sessions from 1 per user in time order.\n\n**Output columns:** `user_id`, `session_no`, `session_start`, `session_end`, `event_count`\n**Order by:** `user_id`, `session_no`", "setup": "CREATE TABLE events (user_id INTEGER, event_ts TEXT);\nINSERT INTO events VALUES\n (1,'2024-03-01 09:00:00'),(1,'2024-03-01 09:10:00'),(1,'2024-03-01 09:25:00'),\n (1,'2024-03-01 10:30:00'),(1,'2024-03-01 10:45:00'),\n (2,'2024-03-01 12:00:00'),\n (2,'2024-03-01 12:31:00'),(2,'2024-03-01 12:35:00');", "solution": "WITH flagged AS (\n  SELECT user_id, event_ts,\n         CASE WHEN LAG(event_ts) OVER (PARTITION BY user_id ORDER BY event_ts) IS NULL\n                OR (julianday(event_ts) - julianday(LAG(event_ts) OVER (PARTITION BY user_id ORDER BY event_ts)))*1440 > 30\n              THEN 1 ELSE 0 END AS is_new\n  FROM events\n), sess AS (\n  SELECT user_id, event_ts,\n         SUM(is_new) OVER (PARTITION BY user_id ORDER BY event_ts ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS session_no\n  FROM flagged\n)\nSELECT user_id, session_no, MIN(event_ts) AS session_start, MAX(event_ts) AS session_end, COUNT(*) AS event_count\nFROM sess GROUP BY user_id, session_no ORDER BY user_id, session_no;", "ordered": true, "hints": ["Flag each event 1 if the gap from the previous event exceeds the threshold, else 0.", "A running SUM of that flag *is* the session number — the classic flag-then-cumulative-sum trick."], "explanation": "Asked constantly at product companies and increasingly in DE loops. The LAG -> flag -> running SUM idiom is worth memorising; it also solves 'number the batches', 'group contiguous status runs', and streaming session windows. Note user 2's gap is exactly 31 minutes — boundary conditions (> vs >=) are deliberately planted.", "walkthrough": "User 1's first three events are within 30 minutes of each other so they form session 1; the 65-minute jump to 10:30 opens session 2. User 2's gap is exactly 31 minutes, which is more than 30, so it splits into two sessions.", "seen": "DWP 28-day list", "company": "TCS"}, {"id": "q35", "title": "Funnel Conversion Rates", "difficulty": "Hard", "pattern": "Funnel analysis", "topics": ["Funnel", "Aggregation"], "prompt": "Build a 3-stage funnel over `events`: `view` -> `add_to_cart` -> `purchase`.\n\nA user counts at a stage only if they completed **all prior stages** too (stage membership, timestamps not required).\n\n`pct_of_previous` = users at this stage / users at previous stage * 100, rounded to 2 decimals; 100.00 for stage 1.\n\n**Output columns:** `step_no`, `stage`, `users`, `pct_of_previous`\n**Order by:** `step_no`", "setup": "CREATE TABLE events (user_id INTEGER, event_type TEXT, event_ts TEXT);\nINSERT INTO events VALUES\n (1,'view','2024-03-01 09:00:00'),(1,'add_to_cart','2024-03-01 09:05:00'),(1,'purchase','2024-03-01 09:10:00'),\n (2,'view','2024-03-01 09:00:00'),(2,'add_to_cart','2024-03-01 09:06:00'),\n (3,'view','2024-03-01 09:00:00'),\n (4,'view','2024-03-01 09:00:00'),(4,'add_to_cart','2024-03-01 09:20:00'),(4,'purchase','2024-03-01 09:40:00'),\n (5,'view','2024-03-01 10:00:00'),\n (6,'add_to_cart','2024-03-01 11:00:00'),(6,'purchase','2024-03-01 11:05:00');", "solution": "WITH u AS (\n  SELECT user_id,\n         MAX(CASE WHEN event_type='view' THEN 1 ELSE 0 END) AS viewed,\n         MAX(CASE WHEN event_type='add_to_cart' THEN 1 ELSE 0 END) AS carted,\n         MAX(CASE WHEN event_type='purchase' THEN 1 ELSE 0 END) AS purchased\n  FROM events GROUP BY user_id\n), c AS (\n  SELECT SUM(viewed) AS s1,\n         SUM(CASE WHEN viewed=1 AND carted=1 THEN 1 ELSE 0 END) AS s2,\n         SUM(CASE WHEN viewed=1 AND carted=1 AND purchased=1 THEN 1 ELSE 0 END) AS s3\n  FROM u\n)\nSELECT 1 AS step_no,'view' AS stage, s1 AS users, 100.00 AS pct_of_previous FROM c\nUNION ALL SELECT 2,'add_to_cart', s2, ROUND(100.0*s2/s1,2) FROM c\nUNION ALL SELECT 3,'purchase', s3, ROUND(100.0*s3/s2,2) FROM c\nORDER BY step_no;", "ordered": true, "hints": ["Flatten to one row per user with a 0/1 flag per stage using MAX(CASE WHEN ...).", "User 6 purchased without ever viewing — they must not count at any stage."], "explanation": "User 6 is the planted trap: funnels are cumulative, so a purchase without a view doesn't count. The realistic follow-up is strict time ordering (cart must come *after* view, within a window) — that version needs MIN(ts) per stage per user and comparisons between them.", "walkthrough": "Five users viewed. Of those, three also carted (users 1, 2, 4) = 60%. Of those, two also purchased (users 1, 4) = 66.67%. User 6 purchased without ever viewing and is excluded from every stage.", "seen": "DWP 28-day list", "company": "Accenture"}, {"id": "q36", "title": "Monthly Cohort Retention", "difficulty": "Hard", "pattern": "Cohort analysis", "topics": ["Cohort", "Dates", "Joins"], "prompt": "Build a retention grid. A user's cohort is their signup month. `month_number` is the number of months between the cohort month and the activity month (0 = signup month).\n\nReturn only combinations that have at least one active user, for month numbers 0 to 2.\n\n**Output columns:** `cohort_month` (`YYYY-MM`), `month_number`, `active_users`\n**Order by:** `cohort_month`, `month_number`", "setup": "CREATE TABLE users (user_id INTEGER, signup_date TEXT);\nINSERT INTO users VALUES (1,'2024-01-10'),(2,'2024-01-20'),(3,'2024-02-05'),(4,'2024-02-14'),(5,'2024-02-28');\nCREATE TABLE activity (user_id INTEGER, activity_date TEXT);\nINSERT INTO activity VALUES\n (1,'2024-01-15'),(1,'2024-02-03'),(1,'2024-03-09'),\n (2,'2024-01-25'),(2,'2024-03-01'),\n (3,'2024-02-06'),(3,'2024-03-15'),\n (4,'2024-02-20'),\n (5,'2024-04-02');", "solution": "WITH c AS (\n  SELECT u.user_id, strftime('%Y-%m', u.signup_date) AS cohort_month,\n         (CAST(strftime('%Y', a.activity_date) AS INTEGER)*12 + CAST(strftime('%m', a.activity_date) AS INTEGER))\n       - (CAST(strftime('%Y', u.signup_date)   AS INTEGER)*12 + CAST(strftime('%m', u.signup_date)   AS INTEGER)) AS month_number\n  FROM users u JOIN activity a ON a.user_id = u.user_id\n)\nSELECT cohort_month, month_number, COUNT(DISTINCT user_id) AS active_users\nFROM c WHERE month_number BETWEEN 0 AND 2\n
