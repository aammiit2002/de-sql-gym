  // worked example: input tables -> expected output -> why
  try{
    const edb=freshDb(q.setup);
    const et=runSql(edb,"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name");
    let ex='<div class="example"><div class="exhead">Example</div>';
    (et.values||[]).forEach(([t])=>{
      const dat=runSql(edb,`SELECT * FROM ${t}`);
      ex+=`<div class="exblk"><div class="exlbl">Input · <b>${esc(t)}</b></div>${tableHtml(dat.columns,dat.values,12)}</div>`;
    });
    const eo=runSql(edb,q.solution);
    ex+=`<div class="exblk"><div class="exlbl out">Expected output${q.ordered?' <span style="color:var(--dim2);font-weight:400">(this exact row order)</span>':''}</div>${tableHtml(eo.columns,eo.values,12)}</div>`;
    if(q.walkthrough) ex+=`<div class="exwhy"><b>Why:</b> ${md(q.walkthrough).replace(/^<p>|<\/p>$/g,'')}</div>`;
    ex+='</div>';
    h+=ex;
    edb.close();
  }catch(e){}

  q.hints.forEach((hint,i)=>{
    h+=`<details class="hint"><summary>Hint ${i+1}</summary><div class="body">${md(hint)}</div></details>`;
  });
  h+=`<details class="hint sol"><summary>Reference solution &amp; why this gets asked</summary><div class="body">
      <pre>${esc(q.solution)}</pre><p style="margin-top:11px">${md(q.explanation)}</p></div></details>`;
  $('#pane-desc').innerHTML=h;

  // schema
  try{
    const db=freshDb(q.setup);
    const tabs=runSql(db,"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name");
    let sh='<div class="schema" style="border:none;padding:0;margin:0">';
    (tabs.values||[]).forEach(([t])=>{
      const cols=runSql(db,`PRAGMA table_info(${t})`);
      const colNames=cols.values.map(c=>`${c[1]} ${c[2]}`).join(', ');
      const data=runSql(db,`SELECT * FROM ${t}`);
      sh+=`<div class="stbl"><div class="stname">${esc(t)} (${esc(colNames)})</div>${tableHtml(data.columns,data.values,50)}</div>`;
    });
    sh+='</div>';
    $('#pane-schema').innerHTML=sh;
    db.close();
  }catch(e){ $('#pane-schema').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'; }

  // editor + notes
  setCode(r.code || `-- ${q.title}\n\n`);
  $('#notes').value = r.notes||'';
  $('#verdict').textContent = r.status==='solved'?'Solved':'Ready';
  $('#verdict').className = 'verdict '+(r.status==='solved'?'ok':'n');
  $('#vsub').textContent='';
  $('#attempts').textContent = r.attempts? `${r.attempts} attempt${r.attempts>1?'s':''}`:'';
  $('#outbody').innerHTML='<div style="color:var(--dim2);font-size:12.5px">Run your query to see results. Submit checks it against the expected output.</div>';
  renderList();
}

function setCode(v){ if(cm) cm.setValue(v); else $('#fallback').value=v; }
function getCode(){ return cm ? cm.getValue() : $('#fallback').value; }

function showPane(p){
  ['desc','schema','notes'].forEach(x=>$('#pane-'+x).classList.toggle('hide',x!==p));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===p));
}

/* ============ run / submit ============ */
function execUser(){
  const sql=getCode().trim();
  if(!sql) return {error:'Write a query first.'};
  let db;
  try{ db=freshDb(current.setup); }catch(e){ return {error:'Schema setup failed: '+e.message}; }
  try{ const r=runSql(db,sql); db.close(); return {res:r}; }
  catch(e){ db.close(); return {error:e.message}; }
}
function doRun(){
  if(!current) return;
  const r=rec(current.id); r.code=getCode(); saveProgress();
  const out=execUser();
  if(out.error){
    $('#verdict').textContent='SQL error'; $('#verdict').className='verdict err'; $('#vsub').textContent='';
    $('#outbody').innerHTML=`<div class="msg err">${esc(out.error)}</div>`;
    return;
  }
  $('#verdict').textContent='Executed'; $('#verdict').className='verdict n';
  $('#vsub').textContent=`${out.res.values.length} row(s)`;
  $('#outbody').innerHTML=tableHtml(out.res.columns,out.res.values);
}
function doSubmit(){
  if(!current) return;
  const q=current, r=rec(q.id);
  r.code=getCode(); r.attempts=(r.attempts||0)+1;
  const out=execUser();
  if(out.error){
    if(r.status!=='solved') r.status='attempted';
    saveProgress(); renderList();
    $('#verdict').textContent='SQL error'; $('#verdict').className='verdict err'; $('#vsub').textContent='';
    $('#attempts').textContent=`${r.attempts} attempts`;
    $('#outbody').innerHTML=`<div class="msg err">${esc(out.error)}</div>`;
    return;
  }
  let exp;
  try{ const db=freshDb(q.setup); exp=runSql(db,q.solution); db.close(); }
  catch(e){ $('#outbody').innerHTML='<div class="msg err">Reference solution failed: '+esc(e.message)+'</div>'; return; }

  const v=compare(out.res, exp, q.ordered);
  $('#attempts').textContent=`${r.attempts} attempt${r.attempts>1?'s':''}`;
  if(v.ok){
    const first = r.status!=='solved';
    r.status='solved'; r.solvedAt=new Date().toISOString();
    saveProgress(); renderList();
    $('#verdict').textContent='Accepted'; $('#verdict').className='verdict ok';
    $('#vsub').textContent=`${out.res.values.length} row(s) matched`;
    $('#outbody').innerHTML=`<div class="msg ok">Accepted${first?' — first solve.':'.'} ${q.ordered?'Row order matched too.':''}
Now open the reference solution and read the "why this gets asked" note — the follow-up questions are where interviews are actually won.</div>
      <div style="margin-top:12px">${tableHtml(out.res.columns,out.res.values)}</div>`;
  }else{
    r.status = r.status==='solved' ? 'solved' : 'attempted';
    saveProgress(); renderList();
    $('#verdict').textContent='Wrong answer'; $('#verdict').className='verdict err';
    $('#vsub').textContent='';
    $('#outbody').innerHTML=`<div class="msg err">${esc(v.reason)}</div>
      <div class="side2" style="margin-top:14px">
        <div><h4>Your output</h4>${tableHtml(out.res.columns,out.res.values,30)}</div>
        <div><h4>Expected output</h4>${tableHtml(exp.columns,exp.values,30)}</div>
      </div>`;
  }
}

/* ============ stats ============ */
function showStats(){
  $('#left').style.display='none'; $('#right').style.display='none';
  const p=$('#pane-stats'); p.classList.remove('hide'); p.style.display='block';
  const solved=QUESTIONS.filter(q=>rec(q.id).status==='solved');
  const att=QUESTIONS.filter(q=>rec(q.id).status==='attempted');
  const byDiff={}, byTopic={};
  QUESTIONS.forEach(q=>{
    byDiff[q.difficulty]=byDiff[q.difficulty]||{t:0,s:0}; byDiff[q.difficulty].t++;
    if(rec(q.id).status==='solved') byDiff[q.difficulty].s++;
    q.topics.forEach(t=>{ byTopic[t]=byTopic[t]||{t:0,s:0}; byTopic[t].t++; if(rec(q.id).status==='solved') byTopic[t].s++; });
  });
  const totalAtt=QUESTIONS.reduce((a,q)=>a+(rec(q.id).attempts||0),0);
  let h=`<h1 class="ptitle">Progress</h1>
  <div class="cards">
    <div class="card"><b style="color:var(--ok)">${solved.length}</b><small>Solved</small></div>
    <div class="card"><b style="color:var(--med)">${att.length}</b><small>In progress</small></div>
    <div class="card"><b>${QUESTIONS.length-solved.length-att.length}</b><small>Untouched</small></div>
    <div class="card"><b>${totalAtt}</b><small>Submissions</small></div>
  </div>
  <h4 style="font-size:11px;letter-spacing:.8px;color:var(--dim2);text-transform:uppercase;margin:0 0 10px">By difficulty</h4>`;
  ['Easy','Medium','Hard'].forEach(k=>{ const d=byDiff[k]||{t:0,s:0};
    h+=`<div class="trow"><div class="nm">${k}</div><div class="tb"><i style="width:${d.t?100*d.s/d.t:0}%"></i></div><div class="ct">${d.s}/${d.t}</div></div>`;});
  h+=`<h4 style="font-size:11px;letter-spacing:.8px;color:var(--dim2);text-transform:uppercase;margin:24px 0 10px">By topic — your weak spots first</h4>`;
  Object.entries(byTopic).sort((a,b)=>(a[1].s/a[1].t)-(b[1].s/b[1].t)).forEach(([k,d])=>{
    h+=`<div class="trow"><div class="nm">${esc(k)}</div><div class="tb"><i style="width:${100*d.s/d.t}%"></i></div><div class="ct">${d.s}/${d.t}</div></div>`;});
  h+=`<div style="margin-top:28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn ghost" id="btnClear">Reset all progress</button>
      <button class="btn ghost" id="btnExport">Export backup (.json)</button>
      <button class="btn ghost" id="btnImport">Import backup</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
      ${usingServer?'<span style="color:var(--ok);font-size:11.5px">Saved to progress.json on disk — persists across every browser.</span>'
        :memFallback?'<span style="color:var(--err);font-size:11.5px">localStorage unavailable — progress will NOT be saved between visits. Export a backup before closing.</span>'
        :'<span style="color:var(--dim2);font-size:11.5px">Saved to this browser only (opened as a local file). Run Start SQL Gym.bat for storage that persists across browsers, or export a backup occasionally.</span>'}</div>`;
  p.innerHTML=h;
  $('#btnClear').onclick=()=>{
    if(!confirm('Erase all progress, code and notes?')) return;
    PROG={};
    if(usingServer){ saveProgress(); } else { try{ localStorage.removeItem(SKEY); }catch(e){} }
    renderList(); showStats();
  };
  $('#btnExport').onclick=()=>{
    const blob=new Blob([JSON.stringify(PROG,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='de-sql-gym-progress.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('#btnImport').onclick=()=>$('#fileImport').click();
  $('#fileImport').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        PROG={...PROG, ...data};
        saveProgress(); renderList(); showStats();
        alert('Progress imported.');
      }catch(err){ alert('That file is not a valid backup.'); }
    };
    reader.readAsText(file);
    e.target.value='';
  };
}

/* ============ init ============ */
function initUI(){
  const topics=[...new Set(QUESTIONS.flatMap(q=>q.topics))].sort();
  $('#ftopic').innerHTML='<option value="">All topics</option>'+topics.map(t=>`<option>${t}</option>`).join('');
  const cos=[...new Set(QUESTIONS.map(q=>q.company).filter(Boolean))].sort();
  $('#fco').innerHTML='<option value="">All companies (as tagged by sources)</option>'+cos.map(c=>`<option>${c}</option>`).join('');
  ['fsearch','fdiff','fstat','ftopic','fco'].forEach(id=>$('#'+id).addEventListener('input',renderList));
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showPane(t.dataset.p));

  if(window.CodeMirror){
    $('#fallback').style.display='none';
    cm=CodeMirror($('#edwrap'),{mode:'text/x-sql',theme:'material-darker',lineNumbers:true,
      indentUnit:2,smartIndent:true,matchBrackets:true,lineWrapping:true,value:''});
    cm.setSize('100%','100%');
    cm.on('change',()=>{ if(current){ rec(current.id).code=cm.getValue(); saveProgress(); }});
    cm.setOption('extraKeys',{'Ctrl-Enter':doRun,'Cmd-Enter':doRun,'Tab':c=>c.execCommand('insertSoftTab')});
  }else{
    $('#fallback').addEventListener('input',()=>{ if(current){ rec(current.id).code=$('#fallback').value; saveProgress(); }});
  }
  $('#btnRun').onclick=doRun;
  $('#btnSubmit').onclick=doSubmit;
  $('#btnReset').onclick=()=>{ if(current) setCode(`-- ${current.title}\n\n`); };
  $('#btnStats').onclick=showStats;
  $('#btnRandom').onclick=()=>{
    const pool=QUESTIONS.filter(q=>rec(q.id).status!=='solved');
    if(!pool.length){ alert('Every problem is solved. Go get the offer.'); return; }
    open(pool[Math.floor(Math.random()*pool.length)].id);
  };
  $('#notes').addEventListener('input',()=>{ if(current){ rec(current.id).notes=$('#notes').value; saveProgress(); }});
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); doRun(); }
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='Enter'){ e.preventDefault(); doSubmit(); }
  });
  renderList();
  const firstUnsolved = QUESTIONS.find(q=>rec(q.id).status!=='solved') || QUESTIONS[0];
  open(firstUnsolved.id);
}
boot();
</script>
