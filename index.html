GROUP BY cohort_month, month_number\nORDER BY cohort_month, month_number;", "ordered": true, "hints": ["Month difference = (y1*12 + m1) - (y2*12 + m2). Never subtract raw dates and divide by 30.", "COUNT(DISTINCT user_id) — a user active twice in a month counts once."], "explanation": "Retention is the most common analytics-flavoured DE question. The month-arithmetic trick (year*12 + month) is portable everywhere and avoids the 30-day approximation bug. Follow-up: to show retention *percentages* you divide by the cohort size, which needs a separate cohort-size CTE joined back on cohort_month.", "walkthrough": "The January cohort is users 1 and 2. Both were active in month 0, one in month 1, both in month 2. The February cohort is users 3, 4, 5 — three active in month 0, one in month 1, and user 5's April activity is month 2.", "company": null, "seen": "Core DE pattern"}, {"id": "q37", "title": "Data Quality Scorecard", "difficulty": "Medium", "pattern": "Profiling", "topics": ["Data Quality", "Aggregation"], "prompt": "Profile the landing table `customer_raw` in a single row:\n- `total_rows`\n- `null_email_pct` — percentage of rows with a NULL or empty email, rounded to 2 decimals\n- `dup_ids` — how many `customer_id` values appear more than once\n- `distinct_countries`\n- `max_signup_date`\n\n**Output columns:** `total_rows`, `null_email_pct`, `dup_ids`, `distinct_countries`, `max_signup_date`", "setup": "CREATE TABLE customer_raw (customer_id INTEGER, email TEXT, signup_date TEXT, country TEXT);\nINSERT INTO customer_raw VALUES\n (1,'a@x.com','2024-03-01','IN'),(2,NULL,'2024-03-02','IN'),(3,'','2024-03-02','US'),\n (4,'d@x.com','2024-03-05','US'),(2,'b@x.com','2024-03-06','UK'),\n (5,'e@x.com','2024-03-07',NULL),(4,'d@x.com','2024-03-08','US');", "solution": "SELECT (SELECT COUNT(*) FROM customer_raw) AS total_rows,\n       (SELECT ROUND(100.0*SUM(CASE WHEN email IS NULL OR email='' THEN 1 ELSE 0 END)/COUNT(*),2) FROM customer_raw) AS null_email_pct,\n       (SELECT COUNT(*) FROM (SELECT customer_id FROM customer_raw GROUP BY customer_id HAVING COUNT(*)>1)) AS dup_ids,\n       (SELECT COUNT(DISTINCT country) FROM customer_raw) AS distinct_countries,\n       (SELECT MAX(signup_date) FROM customer_raw) AS max_signup_date;", "ordered": false, "hints": ["Each metric can be its own scalar subquery, or you can do it in one pass with conditional aggregates.", "COUNT(DISTINCT country) ignores NULL — that is usually what you want for a cardinality profile."], "explanation": "Every mature pipeline runs something like this before publishing (Great Expectations, dbt tests, Databricks DQX all generate exactly these queries). Freshness — `max_signup_date` against now — is the check that catches a silently stopped pipeline, which is the most dangerous failure mode because nothing errors.", "walkthrough": "Seven rows. Two have a NULL or empty email = 28.57%. customer_ids 2 and 4 each appear twice, so dup_ids is 2. Countries IN, US, UK are 3 distinct (the NULL is not counted).", "company": null, "seen": "Core DE pattern"}, {"id": "q38", "title": "Late-Arriving Dimension (Unknown Key)", "difficulty": "Medium", "pattern": "Surrogate key lookup", "topics": ["Modeling", "Joins"], "prompt": "Map each fact row to its dimension surrogate key. When the business key has no matching dimension row (late-arriving dimension), assign `-1` instead of dropping the fact.\n\n**Output columns:** `sale_id`, `customer_key`, `amount`\n**Order by:** `sale_id`", "setup": "CREATE TABLE dim_customer (customer_key INTEGER, customer_id TEXT);\nINSERT INTO dim_customer VALUES (101,'C001'),(102,'C002'),(103,'C003');\nCREATE TABLE stg_sales (sale_id INTEGER, customer_id TEXT, amount REAL);\nINSERT INTO stg_sales VALUES\n (1,'C001',100.0),(2,'C009',250.0),(3,'C002',75.0),\n (4,NULL,40.0),(5,'C003',10.0),(6,'C009',60.0);", "solution": "SELECT s.sale_id, COALESCE(d.customer_key, -1) AS customer_key, s.amount\nFROM stg_sales s\nLEFT JOIN dim_customer d ON d.customer_id = s.customer_id\nORDER BY s.sale_id;", "ordered": true, "hints": ["LEFT JOIN keeps unmatched facts; COALESCE turns the NULL key into the unknown-member key.", "A NULL business key also lands on -1 — that is intended."], "explanation": "Kimball's unknown-member pattern. The point you should make unprompted: never drop fact rows for a missing dimension, because your revenue totals silently shrink. Route them to -1, alert on the count, and backfill when the dimension arrives (either by re-keying or by inferring a stub dimension row).", "walkthrough": "Sales 2 and 6 both reference C009, which is not in the dimension, so both map to -1. Sale 4 has a NULL business key and also maps to -1. No fact rows are lost.", "company": null, "seen": "Core DE pattern"}, {"id": "q39", "title": "Collapse a CDC Stream to Current State", "difficulty": "Hard", "pattern": "CDC dedup", "topics": ["CDC", "Window Functions", "Dedup"], "prompt": "`cdc_events` is a Debezium-style change feed with operations `I`, `U`, `D`. Ordering within a key is by (`ts`, `seq`).\n\nReturn the current state of the table: the latest version of every key whose latest operation is not a delete.\n\n**Output columns:** `pk`, `val`\n**Order by:** `pk`", "setup": "CREATE TABLE cdc_events (pk INTEGER, val TEXT, op TEXT, ts TEXT, seq INTEGER);\nINSERT INTO cdc_events VALUES\n (1,'a1','I','2024-03-01 10:00:00',1),\n (1,'a2','U','2024-03-01 10:00:00',2),\n (2,'b1','I','2024-03-01 10:01:00',3),\n (2,NULL,'D','2024-03-01 10:05:00',4),\n (3,'c1','I','2024-03-01 10:02:00',5),\n (3,'c2','U','2024-03-02 08:00:00',6),\n (3,'c3','U','2024-03-02 07:00:00',7),\n (4,'d1','I','2024-03-03 09:00:00',8);", "solution": "WITH r AS (\n  SELECT pk, val, op, ROW_NUMBER() OVER (PARTITION BY pk ORDER BY ts DESC, seq DESC) AS rn\n  FROM cdc_events\n)\nSELECT pk, val FROM r WHERE rn=1 AND op <> 'D' ORDER BY pk;", "ordered": true, "hints": ["Order by the full ordering key (ts then seq) — pk 1 has two events sharing a timestamp.", "Filter the delete *after* picking the latest row, not before."], "explanation": "This is what Delta Lake's `MERGE ... WHEN MATCHED THEN DELETE` and Snowflake Streams do internally. Two planted traps: identical timestamps for pk 1 (you need the sequence as tie-breaker), and pk 3 where the higher `seq` has an *earlier* timestamp — you must decide and state which ordering is authoritative. Filtering deletes before ranking wrongly resurrects pk 2.", "walkthrough": "pk 1's two events share a timestamp, so the seq breaks the tie and a2 wins. pk 2's latest op is a delete, so it disappears. pk 3 is the trap — seq 7 is higher but its timestamp is earlier, so ordering by ts first gives c2.", "company": null, "seen": "Core DE pattern"}, {"id": "q40", "title": "Daily Inventory Balance From Movements", "difficulty": "Hard", "pattern": "Snapshot from deltas", "topics": ["Recursive CTE", "Window Functions", "Dates"], "prompt": "`movements` records stock changes. Produce a daily closing balance for every product for `2024-04-01` through `2024-04-05`, carrying the balance forward on days with no movement.\n\n**Output columns:** `product_id`, `d`, `closing_balance`\n**Order by:** `product_id`, `d`", "setup": "CREATE TABLE movements (product_id INTEGER, move_date TEXT, qty_delta INTEGER);\nINSERT INTO movements VALUES\n (1,'2024-04-01',100),(1,'2024-04-03',-30),(1,'2024-04-05',50),\n (2,'2024-04-02',40),(2,'2024-04-02',10),(2,'2024-04-04',-25);", "solution": "WITH RECURSIVE cal(d) AS (\n  SELECT '2024-04-01' UNION ALL SELECT date(d,'+1 day') FROM cal WHERE d < '2024-04-05'\n), prod AS (SELECT DISTINCT product_id FROM movements),\ngrid AS (SELECT p.product_id, c.d FROM prod p CROSS JOIN cal c),\ndaily AS (\n  SELECT g.product_id, g.d, COALESCE(SUM(m.qty_delta),0) AS delta\n  FROM grid g LEFT JOIN movements m ON m.product_id=g.product_id AND m.move_date=g.d\n  GROUP BY g.product_id, g.d\n)\nSELECT product_id, d,\n       SUM(delta) OVER (PARTITION BY product_id ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS closing_balance\nFROM daily ORDER BY product_id, d;", "ordered": true, "hints": ["Build a date spine, CROSS JOIN it to the product list, LEFT JOIN the movements onto that grid.", "Product 2 has two movements on the same day — aggregate to the day grain before the running sum."], "explanation": "The delta-to-snapshot conversion at the heart of inventory, account balances and subscription state. Two ideas combine: a spine grid so there are no missing days, and a cumulative window so the balance carries forward. Production alternative: a periodic snapshot fact table, which trades storage for query simplicity.", "walkthrough": "Product 1 opens at 100, holds through Apr 2, drops to 70 on Apr 3, holds, then rises to 120 on Apr 5. Product 2 has two movements on Apr 2 which must be summed to 50 before the running total.", "company": null, "seen": "Core DE pattern"}, {"id": "q41", "title": "Recursive Org Hierarchy", "difficulty": "Hard", "pattern": "Recursive CTE", "topics": ["Recursive CTE", "Joins"], "prompt": "Walk the reporting hierarchy from the root (`manager_id IS NULL`).\n\nFor each employee return their depth (root = 1) and the full path of names from the root, joined by ` > `.\n\n**Output columns:** `emp_id`, `name`, `lvl`, `path`\n**Order by:** `path`", "setup": "CREATE TABLE employees (emp_id INTEGER, name TEXT, manager_id INTEGER);\nINSERT INTO employees VALUES\n (1,'Asha',NULL),(2,'Ravi',1),(3,'Meera',1),(4,'John',2),(5,'Sara',2),(6,'Deep',3),(7,'Nita',4);", "solution": "WITH RECURSIVE h(emp_id,name,lvl,path) AS (\n  SELECT emp_id, name, 1, name FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.emp_id, e.name, h.lvl+1, h.path || ' > ' || e.name\n  FROM employees e JOIN h ON e.manager_id = h.emp_id\n)\nSELECT emp_id, name, lvl, path FROM h ORDER BY path;", "ordered": true, "hints": ["Anchor member = the roots; recursive member joins the table back to the CTE on manager_id = parent's emp_id.", "Build the path by concatenating onto the parent's path."], "explanation": "Standard for org charts, BOM explosions, category trees and lineage graphs. Interview follow-ups: how do you stop infinite recursion on a cycle (carry a visited path and check it, or cap depth), and how would you do this in Spark SQL — which historically had no recursive CTE, forcing an iterative join loop or GraphFrames.", "walkthrough": "Asha is the root at level 1. Ravi and Meera are level 2, John, Sara and Deep are level 3, and Nita is level 4 with the path 'Asha > Ravi > John > Nita'.", "seen": "prepare.sh DE track", "company": "Microsoft"}, {"id": "q42", "title": "Explode a Date Range Into Daily Rows", "difficulty": "Hard", "pattern": "Range explosion", "topics": ["Recursive CTE", "Dates"], "prompt": "Each subscription has a start and end date (both inclusive). Produce one row per active day per subscription.\n\n**Output columns:** `sub_id`, `active_date`\n**Order by:** `sub_id`, `active_date`", "setup": "CREATE TABLE subscriptions (sub_id INTEGER, start_date TEXT, end_date TEXT);\nINSERT INTO subscriptions VALUES\n (1,'2024-03-01','2024-03-04'),\n (2,'2024-03-03','2024-03-03'),\n (3,'2024-03-05','2024-03-07');", "solution": "WITH RECURSIVE ex(sub_id, active_date, end_date) AS (\n  SELECT sub_id, start_date, end_date FROM subscriptions\n  UNION ALL\n  SELECT sub_id, date(active_date,'+1 day'), end_date FROM ex WHERE active_date < end_date\n)\nSELECT sub_id, active_date FROM ex ORDER BY sub_id, active_date;", "ordered": true, "hints": ["The anchor is every subscription's start date; the recursive step adds one day while still inside the range.", "Subscription 2 is a single day — make sure it produces exactly one row, not zero."], "explanation": "Converts a range-grain table to a daily-grain fact, which is how you compute 'active subscriptions per day' without a correlated subquery per date. Dialects: generate_series (Postgres), explode(sequence(...)) (Spark/Databricks), UNNEST(GENERATE_DATE_ARRAY(...)) (BigQuery). Warn about row explosion on multi-year ranges.", "walkthrough": "Subscription 1 spans 4 days and produces 4 rows. Subscription 2 starts and ends on the same day and must produce exactly one row. Subscription 3 produces 3 rows.", "company": null, "seen": "Core DE pattern"}, {"id": "q43", "title": "Monthly Revenue Matrix (Pivot)", "difficulty": "Medium", "pattern": "Pivot", "topics": ["CASE", "Aggregation", "Dates"], "prompt": "Pivot `orders` into one row per region with a column per month for Jan, Feb and Mar 2024. Regions with no revenue in a month show `0.0`.\n\n**Output columns:** `region`, `jan`, `feb`, `mar` (each rounded to 2 decimals)\n**Order by:** `region`", "setup": "CREATE TABLE orders (order_id INTEGER, region TEXT, order_date TEXT, amount REAL);\nINSERT INTO orders VALUES\n (1,'APAC','2024-01-15',100.0),(2,'APAC','2024-02-02',250.5),(3,'APAC','2024-03-30',49.5),\n (4,'EMEA','2024-01-05',400.0),(5,'EMEA','2024-03-11',600.0),\n (6,'AMER','2024-02-20',75.25);", "solution": "SELECT region,\n  ROUND(SUM(CASE WHEN strftime('%Y-%m',order_date)='2024-01' THEN amount ELSE 0 END),2) AS jan,\n  ROUND(SUM(CASE WHEN strftime('%Y-%m',order_date)='2024-02' THEN amount ELSE 0 END),2) AS feb,\n  ROUND(SUM(CASE WHEN strftime('%Y-%m',order_date)='2024-03' THEN amount ELSE 0 END),2) AS mar\nFROM orders GROUP BY region ORDER BY region;", "ordered": true, "hints": ["ELSE 0 (not ELSE NULL) so empty months render as 0.0 rather than NULL.", "One SUM(CASE ...) per output column."], "explanation": "The follow-up is the real question: 'what if the months are dynamic?' Answer honestly — SQL result shapes are static, so you either generate the SQL from metadata (dbt macro, Python), or return long format and let the BI tool pivot. Anyone claiming a fully dynamic pure-SQL pivot is bluffing.", "walkthrough": "APAC has revenue in all three months. EMEA has January and March but nothing in February, which must render as 0.0 rather than NULL. AMER only has February.", "seen": "DWP 28-day list", "company": "Airbnb"}, {"id": "q44", "title": "Parse JSON Event Payloads", "difficulty": "Medium", "pattern": "Semi-structured data", "topics": ["JSON", "Data Quality"], "prompt": "`raw_events` stores the payload as a JSON string. Extract `user_id`, `action` and the nested `details.amount`.\n\nReturn only rows where `action` is `purchase`.\n\n**Output columns:** `event_id`, `user_id`, `action`, `amount`\n**Order by:** `event_id`", "setup": "CREATE TABLE raw_events (event_id INTEGER, payload TEXT);\nINSERT INTO raw_events VALUES\n (1,'{\"user_id\":10,\"action\":\"purchase\",\"details\":{\"amount\":250.5,\"currency\":\"INR\"}}'),\n (2,'{\"user_id\":11,\"action\":\"view\",\"details\":{\"page\":\"home\"}}'),\n (3,'{\"user_id\":12,\"action\":\"purchase\",\"details\":{\"amount\":99.0,\"currency\":\"USD\"}}'),\n (4,'{\"user_id\":13,\"action\":\"purchase\",\"details\":{\"currency\":\"EUR\"}}'),\n (5,'{\"user_id\":14,\"action\":\"add_to_cart\",\"details\":{\"amount\":10.0}}');", "solution": "SELECT event_id,\n       json_extract(payload,'$.user_id') AS user_id,\n       json_extract(payload,'$.action') AS action,\n       json_extract(payload,'$.details.amount') AS amount\nFROM raw_events\nWHERE json_extract(payload,'$.action') = 'purchase'\nORDER BY event_id;", "ordered": true, "hints": ["SQLite: json_extract(col,'$.path.to.field'). Snowflake: payload:details.amount. Databricks: payload:details.amount or get_json_object.", "Event 4 has no amount — the extract returns NULL rather than failing. That's the point."], "explanation": "Bronze layers are full of raw JSON, so this shows up in almost every Databricks/Snowflake-flavoured interview. Key talking points: missing keys yield NULL not errors, extracted values are untyped and need explicit casting, and schema evolution is why you flatten to typed columns in silver rather than querying JSON at read time forever.", "walkthrough": "Events 1, 3 and 4 are purchases. Event 4 has no `amount` key inside `details`, so the extraction yields NULL rather than throwing. Events 2 and 5 are filtered out by action.", "company": null, "seen": "Core DE pattern"}, {"id": "q45", "title": "Exactly-Once Counting From an At-Least-Once Stream", "difficulty": "Medium", "pattern": "Idempotency", "topics": ["Dedup", "Aggregation", "Streaming"], "prompt": "The consumer delivers at-least-once, so `event_id` can repeat. Deduplicate on `event_id`, then return per user the number of events and total amount.\n\n**Output columns:** `user_id`, `events`, `total_amount` (rounded to 2 decimals)\n**Order by:** `user_id`", "setup": "CREATE TABLE event_log (event_id TEXT, user_id INTEGER, event_ts TEXT, amount REAL);\nINSERT INTO event_log VALUES\n ('e1',1,'2024-03-01 10:00:00',100.0),\n ('e1',1,'2024-03-01 10:00:00',100.0),\n ('e2',1,'2024-03-01 10:05:00',50.0),\n ('e3',2,'2024-03-01 11:00:00',300.0),\n ('e3',2,'2024-03-01 11:00:00',300.0),\n ('e3',2,'2024-03-01 11:00:00',300.0),\n ('e4',2,'2024-03-02 09:00:00',20.0),\n ('e5',3,'2024-03-02 09:30:00',75.5);", "solution": "WITH d AS (\n  SELECT event_id, user_id, amount FROM (\n    SELECT event_id, user_id, amount,\n           ROW_NUMBER() OVER (PARTITION BY event_id ORDER BY event_ts) AS rn\n    FROM event_log\n  ) WHERE rn = 1\n)\nSELECT user_id, COUNT(*) AS events, ROUND(SUM(amount),2) AS total_amount\nFROM d GROUP BY user_id ORDER BY user_id;", "ordered": true, "hints": ["Dedup on the idempotency key first, then aggregate — never the other way round.", "SELECT DISTINCT event_id, user_id, amount also works here because the duplicates are byte-identical."], "explanation": "Kafka at-least-once delivery means duplicate rows are normal, not a bug. The insight: exactly-once *processing* is usually achieved by exactly-once *effects* — a stable event key plus idempotent dedup or MERGE. Ask whether duplicates are identical (DISTINCT is enough) or divergent (you need a deterministic tie-breaker).", "walkthrough": "event_id e1 arrives twice and e3 three times. After dedup, user 1 has 2 events worth 150 and user 2 has 2 events worth 320 — not 3 events and 620.", "seen": "prepare.sh DE track", "company": "Google"}, {"id": "q46", "title": "Detect Join Key Skew", "difficulty": "Medium", "pattern": "Skew profiling", "topics": ["Aggregation", "Performance", "Window Functions"], "prompt": "A Spark job is slow and you suspect skew. Return the 3 heaviest `join_key` values with their row count and share of the table.\n\n**Output columns:** `join_key`, `rows`, `pct_of_total` (rounded to 2 decimals)\n**Order by:** `rows` descending, then `join_key`", "setup": "CREATE TABLE fact_events (event_id INTEGER, join_key TEXT);\nINSERT INTO fact_events VALUES\n (1,'UNKNOWN'),(2,'UNKNOWN'),(3,'UNKNOWN'),(4,'UNKNOWN'),(5,'UNKNOWN'),(6,'UNKNOWN'),\n (7,'C001'),(8,'C001'),(9,'C001'),\n (10,'C002'),(11,'C002'),\n (12,'C003'),(13,'C004'),(14,'C005'),(15,'C006');", "solution": "SELECT join_key, COUNT(*) AS rows,\n       ROUND(100.0*COUNT(*)/SUM(COUNT(*)) OVER (),2) AS pct_of_total\nFROM fact_events GROUP BY join_key\nORDER BY rows DESC, join_key LIMIT 3;", "ordered": true, "hints": ["Group by the key, count, and use SUM(COUNT(*)) OVER () for the denominator.", "The sentinel value dominating the table is the classic skew culprit."], "explanation": "A rare SQL question that is really a performance question. The 'UNKNOWN'/NULL sentinel eating 40% of rows sends every one of those rows to a single Spark partition. Volunteer the fixes: filter or handle sentinels separately, salt the key, broadcast the small side, or enable AQE skew join handling in Databricks.", "walkthrough": "'UNKNOWN' holds 6 of the 15 rows, 40% of the table, while every real customer key holds 3 or fewer. That single sentinel value is the skew.", "seen": "prepare.sh DE track", "company": "Okta"}, {"id": "q47", "title": "Point-in-Time Join to an SCD2 Dimension", "difficulty": "Hard", "pattern": "As-of join", "topics": ["SCD", "Joins", "Modeling"], "prompt": "Attach the customer's segment **as it was on the order date** by joining each fact row to the SCD2 dimension version whose validity range contains `order_date`.\n\nIf no version covers the date, return `'UNKNOWN'`.\n\n**Output columns:** `order_id`, `customer_id`, `order_date`, `segment`\n**Order by:** `order_id`", "setup": "CREATE TABLE dim_customer_scd (customer_id INTEGER, segment TEXT, effective_from TEXT, effective_to TEXT);\nINSERT INTO dim_customer_scd VALUES\n (1,'bronze','2023-01-01','2023-12-31'),\n (1,'silver','2024-01-01','2024-06-30'),\n (1,'gold','2024-07-01','9999-12-31'),\n (2,'bronze','2024-03-01','9999-12-31');\nCREATE TABLE fact_orders (order_id INTEGER, customer_id INTEGER, order_date TEXT);\nINSERT INTO fact_orders VALUES\n (1,1,'2023-06-15'),(2,1,'2024-02-20'),(3,1,'2024-08-05'),\n (4,2,'2024-01-15'),(5,2,'2024-04-01');", "solution": "SELECT f.order_id, f.customer_id, f.order_date,\n       COALESCE(d.segment,'UNKNOWN') AS segment\nFROM fact_orders f\nLEFT JOIN dim_customer_scd d\n  ON d.customer_id = f.customer_id\n AND f.order_date BETWEEN d.effective_from AND d.effective_to\nORDER BY f.order_id;", "ordered": true, "hints": ["The join condition is a range containment, not an equality — that is what makes it an as-of join.", "Order 4 predates customer 2's first dimension version, so it must fall through to UNKNOWN."], "explanation": "The payoff for building SCD2 in the first place — this is why history exists. Two things to say: (1) if the ranges overlap you get duplicate fact rows, which is why validating the dimension matters; (2) range joins are expensive — Databricks needs a RANGE_JOIN hint, and warehouses often materialise the resolved surrogate key into the fact at load time instead.", "walkthrough": "Customer 1's June 2023 order resolves to bronze, the February 2024 order to silver, and the August 2024 order to gold. Customer 2's January order predates their first dimension row entirely, so it falls back to UNKNOWN.", "seen": "prepare.sh DE track", "company": "Microsoft"}, {"id": "q48", "title": "Find Missing Load Partitions", "difficulty": "Medium", "pattern": "Gap detection", "topics": ["Recursive CTE", "Data Quality", "Dates"], "prompt": "The daily pipeline should write one partition per day. Find the dates between the earliest and latest recorded load that have no successful load.\n\nA date counts as loaded only if it has a row with `status = 'success'`.\n\n**Output columns:** `missing_date`\n**Order by:** `missing_date`", "setup": "CREATE TABLE load_audit (load_date TEXT, status TEXT);\nINSERT INTO load_audit VALUES\n ('2024-03-01','success'),('2024-03-02','success'),('2024-03-04','success'),\n ('2024-03-05','failed'),('2024-03-07','success'),('2024-03-08','success');", "solution": "WITH RECURSIVE b AS (SELECT MIN(load_date) AS lo, MAX(load_date) AS hi FROM load_audit),\ncal(d) AS (\n  SELECT lo FROM b\n  UNION ALL\n  SELECT date(d,'+1 day') FROM cal WHERE d < (SELECT hi FROM b)\n)\nSELECT d AS missing_date FROM cal\nWHERE NOT EXISTS (SELECT 1 FROM load_audit a WHERE a.load_date = cal.d AND a.status='success')\nORDER BY d;", "ordered": true, "hints": ["Generate the full calendar between min and max, then anti-join against successful loads.", "2024-03-05 exists in the audit table but failed — it must still be reported as missing."], "explanation": "The check that catches the worst failure mode in data engineering: a pipeline that stops without erroring. Note the distinction between 'no row' (03-03, 03-06) and 'row with a failure' (03-05) — both are gaps in the data even though only one looks like an outage. Same shape applies to missing sequence numbers and missing Kafka offsets.", "walkthrough": "The audit spans 2024-03-01 to 2024-03-08. 03-03 and 03-06 have no rows at all, and 03-05 has a row but it failed — all three count as missing.", "company": null, "seen": "Core DE pattern"}, {"id": "q49", "title": "Average Salary per Department", "difficulty": "Easy", "pattern": "Group & aggregate", "topics": ["Aggregation"], "company": "Google", "prompt": "Return the average salary for each department, rounded to 2 decimals, plus the headcount.\n\n**Output columns:** `dept`, `headcount`, `avg_salary`\n**Order by:** `dept`", "setup": "CREATE TABLE employees (emp_id INTEGER, name TEXT, dept TEXT, salary REAL);\nINSERT INTO employees VALUES (1,'Asha','ENG',120000),(2,'Ravi','ENG',95000),(3,'Meera','DATA',110000),\n(4,'John','DATA',80000),(5,'Sara','DATA',90000),(6,'Deep','HR',60000);", "solution": "SELECT dept, COUNT(*) AS headcount, ROUND(AVG(salary),2) AS avg_salary\nFROM employees GROUP BY dept ORDER BY dept;", "ordered": true, "hints": ["One row per department means GROUP BY dept.", "AVG ignores NULL salaries — mention that if any exist."], "walkthrough": ["Group the rows by `dept` so each department collapses to one row.", "`COUNT(*)` counts rows in the group; `AVG(salary)` averages the salary column within it.", "`ROUND(...,2)` formats the output."], "explanation": "The universal opener. The only way to get this wrong is forgetting that AVG skips NULLs, so a department with 3 employees and 1 NULL salary divides by 2, not 3. If you want NULL treated as zero you must COALESCE first.", "seen": "Core DE pattern"}, {"id": "q50", "title": "Count Distinct Signups", "difficulty": "Easy", "pattern": "Distinct count", "topics": ["Aggregation"], "company": "Meta", "prompt": "The signup log has duplicate rows from retries. Return the number of **unique** users who signed up, and the total number of log rows.\n\n**Output columns:** `unique_users`, `total_rows`", "setup": "CREATE TABLE signup_log (user_id INTEGER, signup_ts TEXT);\nINSERT INTO signup_log VALUES (1,'2024-03-01'),(2,'2024-03-01'),(1,'2024-03-01'),(3,'2024-03-02'),(2,'2024-03-02'),(4,'2024-03-03'),(1,'2024-03-04');", "solution": "SELECT COUNT(DISTINCT user_id) AS unique_users, COUNT(*) AS total_rows FROM signup_log;", "ordered": false, "hints": ["COUNT(DISTINCT col) vs COUNT(*) is the whole question.", "The gap between the two numbers is your duplicate rate."], "walkthrough": ["`COUNT(DISTINCT user_id)` deduplicates before counting.", "`COUNT(*)` counts every row including duplicates.", "Both are aggregates with no GROUP BY, so the result is a single row."], "explanation": "Trivial syntax, real point: COUNT(DISTINCT) is expensive at scale because it must hold every distinct value in memory or shuffle it. At billions of rows this is where HyperLogLog (APPROX_COUNT_DISTINCT) earns its keep.", "seen": "Core DE pattern"}, {"id": "q51", "title": "Top 3 Products by Sales", "difficulty": "Easy", "pattern": "Order & limit", "topics": ["Aggregation", "Ranking"], "company": "NVIDIA", "prompt": "Return the top 3 products by total sales amount.\n\n**Output columns:** `product`, `total_sales`\n**Order by:** `total_sales` descending, then `product`", "setup": "CREATE TABLE sales (sale_id INTEGER, product TEXT, amount REAL);\nINSERT INTO sales VALUES (1,'gpu',5000),(2,'gpu',3000),(3,'cpu',4000),(4,'ram',1500),(5,'ram',1200),(6,'ssd',900),(7,'cpu',500);", "solution": "SELECT product, SUM(amount) AS total_sales FROM sales GROUP BY product ORDER BY total_sales DESC, product LIMIT 3;", "ordered": true, "hints": ["Aggregate first, then order, then limit.", "Add a tie-breaker to ORDER BY so the result is deterministic."], "walkthrough": ["`GROUP BY product` with `SUM(amount)` gives total sales per product.", "`ORDER BY total_sales DESC` ranks them highest first.", "`LIMIT 3` keeps the top three; the `product` tie-breaker makes reruns stable."], "explanation": "The interviewer's follow-up is always 'now do top 3 per category' — which is the window-function version. Also note LIMIT/TOP/FETCH FIRST differ by dialect: LIMIT (Postgres/MySQL/SQLite), TOP (SQL Server), FETCH FIRST n ROWS ONLY (Oracle/ANSI).", "seen": "Core DE pattern"}, {"id": "q52", "title": "Active Users in the Last 30 Days", "difficulty": "Easy", "pattern": "Relative date filter", "topics": ["Dates", "Aggregation"], "company": "Amazon", "prompt": "Relative to the latest activity date in the table, return users active within the last 30 days (inclusive of that 30-day window), with their activity count.\n\n**Output columns:** `user_id`, `activity_count`\n**Order by:** `user_id`", "setup": "CREATE TABLE activity (user_id INTEGER, activity_date TEXT);\nINSERT INTO activity VALUES (1,'2024-03-30'),(1,'2024-03-15'),(2,'2024-02-01'),(3,'2024-03-28'),(3,'2024-03-29'),(4,'2024-01-05'),(5,'2024-03-02');", "solution": "SELECT user_id, COUNT(*) AS activity_count\nFROM activity\nWHERE activity_date >= date((SELECT MAX(activity_date) FROM activity),'-30 day')\nGROUP BY user_id ORDER BY user_id;", "ordered": true, "hints": ["Anchor to MAX(activity_date) rather than 'today' so the query is reproducible.", "SQLite: date(x,'-30 day'). Postgres: x - INTERVAL '30 days'."], "walkthrough": ["A scalar subquery finds the most recent date in the table.", "`date(...,'-30 day')` shifts that back 30 days to form the window start.", "Filter to rows on or after that boundary, then count per user."], "explanation": "Real pipelines anchor on a data-driven watermark, not CURRENT_DATE, so backfills and reruns produce identical results. Anchoring on NOW() makes your test suite fail tomorrow — say that out loud.", "seen": "Core DE pattern"}, {"id": "q53", "title": "Products With Low Stock", "difficulty": "Easy", "pattern": "Filter", "topics": ["Filtering"], "company": "Microsoft", "prompt": "Return products with stock strictly below 10 units, including products whose stock is NULL (treat NULL as 0).\n\n**Output columns:** `product_id`, `product_name`, `stock`\n**Order by:** `product_id`", "setup": "CREATE TABLE inventory (product_id INTEGER, product_name TEXT, stock INTEGER);\nINSERT INTO inventory VALUES (1,'widget',5),(2,'gadget',50),(3,'doohickey',NULL),(4,'thingamajig',9),(5,'gizmo',10),(6,'sprocket',0);", "solution": "SELECT product_id, product_name, stock FROM inventory WHERE COALESCE(stock,0) < 10 ORDER BY product_id;", "ordered": true, "hints": ["`stock < 10` alone silently drops the NULL row — NULL comparisons are UNKNOWN, not true.", "COALESCE before comparing, or add `OR stock IS NULL`."], "walkthrough": ["`COALESCE(stock,0)` converts the NULL into a comparable 0.", "The comparison then evaluates to TRUE for that row and it survives the filter.", "Note that stock = 10 is excluded because the bound is strict."], "explanation": "Looks like a beginner filter; it's actually a NULL test. A restocking alert that silently skips products with unknown stock is exactly the kind of bug that reaches production, because nothing errors.", "seen": "Core DE pattern"}, {"id": "q54", "title": "Highly Rated Products", "difficulty": "Easy", "pattern": "Aggregate + HAVING", "topics": ["Aggregation"], "company": "Walmart", "prompt": "Return products whose **average** rating is above 4.5 and that have at least 2 ratings.\n\n**Output columns:** `product`, `rating_count`, `avg_rating` (rounded to 2 decimals)\n**Order by:** `avg_rating` descending, then `product`", "setup": "CREATE TABLE reviews (review_id INTEGER, product TEXT, rating REAL);\nINSERT INTO reviews VALUES (1,'tv',5),(2,'tv',4.8),(3,'phone',4.2),(4,'phone',4.4),(5,'laptop',5),(6,'tablet',4.9),(7,'tablet',4.9),(8,'tablet',5);", "solution": "SELECT product, COUNT(*) AS rating_count, ROUND(AVG(rating),2) AS avg_rating\nFROM reviews GROUP BY product HAVING COUNT(*) >= 2 AND AVG(rating) > 4.5\nORDER BY avg_rating DESC, product;", "ordered": true, "hints": ["The minimum-count condition is what stops a single 5-star review from topping the list.", "Both conditions belong in HAVING because both are aggregates."], "walkthrough": ["Group reviews by product.", "`HAVING` filters groups after aggregation — one clause for the count floor, one for the rating bar.", "`laptop` has a perfect 5.0 but only one review, so it is excluded."], "explanation": "The planted trap is the single 5-star product. Any ranking by average without a volume threshold is statistically meaningless — good interviewers want you to raise that unprompted, and the mature answer is a Bayesian/shrinkage average toward the global mean.", "seen": "Core DE pattern"}, {"id": "q55", "title": "Monthly Revenue Trend", "difficulty": "Easy", "pattern": "Time series rollup", "topics": ["Dates", "Aggregation"], "company": "Apple", "prompt": "Return total revenue per month for the year 2024 only.\n\n**Output columns:** `month` (`YYYY-MM`), `revenue` (rounded to 2 decimals), `order_count`\n**Order by:** `month`", "setup": "CREATE TABLE orders (order_id INTEGER, order_date TEXT, amount REAL);\nINSERT INTO orders VALUES (1,'2023-12-30',500),(2,'2024-01-05',100.5),(3,'2024-01-25',200),(4,'2024-02-10',300),(5,'2024-04-01',450.25),(6,'2024-04-20',49.75),(7,'2025-01-01',999);", "solution": "SELECT strftime('%Y-%m',order_date) AS month, ROUND(SUM(amount),2) AS revenue, COUNT(*) AS order_count\nFROM orders WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'\nGROUP BY month ORDER BY month;", "ordered": true, "hints": ["Filter with a half-open range rather than strftime on the year — it stays index-friendly.", "March has no orders and simply won't appear; that's correct here."], "walkthrough": ["The WHERE clause restricts to calendar 2024 using a range on the raw column.", "`strftime('%Y-%m', ...)` truncates each date to its month.", "Group by that truncated value and sum."], "explanation": "Note why the filter is `order_date >= '2024-01-01' AND < '2025-01-01'` rather than `WHERE strftime('%Y',order_date)='2024'`. Wrapping the column in a function makes the predicate non-SARGable — the optimizer can no longer use an index on order_date and falls back to a full scan. That single point is often the whole reason this question is asked.", "seen": "Core DE pattern"}, {"id": "q56", "title": "Repeat Customers", "difficulty": "Easy", "pattern": "HAVING on count", "topics": ["Aggregation"], "company": "American Express", "prompt": "Return customers who placed more than one order, with their order count and total spend.\n\n**Output columns:** `customer_id`, `orders`, `total_spend` (rounded to 2 decimals)\n**Order by:** `orders` descending, then `customer_id`", "setup": "CREATE TABLE orders (order_id INTEGER, customer_id INTEGER, amount REAL);\nINSERT INTO orders VALUES (1,1,100),(2,1,150),(3,2,200),(4,3,50),(5,3,75),(6,3,25),(7,4,500);", "solution": "SELECT customer_id, COUNT(*) AS orders, ROUND(SUM(amount),2) AS total_spend\nFROM orders GROUP BY customer_id HAVING COUNT(*) > 1\nORDER BY orders DESC, customer_id;", "ordered": true, "hints": ["Group by customer, filter groups with HAVING.", "If order_id could repeat you'd need COUNT(DISTINCT order_id)."], "walkthrough": ["Group the orders per customer.", "`HAVING COUNT(*) > 1` keeps only customers with repeat purchases.", "Sum the amounts within each surviving group."], "explanation": "Retention metrics start here. The follow-up worth pre-empting: 'repeat' usually means orders on *different days*, so COUNT(DISTINCT order_date) is often the metric the business actually wants — clarify the definition before writing.", "seen": "Core DE pattern"}, {"id": "q57", "title": "Highest Paid Employee per Department", "difficulty": "Medium", "pattern": "Top-1 per group", "topics": ["Window Functions", "Ranking"], "company": "Tesla", "prompt": "Return the highest-paid employee in each department. If there is a tie, return all tied employees.\n\n**Output columns:** `dept`, `name`, `salary`\n**Order by:** `dept`, `name`", "setup": "CREATE TABLE employees (emp_id INTEGER, name TEXT, dept TEXT, salary REAL);\nINSERT INTO employees VALUES (1,'Asha','ENG',120000),(2,'Ravi','ENG',120000),(3,'Meera','ENG',95000),\n(4,'John','DATA',110000),(5,'Sara','DATA',80000),(6,'Deep','HR',60000);", "solution": "WITH r AS (SELECT dept,name,salary, RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rk FROM employees)\nSELECT dept,name,salary FROM r WHERE rk=1 ORDER BY dept,name;", "ordered": true, "hints": ["'Return all tied employees' rules out ROW_NUMBER.", "A correlated subquery `salary = (SELECT MAX(salary) ... WHERE dept = e.dept)` also works and keeps ties."], "walkthrough": ["`RANK()` partitioned by dept assigns 1 to every employee tied at the top salary.", "Filter `rk = 1` in an outer query — window functions can't go in WHERE.", "ENG has two people at 120000, so both survive."], "explanation": "Ties are the entire test. RANK keeps them, ROW_NUMBER arbitrarily discards one. Always ask 'what should happen on a tie?' before writing — that question alone signals seniority.", "seen": "Core DE pattern"}, {"id": "q58", "title": "Employees Not Assigned to Any Department", "difficulty": "Easy", "pattern": "Anti-join", "topics": ["Joins", "NULL Handling"], "company": "IBM", "prompt": "Return employees who have no department: either their `dept_id` is NULL, or it points to a department that does not exist.\n\n**Output columns:** `emp_id`, `name`\n**Order by:** `emp_id`", "setup": "CREATE TABLE departments (dept_id INTEGER, dept_name TEXT);\nINSERT INTO departments VALUES (10,'ENG'),(20,'DATA');\nCREATE TABLE employees (emp_id INTEGER, name TEXT, dept_id INTEGER);\nINSERT INTO employees VALUES (1,'Asha',10),(2,'Ravi',NULL),(3,'Meera',99),(4,'John',20),(5,'Sara',NULL);", "solution": "SELECT e.emp_id, e.name FROM employees e\nLEFT JOIN departments d ON d.dept_id = e.dept_id\nWHERE d.dept_id IS NULL ORDER BY e.emp_id;", "ordered": true, "hints": ["A LEFT JOIN plus `WHERE right_key IS NULL` catches both the NULL FK and the orphan FK in one pass.", "Meera's dept 99 doesn't exist — she counts as unassigned."], "walkthrough": ["LEFT JOIN keeps every employee, filling department columns with NULL when no match exists.", "Rows with a NULL `dept_id` never match, and dept 99 has no matching row either.", "Filtering `d.dept_id IS NULL` isolates exactly the unmatched employees."], "explanation": "Two different causes of 'unassigned' collapse into one anti-join, which is why this phrasing appears so often. In a warehouse both cases would route to the unknown-member key rather than vanishing from headcount reports.", "seen": "Core DE pattern"}, {"id": "q59", "title": "Sales by Category With Zero-Sale Categories", "difficulty": "Medium", "pattern": "Outer join rollup", "topics": ["Joins", "Aggregation"], "company": "Airbnb", "prompt": "Return total sales for every category, including categories that have made no sales (show `0.0`).\n\n**Output columns:** `category`, `total_sales` (rounded to 2 decimals)\n**Order by:** `category`", "setup": "CREATE TABLE categories (category_id INTEGER, category TEXT);\nINSERT INTO categories VALUES (1,'electronics'),(2,'grocery'),(3,'toys'),(4,'furniture');\nCREATE TABLE sales (sale_id INTEGER, category_id INTEGER, amount REAL);\nINSERT INTO sales VALUES (1,1,500),(2,1,300),(3,2,120.5),(4,3,80);", "solution": "SELECT c.category, ROUND(COALESCE(SUM(s.amount),0),2) AS total_sales\nFROM categories c LEFT JOIN sales s ON s.category_id=c.category_id\nGROUP BY c.category ORDER BY c.category;", "ordered": true, "hints": ["The dimension must be the LEFT side so empty categories survive.", "SUM over zero matched rows returns NULL, not 0 — COALESCE it."], "walkthrough": ["LEFT JOIN from categories keeps `furniture` even though it has no sales rows.", "Grouping by category collapses matched sales into one row each.", "`SUM` of an all-NULL group yields NULL, so COALESCE turns it into 0."], "explanation": "Two separate NULL behaviours stack here: the outer join manufactures NULLs, and SUM over nothing returns NULL rather than 0. Missing this makes zero-activity rows disappear from a report — the same class of bug as the missing date spine.", "seen": "Core DE pattern"}, {"id": "q60", "title": "Orders Above the Average Order Value", "difficulty": "Medium", "pattern": "Subquery comparison", "topics": ["Subquery", "Aggregation"], "company": "PhonePe", "prompt": "Return orders whose amount is greater than the overall average order amount.\n\n**Output columns:** `order_id`, `amount`, `avg_amount` (the overall average, rounded to 2 decimals, repeated on every row)\n**Order by:** `amount` descending, then `order_id`", "setup": "CREATE TABLE orders (order_id INTEGER, customer_id INTEGER, amount REAL);\nINSERT INTO orders VALUES (1,1,100),(2,1,250),(3,2,50),(4,2,400),(5,3,175),(6,3,25);", "solution": "SELECT order_id, amount, ROUND((SELECT AVG(amount) FROM orders),2) AS avg_amount\nFROM orders WHERE amount > (SELECT AVG(amount) FROM orders)\nORDER BY amount DESC, order_id;", "ordered": true, "hints": ["You cannot write `WHERE amount > AVG(amount)` — aggregates aren't allowed in WHERE.", "A scalar subquery, or AVG(amount) OVER () in a CTE, both work."], "walkthrough": ["The scalar subquery computes the global average (166.67) once.", "The WHERE clause compares each row's amount against it.", "The same subquery in the SELECT list surfaces the threshold for context."], "explanation": "Tests understanding of logical execution order — WHERE runs before aggregation, which is why aggregates are illegal there. The window-function version `AVG(amount) OVER ()` inside a CTE reads the table once instead of twice and is what you'd write at scale.", "seen": "Core DE pattern"}, {"id": "q61", "title": "Market Share by Category", "difficulty": "Medium", "pattern": "Share of total", "topics": ["Window Functions", "Aggregation"], "company": "JPMorgan", "prompt": "For each category return its total sales and its percentage share of overall sales.\n\n**Output columns:** `category`, `total_sales`, `market_share_pct` (rounded to 2 decimals)\n**Order by:** `market_share_pct` descending, then `category`", "setup": "CREATE TABLE sales (sale_id INTEGER, category TEXT, amount REAL);\nINSERT INTO sales VALUES (1,'electronics',4000),(2,'electronics',1000),(3,'grocery',2000),(4,'toys',1500),(5,'toys',500),(6,'books',1000);", "solution": "SELECT category, SUM(amount) AS total_sales,\n       ROUND(100.0*SUM(amount)/SUM(SUM(amount)) OVER (),2) AS market_share_pct\nFROM sales GROUP BY category ORDER BY market_share_pct DESC, category;", "ordered": true, "hints": ["SUM(SUM(amount)) OVER () computes the grand total after grouping.", "Use 100.0 not 100 to avoid integer division in stricter engines."], "walkthrough": ["The inner `SUM(amount)` aggregates per category.", "The outer `SUM(...) OVER ()` runs after grouping and totals across all groups.", "Dividing one by the other yields each category's share."], "explanation": "The nested-aggregate-inside-window trick surprises people, but it's the cleanest way to get a group total and a grand total in one pass. Shares should sum to 100 — a good sanity check to state out loud.", "seen": "Core DE pattern"}, {"id": "q62", "title": "Users Active 7 Consecutive Days", "difficulty": "Hard", "pattern": "Consecutive run detection", "topics": ["Gaps and Islands", "Window Functions"], "company": "Cognizant", "prompt": "Return users who were active on at least 7 consecutive calendar days at any point.\n\n**Output columns:** `user_id`, `max_streak`\n**Order by:** `user_id`", "setup": "CREATE TABLE activity (user_id INTEGER, activity_date TEXT);\nINSERT INTO activity VALUES\n(1,'2024-03-01'),(1,'2024-03-02'),(1,'2024-03-03'),(1,'2024-03-04'),(1,'2024-03-05'),(1,'2024-03-06'),(1,'2024-03-07'),\n(2,'2024-03-01'),(2,'2024-03-02'),(2,'2024-03-04'),(2,'2024-03-05'),(2,'2024-03-06'),\n(3,'2024-03-10'),(3,'2024-03-11'),(3,'2024-03-12'),(3,'2024-03-13'),(3,'2024-03-14'),(3,'2024-03-15'),(3,'2024-03-16'),(3,'2024-03-17');", "solution": "WITH g AS (\n  SELECT user_id, date(activity_date,'-'||ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY activity_date)||' day') AS island\n  FROM (SELECT DISTINCT user_id, activity_date FROM activity)\n), runs AS (SELECT user_id, island, COUNT(*) AS len FROM g GROUP BY user_id, island)\nSELECT user_id, MAX(len) AS max_streak FROM runs GROUP BY user_id HAVING MAX(len) >= 7 ORDER BY user_id;", "ordered": true, "hints": ["Deduplicate dates first — two events on the same day must not inflate the streak.", "date minus row_number is constant across a consecutive run."], "walkthrough": ["`SELECT DISTINCT` collapses multiple events per day to one row per active day.", "Subtracting the row number (in days) from the date produces an identical anchor value for every date in a consecutive run.", "Group by that anchor to get run lengths, then keep users whose longest run reaches 7."], "explanation": "The gaps-and-islands pattern in its most commonly asked disguise. The dedup step is the hidden trap: with raw event logs, three logins on one day would otherwise count as three consecutive days.", "seen": "Core DE pattern"}, {"id": "q63", "title": "User Count by Country", "difficulty": "Easy", "pattern": "Group & count", "topics": ["Aggregation", "NULL Handling"], "company": "Deloitte", "prompt": "Return the number of users per country. Users with a NULL country should be grouped under `'UNKNOWN'`.\n\n**Output columns:** `country`, `users`\n**Order by:** `users` descending, then `country`", "setup": "CREATE TABLE users (user_id INTEGER, country TEXT);\nINSERT INTO users VALUES (1,'IN'),(2,'US'),(3,'IN'),(4,NULL),(5,'UK'),(6,'IN'),(7,NULL),(8,'US');", "solution": "SELECT COALESCE(country,'UNKNOWN') AS country, COUNT(*) AS users\nFROM users GROUP BY COALESCE(country,'UNKNOWN') ORDER BY users DESC, country;", "ordered": true, "hints": ["GROUP BY treats all NULLs as one group — but it labels them NULL, not 'UNKNOWN'.", "COALESCE in both SELECT and GROUP BY (or group by the alias where supported)."], "walkthrough": ["`COALESCE(country,'UNKNOWN')` relabels missing countries.", "Grouping on that expression puts both NULL rows into the UNKNOWN bucket.", "Counting per group gives the distribution."], "explanation": "Worth knowing: GROUP BY treats NULLs as equal to each other (unlike `=` comparisons, where NULL = NULL is UNKNOWN). That inconsistency in SQL's NULL semantics is a classic follow-up question.", "seen": "Core DE pattern"}, {"id": "q64", "title": "Month-over-Month Revenue Growth Percent", "difficulty": "Medium", "pattern": "Period-over-period", "topics": ["Window Functions", "Dates"], "company": "CGI", "prompt": "Return monthly revenue with the growth percentage versus the previous month, rounded to 2 decimals. The first month shows `NULL`.\n\n**Output columns:** `month` (`YYYY-MM`), `revenue`, `growth_pct`\n**Order by:** `month`", "setup": "CREATE TABLE orders (order_id INTEGER, order_date TEXT, amount REAL);\nINSERT INTO orders VALUES (1,'2024-01-10',1000),(2,'2024-02-11',1200),(3,'2024-03-05',900),(4,'2024-04-02',1800),(5,'2024-04-28',200);", "solution": "WITH m AS (SELECT strftime('%Y-%m',order_date) AS month, SUM(amount) AS revenue FROM orders GROUP BY 1)\nSELECT month, revenue,\n  ROUND(100.0*(revenue - LAG(revenue) OVER (ORDER BY month))/LAG(revenue) OVER (ORDER BY month),2) AS growth_pct\nFROM m ORDER BY month;", "ordered": true, "hints": ["Aggregate to month grain first, then LAG.", "Guard against a zero previous month with NULLIF if the data can contain one."], "walkthrough": ["Roll orders up to one row per month.", "`LAG(revenue)` fetches the prior month's value in the ordered set.", "The growth formula returns NULL for January because LAG is NULL there."], "explanation": "Mention division-by-zero defence: `NULLIF(LAG(revenue) OVER (...), 0)` turns a 0 denominator into NULL instead of an error. And repeat the missing-month warning — LAG walks rows, not the calendar.", "seen": "Core DE pattern"}, {"id": "q65", "title": "Nth Highest Distinct Salary", "difficulty": "Medium", "pattern": "Nth value", "topics": ["Ranking", "Window Functions"], "company": "Coforge", "prompt": "Return the 3rd highest **distinct** salary as `third_highest`. Return a single row containing NULL if fewer than 3 distinct salaries exist.\n\n**Output columns:** `third_highest`", "setup": "CREATE TABLE employees (emp_id INTEGER, salary REAL);\nINSERT INTO employees VALUES (1,100000),(2,100000),(3,90000),(4,85000),(5,85000),(6,70000);", "solution": "SELECT (SELECT salary FROM (SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 2)) AS third_highest;", "ordered": false, "hints": ["DENSE_RANK() = 3 is the generalisable form; LIMIT/OFFSET is the terse form.", "Wrap in a scalar subquery so an empty result becomes a NULL row."], "walkthrough": ["`SELECT DISTINCT salary` removes duplicate pay levels (100000 appears twice).", "Ordering descending and skipping 2 rows lands on the 3rd distinct value, 85000.", "The outer scalar subquery guarantees one row even when nothing is found."], "explanation": "The 'distinct' word is doing all the work — with duplicates, ROW_NUMBER-based answers give 90000 instead of 85000. DENSE_RANK is the version that generalises to 'Nth highest per department' without rewriting.", "seen": "Core DE pattern"}, {"id": "q66", "title": "Top Students by Average Marks", "difficulty": "Medium", "pattern": "Aggregate + rank", "topics": ["Aggregation", "Ranking"], "company": "Infosys", "prompt": "Return the top 3 students by average marks across all subjects, keeping ties.\n\n**Output columns:** `student`, `avg_marks` (rounded to 2 decimals), `rnk`\n**Order by:** `rnk`, then `student`", "setup": "CREATE TABLE marks (student TEXT, subject TEXT, score REAL);\nINSERT INTO marks VALUES ('ann','math',90),('ann','sci',80),('bob','math',85),('bob','sci',85),\n('cat','math',70),('cat','sci',90),('dan','math',95),('dan','sci',95),('eve','math',60),('eve','sci',70);", "solution": "WITH a AS (SELECT student, ROUND(AVG(score),2) AS avg_marks FROM marks GROUP BY student)\nSELECT student, avg_marks, DENSE_RANK() OVER (ORDER BY avg_marks DESC) AS rnk\nFROM a WHERE avg_marks IN (SELECT DISTINCT avg_marks FROM a ORDER BY avg_marks DESC LIMIT 3)\nORDER BY rnk, student;", "ordered": true, "hints": ["Aggregate to one row per student first, then rank the aggregates.", "'Keeping ties' means DENSE_RANK, and the top-3 filter should be on distinct averages."], "walkthrough": ["The CTE computes each student's average across subjects.", "The subquery picks the 3 highest distinct averages.", "DENSE_RANK numbers them, and ann and bob both average 85 so they share rank 2."], "explanation": "Combines two patterns interviewers like to stack: aggregate-then-rank. Watch the ordering of operations — ranking raw rows instead of the aggregates is the common wrong answer.", "seen": "Core DE pattern"}, {"id": "q67", "title": "Average Feedback Score per Product", "difficulty": "Easy", "pattern": "Group & average", "topics": ["Aggregation", "NULL Handling"], "company": "Capgemini", "prompt": "Return each product's average feedback score and the number of scored responses. Rows with a NULL score are responses but should not drag the average down.\n\n**Output columns:** `product`, `scored_responses`, `avg_score` (rounded to 2 decimals)\n**Order by:** `product`", "setup": "CREATE TABLE feedback (id INTEGER, product TEXT, score REAL);\nINSERT INTO feedback VALUES (1,'app',5),(2,'app',3),(3,'app',NULL),(4,'web',4),(5,'web',4),(6,'web',NULL),(7,'kiosk',NULL),(8,'kiosk',2);", "solution": "SELECT product, COUNT(score) AS scored_responses, ROUND(AVG(score),2) AS avg_score\nFROM feedback GROUP BY product ORDER BY product;", "ordered": true, "hints": ["COUNT(score) counts non-NULL scores; COUNT(*) would count every response.", "AVG already ignores NULLs, so no COALESCE is needed here."], "walkthrough": ["Group responses by product.", "`COUNT(score)` excludes the NULL rows, giving the number of actual ratings.", "`AVG(score)` divides by that same non-NULL count, which is the desired behaviour."], "explanation": "The inverse of the earlier NULL question: here NULL-skipping is *correct*, and COALESCE(score,0) would be the bug — it would treat 'no answer' as a zero rating. Knowing when to preserve NULL is as important as knowing when to fill it.", "seen": "Core DE pattern"}, {"id": "q68", "title": "Employees Reporting to Each Manager", "difficulty": "Easy", "pattern": "Self join + aggregate", "topics": ["Joins", "Aggregation"], "company": "Sony", "prompt": "Return each manager with the number of employees directly reporting to them. Only include people who actually manage someone.\n\n**Output columns:** `manager_id`, `manager_name`, `direct_reports`\n**Order by:** `direct_reports` descending, then `manager_id`", "setup": "CREATE TABLE employees (emp_id INTEGER, name TEXT, manager_id INTEGER);\nINSERT INTO employees VALUES (1,'Asha',NULL),(2,'Ravi',1),(3,'Meera',1),(4,'John',2),(5,'Sara',2),(6,'Deep',2),(7,'Nita',3);", "solution": "SELECT m.emp_id AS manager_id, m.name AS manager_name, COUNT(*) AS direct_reports\nFROM employees e JOIN employees m ON m.emp_id = e.manager_id\nGROUP BY m.emp_id, m.name ORDER BY direct_reports DESC, manager_id;", "ordered": true, "hints": ["INNER JOIN is correct here because non-managers should be excluded.", "Group by the manager side, not the employee side."], "walkthrough": ["Self-join employees to itself: `e` is the report, `m` is the manager.", "INNER JOIN naturally drops anyone who manages nobody.", "Group by the manager and count the matched report rows."], "explanation": "Note the deliberate contrast with the earlier manager question: there LEFT JOIN was right (keep the CEO), here INNER JOIN is right (drop non-managers). The join type follows from which side must survive — say that reasoning aloud.", "seen": "Core DE pattern"}, {"id": "q69", "title": "Page Views for the Last 7 Days", "difficulty": "Medium", "pattern": "Trailing window with spine", "topics": ["Dates", "Recursive CTE"], "company": "Visa", "prompt": "Return daily page-view counts for the 7 days ending on the latest date in the table, including days with zero views.\n\n**Output columns:** `d`, `views`\n**Order by:** `d`", "setup": "CREATE TABLE page_views (view_id INTEGER, viewed_on TEXT);\nINSERT INTO page_views VALUES (1,'2024-03-20'),(2,'2024-03-20'),(3,'2024-03-22'),(4,'2024-03-25'),(5,'2024-03-25'),(6,'2024-03-25'),(7,'2024-03-26');", "solution": "WITH RECURSIVE b AS (SELECT date((SELECT MAX(viewed_on) FROM page_views),'-6 day') AS lo, (SELECT MAX(viewed_on) FROM page_views) AS hi),\ncal(d) AS (SELECT lo FROM b UNION ALL SELECT date(d,'+1 day') FROM cal WHERE d < (SELECT hi FROM b))\nSELECT cal.d, COUNT(p.view_id) AS views\nFROM cal LEFT JOIN page_views p ON p.viewed_on = cal.d\nGROUP BY cal.d ORDER BY cal.d;", "ordered": true, "hints": ["7 days ending today means the start is today minus 6, not minus 7.", "Build the spine, then LEFT JOIN the events onto it."], "walkthrough": ["Compute the window bounds from MAX(viewed_on) so the query is reproducible.", "The recursive CTE materialises all 7 dates.", "LEFT JOIN and `COUNT(view_id)` yield 0 on days with no matching views."], "explanation": "The off-by-one (`-6` not `-7`) is the planted error, and it is the single most common mistake in trailing-window queries. Every 7-day dashboard metric has this bug at least once in its history.", "seen": "Core DE pattern"}, {"id": "q70", "title": "Discount Impact on Sales", "difficulty": "Medium", "pattern": "Segmented comparison", "topics": ["CASE", "Aggregation"], "company": "Wipro", "prompt": "Compare orders that had a discount against those that did not.\n\n**Output columns:** `segment` (`'discounted'` or `'full_price'`), `orders`, `avg_order_value` (rounded to 2 decimals), `total_revenue` (rounded to 2 decimals)\n**Order by:** `segment`", "setup": "CREATE TABLE orders (order_id INTEGER, amount REAL, discount REAL);\nINSERT INTO orders VALUES (1,100,10),(2,200,NULL),(3,150,0),(4,300,50),(5,80,NULL),(6,220,20),(7,90,0);", "solution": "SELECT CASE WHEN COALESCE(discount,0) > 0 THEN 'discounted' ELSE 'full_price' END AS segment,\n       COUNT(*) AS orders,\n       ROUND(AVG(amount),2) AS avg_order_value,\n       ROUND(SUM(amount),2) AS total_revenue\nFROM orders GROUP BY segment ORDER BY segment;", "ordered": true, "hints": ["A discount of 0 is not a discount — treat it like NULL.", "Define the segment once in a CASE and group by it."], "walkthrough": ["`COALESCE(discount,0) > 0` classifies each order, folding NULL and 0 into full price.", "Grouping on the CASE expression creates the two segments.", "Aggregate count, average and sum within each."], "explanation": "The data deliberately contains both NULL and 0.0 discounts, which are semantically identical but behave differently in comparisons. Real source systems mix the two constantly — spotting it is the point.", "seen": "Core DE pattern"}, {"id": "q71", "title": "New vs Returning Users", "difficulty": "Medium", "pattern": "First-seen classification", "topics": ["Window Functions", "Aggregation"], "company": "Tiger Analytics", "prompt": "For each day classify every visiting user as new (first ever visit) or returning, and count them.\n\n**Output columns:** `d`, `new_users`, `returning_users`\n**Order by:** `d`", "setup": "CREATE TABLE visits (user_id INTEGER, visit_date TEXT);\nINSERT INTO visits VALUES (1,'2024-03-01'),(2,'2024-03-01'),(1,'2024-03-02'),(3,'2024-03-02'),\n(2,'2024-03-03'),(3,'2024-03-03'),(4,'2024-03-03'),(1,'2024-03-03');", "solution": "WITH f AS (SELECT user_id, MIN(visit_date) AS first_date FROM visits GROUP BY user_id),\nv AS (SELECT DISTINCT user_id, visit_date FROM visits)\nSELECT v.visit_date AS d,\n       SUM(CASE WHEN v.visit_date = f.first_date THEN 1 ELSE 0 END) AS new_users,\n       SUM(CASE WHEN v.visit_date > f.first_date THEN 1 ELSE 0 END) AS returning_users\nFROM v JOIN f ON f.user_id = v.user_id\nGROUP BY v.visit_date ORDER BY d;", "ordered": true, "hints": ["Compute each user's first-ever visit date once, then compare every visit against it.", "Dedupe user/day pairs so a user visiting twice in a day isn't double counted."], "walkthrough": ["The `f` CTE finds each user's first visit date.", "The `v` CTE reduces the log to distinct user-day pairs.", "Joining them lets a CASE compare each visit day against the first-seen day, and conditional sums split the counts."], "explanation": "The building block of every acquisition dashboard. Interview follow-up: how do you handle a user who was new before your data retention window began? They look 'new' again — which is why real systems keep a separate first_seen dimension rather than deriving it from the event table.", "seen": "Core DE pattern"}, {"id": "q72", "title": "Fastest Growing Categories", "difficulty": "Hard", "pattern": "Growth ranking", "topics": ["Window Functions", "Dates", "Aggregation"], "company": "Coca-Cola", "prompt": "Compare each category's sales in `2024-02` against `2024-01` and return the 3 categories with the highest growth percentage. Exclude categories with no January sales (growth is undefined).\n\n**Output columns:** `category`, `jan_sales`, `feb_sales`, `growth_pct` (rounded to 2 decimals)\n**Order by:** `growth_pct` descending, then `category`", "setup": "CREATE TABLE sales (category TEXT, sale_date TEXT, amount REAL);\nINSERT INTO sales VALUES\n('electronics','2024-01-10',1000),('electronics','2024-02-10',1500),\n('grocery','2024-01-05',2000),('grocery','2024-02-05',2200),\n('toys','2024-01-20',500),('toys','2024-02-20',1500),\n('books','2024-02-01',300),\n('sports','2024-01-15',800),('sports','2024-02-15',400);", "solution": "WITH m AS (\n  SELECT category,\n         SUM(CASE WHEN strftime('%Y-%m',sale_date)='2024-01' THEN amount ELSE 0 END) AS jan_sales,\n         SUM(CASE WHEN strftime('%Y-%m',sale_date)='2024-02' THEN amount ELSE 0 END) AS feb_sales\n  FROM sales GROUP BY category)\nSELECT category, jan_sales, feb_sales, ROUND(100.0*(feb_sales-jan_sales)/jan_sales,2) AS growth_pct\nFROM m WHERE jan_sales > 0\nORDER BY growth_pct DESC, category LIMIT 3;", "ordered": true, "hints": ["Pivot the two months into columns with conditional aggregation, then compute growth.", "`books` has no January sales — dividing by zero must be excluded, not returned as infinity."], "walkthrough": ["Conditional SUMs place January and February totals side by side on one row per category.", "Filtering `jan_sales > 0` removes the undefined-growth case.", "Growth is computed from the two columns, then ranked and limited to 3."], "explanation": "The divide-by-zero guard is the real test — `books` grew from nothing, which is either infinite growth or undefined depending on the business definition. Ask which the stakeholder wants rather than silently dropping it; a 'new category' bucket is often the right answer.", "seen": "Core DE pattern"}, {"id": "q73", "title": "Standardise Messy Customer Names", "difficulty": "Medium", "pattern": "String cleaning", "topics": ["Strings", "Data Quality"], "prompt": "Clean the raw name field: trim whitespace, collapse to title-ish form by upper-casing the first letter and lower-casing the rest, and drop rows that are empty after trimming.\n\n**Output columns:** `customer_id`, `clean_name`\n**Order by:** `customer_id`", "setup": "CREATE TABLE customer_raw (customer_id INTEGER, raw_name TEXT);\nINSERT INTO customer_raw VALUES (1,'  asha  '),(2,'RAVI'),(3,'MeErA'),(4,'   '),(5,'john'),(6,NULL);", "solution": "SELECT customer_id,\n       UPPER(SUBSTR(TRIM(raw_name),1,1)) || LOWER(SUBSTR(TRIM(raw_name),2)) AS clean_name\nFROM customer_raw\nWHERE TRIM(COALESCE(raw_name,'')) <> ''\nORDER BY customer_id;", "ordered": true, "hints": ["TRIM first, then check against '' — a whitespace-only string is not NULL but is still empty.", "SUBSTR(x,1,1) and SUBSTR(x,2) split off the first character."], "walkthrough": ["`TRIM` removes leading and trailing spaces.", "The WHERE clause drops NULL and whitespace-only rows by coalescing then comparing to empty string.", "Concatenating the upper-cased first character with the lower-cased remainder normalises the casing."], "explanation": "Bronze-to-silver cleanup in miniature. The trap is the whitespace-only row: `raw_name IS NOT NULL` passes it through. Postgres/Snowflake have INITCAP which does this in one call — mention it, then show you can do it without.", "company": null, "seen": "Core DE pattern"}, {"id": "q74", "title": "Extract Domain From Email", "difficulty": "Medium", "pattern": "String parsing", "topics": ["Strings"], "prompt": "Extract the domain (everything after the `@`) from each email and count users per domain. Ignore rows where the email is NULL or has no `@`.\n\n**Output columns:** `domain`, `users`\n**Order by:** `users` descending, then `domain`", "setup": "CREATE TABLE users (user_id INTEGER, email TEXT);\nINSERT INTO users VALUES (1,'a@gmail.com'),(2,'b@gmail.com'),(3,'c@company.co.in'),(4,'not-an-email'),\n(5,NULL),(6,'d@company.co.in'),(7,'e@yahoo.com'),(8,'f@gmail.com');", "solution": "SELECT SUBSTR(email, INSTR(email,'@')+1) AS domain, COUNT(*) AS users\nFROM users WHERE email LIKE '%@%'\nGROUP BY domain ORDER BY users DESC, domain;", "ordered": true, "hints": ["INSTR (or POSITION/CHARINDEX) finds the @ index; SUBSTR from index+1 takes the rest.", "LIKE '%@%' filters out malformed values before parsing."], "walkthrough": ["The WHERE clause keeps only strings containing an `@`, which also excludes NULL.", "`INSTR(email,'@')` returns the position of the separator.", "`SUBSTR` from one past that position yields the domain, which is then grouped and counted."], "explanation": "Every engine names these differently: INSTR (SQLite/Oracle), POSITION or STRPOS (Postgres), CHARINDEX (SQL Server), LOCATE (MySQL), and SPLIT_PART is the cleaner tool where available. Interviewers accept any of them but expect you to guard against malformed input first.", "company": null, "seen": "Core DE pattern"}, {"id": "q75", "title": "Mask Sensitive Data", "difficulty": "Medium", "pattern": "Data masking", "topics": ["Strings", "Data Quality"], "prompt": "Produce a masked view for non-production use: show only the first character of the email local part followed by `***` and the full domain, and mask all but the last 4 digits of the phone with `X`.\n\nExample: `asha@x.com` -> `a***@x.com`; `9876543210` -> `XXXXXX3210`.\n\n**Output columns:** `user_id`, `masked_email`, `masked_phone`\n**Order by:** `user_id`", "setup": "CREATE TABLE users (user_id INTEGER, email TEXT, phone TEXT);\nINSERT INTO users VALUES (1,'asha@x.com','9876543210'),(2,'ravi@y.co.in','9000011111'),(3,'m@z.org','8888899999');", "solution": "SELECT user_id,\n  SUBSTR(email,1,1) || '***' || SUBSTR(email, INSTR(email,'@')) AS masked_email,\n  REPLACE(SUBSTR(phone,1,LENGTH(phone)-4),SUBSTR(phone,1,LENGTH(phone)-4),\n    SUBSTR('XXXXXXXXXXXXXXXX',1,LENGTH(phone)-4)) || SUBSTR(phone,-4) AS masked_phone\nFROM users ORDER BY user_id;", "ordered": true, "hints": ["SUBSTR(phone,-4) takes the last 4 characters in SQLite.", "Build the mask by slicing a string of X's to the required length."], "walkthrough": ["The email mask keeps character 1, appends `***`, then appends from the `@` onward.", "For the phone, `LENGTH(phone)-4` is how many characters must be hidden.", "Slicing a constant run of X's to that length and concatenating the last 4 real digits produces the masked value."], "explanation": "Directly relevant to governance work — Unity Catalog column masks and Snowflake dynamic data masking policies express exactly this logic. The interview point is that masking must be deterministic in shape (length preserved) so downstream validation and format checks still pass.", "company": null, "seen": "Core DE pattern"}, {"id": "q76", "title": "Pattern Match Product Codes", "difficulty": "Medium", "pattern": "Pattern matching", "topics": ["Strings", "Data Quality"], "prompt": "Valid product codes look like 3 uppercase letters, a hyphen, then 4 digits (e.g. `ABC-1234`). Return each code with a validity flag.\n\n**Output columns:** `code`, `is_valid` (1 or 0)\n**Order by:** `code`", "setup": "CREATE TABLE products (code TEXT);\nINSERT INTO products VALUES ('ABC-1234'),('AB-1234'),('ABCD-1234'),('ABC-123'),('abc-1234'),('XYZ-9999'),('ABC1234');", "solution": "SELECT code,\n  CASE WHEN code GLOB '[A-Z][A-Z][A-Z]-[0-9][0-9][0-9][0-9]' THEN 1 ELSE 0 END AS is_valid\nFROM products ORDER BY code;", "ordered": true, "hints": ["SQLite GLOB is case-sensitive and supports character classes; LIKE is case-insensitive for ASCII.", "Postgres would use `code ~ '^[A-Z]{3}-[0-9]{4}$'`."], "walkthrough": ["Each `[A-Z]` matches exactly one uppercase letter, so three of them enforce the prefix length.", "The literal hyphen and four `[0-9]` classes enforce the rest.", "GLOB anchors the whole string, so `ABCD-1234` fails on length."], "explanation": "Format validation is a standard data-quality check. Know that regex support varies wildly: Postgres `~`, Snowflake RLIKE/REGEXP_LIKE, Databricks RLIKE, SQL Server has none natively. When regex is unavailable, LIKE/GLOB character classes are the fallback — which is why this is asked.", "company": null, "seen": "Core DE pattern"}, {"id": "q77", "title": "Split a Delimited Field", "difficulty": "Hard", "pattern": "String split / explode", "topics": ["Recursive CTE", "Strings"], "prompt": "The `tags` column holds comma-separated values. Explode it so there is one row per tag, and count how many products carry each tag.\n\n**Output columns:** `tag`, `product_count`\n**Order by:** `product_count` descending, then `tag`", "setup": "CREATE TABLE products (product_id INTEGER, tags TEXT);\nINSERT INTO products VALUES (1,'new,sale,featured'),(2,'sale'),(3,'featured,sale'),(4,'new');", "solution": "WITH RECURSIVE s(product_id, tag, rest) AS (\n  SELECT product_id,\n         CASE WHEN INSTR(tags,',')>0 THEN SUBSTR(tags,1,INSTR(tags,',')-1) ELSE tags END,\n         CASE WHEN INSTR(tags,',')>0 THEN SUBSTR(tags,INSTR(tags,',')+1) ELSE '' END\n  FROM products\n  UNION ALL\n  SELECT product_id,\n         CASE WHEN INSTR(rest,',')>0 THEN SUBSTR(rest,1,INSTR(rest,',')-1) ELSE rest END,\n         CASE WHEN INSTR(rest,',')>0 THEN SUBSTR(rest,INSTR(rest,',')+1) ELSE '' END\n  FROM s WHERE rest <> ''\n)\nSELECT tag, COUNT(*) AS product_count FROM s GROUP BY tag ORDER BY product_count DESC, tag;", "ordered": true, "hints": ["Each recursive step peels one token off the front and keeps the remainder.", "Stop when the remainder is empty."], "walkthrough": ["The anchor takes the first token from each row and stores what's left.", "Each recursive step repeats the peel on the remainder.", "When the remainder is empty the recursion halts; grouping the exploded rows gives tag frequencies."], "explanation": "Painful in plain SQL, trivial in a modern warehouse: `SPLIT` + `LATERAL FLATTEN` (Snowflake) or `explode(split(tags,','))` (Spark/Databricks). Interviewers ask it to see whether you know the recursive fallback *and* that storing delimited lists in a column violates first normal form in the first place.", "company": null, "seen": "Core DE pattern"}, {"id": "q78", "title": "Type Casting and Bad Data", "difficulty": "Medium", "pattern": "Type casting", "topics": ["Data Quality", "Type Casting"], "prompt": "The staged `amount_text` column arrived as free text. Return rows where the value is a clean non-negative integer or decimal, cast to a number, and flag the rest.\n\n**Output columns:** `row_id`, `amount_text`, `parsed_amount` (NULL when unparseable), `is_valid` (1/0)\n**Order by:** `row_id`", "setup": "CREATE TABLE staged (row_id INTEGER, amount_text TEXT);\nINSERT INTO staged VALUES (1,'100'),(2,'250.75'),(3,'abc'),(4,''),(5,NULL),(6,'12.5.6'),(7,'  90  '),(8,'-5');", "solution": "SELECT row_id, amount_text,\n  CASE WHEN TRIM(COALESCE(amount_text,'')) GLOB '[0-9]*' AND TRIM(amount_text) NOT GLOB '*[!0-9.]*'\n            AND (LENGTH(TRIM(amount_text)) - LENGTH(REPLACE(TRIM(amount_text),'.',''))) <= 1\n       THEN CAST(TRIM(amount_text) AS REAL) END AS parsed_amount,\n  CASE WHEN TRIM(COALESCE(amount_text,'')) GLOB '[0-9]*' AND TRIM(amount_text) NOT GLOB '*[!0-9.]*'\n            AND (LENGTH(TRIM(amount_text)) - LENGTH(REPLACE(TRIM(amount_text),'.',''))) <= 1\n       THEN 1 ELSE 0 END AS is_valid\nFROM staged ORDER BY row_id;", "ordered": true, "hints": ["Counting a character = LENGTH(x) - LENGTH(REPLACE(x,c,'')). More than one dot means malformed.", "A naive CAST in SQLite silently returns 0.0 for 'abc' rather than erroring — that's the danger."], "walkthrough": ["Trim, then require the string to start with a digit and contain only digits and dots.", "Count the dots by measuring length before and after removing them; more than one is invalid.", "Only then CAST; everything else yields NULL and a 0 flag."], "explanation": "The critical insight: SQLite and MySQL *silently* coerce garbage to 0, while Postgres and Snowflake raise an error. Silent coercion is worse — a column of zeros looks like real data. Snowflake's TRY_CAST and Databricks' try_cast exist exactly for this, returning NULL instead of failing or lying.", "company": null, "seen": "Core DE pattern"}, {"id": "q79", "title": "Full Outer Join Without FULL OUTER", "difficulty": "Medium", "pattern": "Set reconstruction", "topics": ["Joins", "Set Operations"], "prompt": "Return a combined key list from both tables with each side's value, using NULL where a key is missing on that side. Do not use FULL OUTER JOIN.\n\n**Output columns:** `k`, `left_val`, `right_val`\n**Order by:** `k`", "setup": "CREATE TABLE t_left (k INTEGER, left_val TEXT);\nINSERT INTO t_left VALUES (1,'a'),(2,'b'),(3,'c');\nCREATE TABLE t_right (k INTEGER, right_val TEXT);\nINSERT INTO t_right VALUES (2,'B'),(3,'C'),(4,'D');", "solution": "SELECT l.k AS k, l.left_val, r.right_val FROM t_left l LEFT JOIN t_right r ON r.k=l.k\nUNION ALL\nSELECT r.k, NULL, r.right_val FROM t_right r WHERE NOT EXISTS (SELECT 1 FROM t_left l WHERE l.k=r.k)\nORDER BY k;", "ordered": true, "hints": ["LEFT JOIN gives you everything on the left plus matches; add the right-only rows with an anti-join.", "UNION ALL, not UNION — there is nothing to deduplicate."], "walkthrough": ["The LEFT JOIN produces keys 1, 2 and 3 with right values filled where matched.", "The second branch finds keys present only on the right (key 4).", "UNION ALL stacks them into the full outer result."], "explanation": "Worth knowing because MySQL has no FULL OUTER JOIN at all and older SQLite didn't either. It's also the pattern behind source-to-target reconciliation. The COALESCE(l.k, r.k) form is how you'd write the key column with a real FULL OUTER JOIN.", "company": null, "seen": "Core DE pattern"}, {"id": "q80", "title": "EXCEPT and INTERSECT", "difficulty": "Easy", "pattern": "Set operations", "topics": ["Set Operations"], "prompt": "Return each user id that appears in the app log, the web log, or both, tagged by where it appears: `'both'`, `'app_only'` or `'web_only'`.\n\n**Output columns:** `user_id`, `presence`\n**Order by:** `user_id`", "setup": "CREATE TABLE app_users (user_id INTEGER);\nINSERT INTO app_users VALUES (1),(2),(3),(4);\nCREATE TABLE web_users (user_id INTEGER);\nINSERT INTO web_users VALUES (3),(4),(5),(6);", "solution": "SELECT user_id,'both' AS presence FROM (SELECT user_id FROM app_users INTERSECT SELECT user_id FROM web_users)\nUNION ALL\nSELECT user_id,'app_only' FROM (SELECT user_id FROM app_users EXCEPT SELECT user_id FROM web_users)\nUNION ALL\nSELECT user_id,'web_only' FROM (SELECT user_id FROM web_users EXCEPT SELECT user_id FROM app_users)\nORDER BY user_id;", "ordered": true, "hints": ["INTERSECT gives the overlap; EXCEPT gives left-minus-right (called MINUS in Oracle).", "Both operators deduplicate implicitly."], "walkthrough": ["INTERSECT returns ids present in both logs.", "EXCEPT in each direction returns the ids exclusive to one side.", "UNION ALL labels and stacks the three disjoint sets."], "explanation": "Set operators are the most readable way to express reconciliation and are heavily used in dbt tests (`EXCEPT` in both directions returning zero rows is the standard table-equality assertion). Remember they deduplicate and require matching column counts and compatible types.", "company": null, "seen": "Core DE pattern"}, {"id": "q81", "title": "Running Total Without Window Functions", "difficulty": "Hard", "pattern": "ANSI-only / pre-window SQL", "topics": ["Joins", "Subquery"], "prompt": "Compute a running total of `amount` ordered by `txn_id`, **without using any window function**.\n\n**Output columns:** `txn_id`, `amount`, `running_total`\n**Order by:** `txn_id`", "setup": "CREATE TABLE txns (txn_id INTEGER, amount REAL);\nINSERT INTO txns VALUES (1,100),(2,50),(3,-30),(4,200),(5,10);", "solution": "SELECT t.txn_id, t.amount,\n       (SELECT SUM(t2.amount) FROM txns t2 WHERE t2.txn_id <= t.txn_id) AS running_total\nFROM txns t ORDER BY t.txn_id;", "ordered": true, "hints": ["A correlated subquery that sums all rows up to the current one reproduces the window frame.", "A self-join with `t2.txn_id <= t.txn_id` plus GROUP BY works identically."], "walkthrough": ["For each outer row, the correlated subquery re-scans the table summing every row with an id at or below it.", "That is exactly the definition of `SUM(...) OVER (ORDER BY txn_id)`.", "The result matches the window version row for row."], "explanation": "Interviewers use the no-window-functions constraint to see whether you understand what a window frame *is* rather than just its syntax. Say the cost out loud: this is O(n²) — the correlated subquery re-scans per row, while a window function does it in a single ordered pass. That's the reason window functions were added to the standard.", "company": null, "seen": "Core DE pattern"}, {"id": "q82", "title": "Top-N per Group Without Window Functions", "difficulty": "Hard", "pattern": "ANSI-only / pre-window SQL", "topics": ["Joins", "Subquery"], "prompt": "Return the top 2 products by revenue in each category **without using window functions**.\n\n**Output columns:** `category`, `product`, `revenue`\n**Order by:** `category`, `revenue` descending, `product`", "setup": "CREATE TABLE products (category TEXT, product TEXT, revenue REAL);\nINSERT INTO products VALUES ('elec','tv',5000),('elec','phone',4000),('elec','cable',100),\n('food','rice',900),('food','oil',700),('food','salt',50),('toys','puzzle',200);", "solution": "SELECT p.category, p.product, p.revenue\nFROM products p\nWHERE (SELECT COUNT(*) FROM products p2\n       WHERE p2.category=p.category AND (p2.revenue > p.revenue\n             OR (p2.revenue = p.revenue AND p2.product < p.product))) < 2\nORDER BY p.category, p.revenue DESC, p.product;", "ordered": true, "hints": ["Count how many rows in the same group beat the current row — that count IS its rank minus one.", "Include a deterministic tie-breaker in the comparison or ties inflate the count."], "walkthrough": ["For each row, the correlated subquery counts same-category rows with higher revenue.", "A count of 0 means it ranks first, 1 means second, so `< 2` keeps the top two.", "The extra `product <` clause breaks ties deterministically, mimicking ROW_NUMBER."], "explanation": "This 'count the rows that beat me' idiom is how ranking was done before window functions, and it still appears in legacy MySQL 5.x code. Being able to write it — and to explain that it's quadratic — is a genuine senior signal.", "company": null, "seen": "Core DE pattern"}, {"id": "q83", "title": "Make a Query SARGable", "difficulty": "Medium", "pattern": "Query optimization", "topics": ["Performance", "Dates"], "prompt": "Both queries below find March 2024 orders, but only one can use an index on `order_ts`. Write the index-friendly version.\n\nSlow: `WHERE strftime('%Y-%m', order_ts) = '2024-03'`\n\nReturn the matching orders.\n\n**Output columns:** `order_id`, `order_ts`, `amount`\n**Order by:** `order_id`", "setup": "CREATE TABLE orders (order_id INTEGER, order_ts TEXT, amount REAL);\nCREATE INDEX idx_orders_ts ON orders(order_ts);\nINSERT INTO orders VALUES (1,'2024-02-28 23:59:59',10),(2,'2024-03-01 00:00:00',20),\n(3,'2024-03-15 12:00:00',30),(4,'2024-03-31 23:59:59',40),(5,'2024-04-01 00:00:00',50);", "solution": "SELECT order_id, order_ts, amount FROM orders\nWHERE order_ts >= '2024-03-01' AND order_ts < '2024-04-01'\nORDER BY order_id;", "ordered": true, "hints": ["Never wrap the indexed column in a function — transform the literal instead.", "A half-open range `>= start AND < next_start` handles timestamps correctly; BETWEEN would miss 23:59:59.x."], "walkthrough": ["Leaving `order_ts` bare lets the optimizer seek directly into the index.", "The lower bound is inclusive, the upper bound exclusive.", "That upper bound catches the 23:59:59 row, which `BETWEEN '2024-03-01' AND '2024-03-31'` would silently drop."], "explanation": "SARGable means Search-ARGument-able: the predicate can be resolved by an index seek. Function-wrapped columns, leading-wildcard LIKE ('%abc'), and implicit type conversions all defeat indexes. This is the single most common query-optimization question, and you can demo it here by running EXPLAIN QUERY PLAN on both versions.", "company": null, "seen": "Core DE pattern"}, {"id": "q84", "title": "Deduplicate Without ROW_NUMBER", "difficulty": "Medium", "pattern": "Dedup alternative", "topics": ["Aggregation", "Joins"], "prompt": "Keep the latest row per `customer_id` (by `updated_at`), without using window functions. Timestamps are unique within a customer.\n\n**Output columns:** `customer_id`, `name`, `updated_at`\n**Order by:** `customer_id`", "setup": "CREATE TABLE stg (customer_id INTEGER, name TEXT, updated_at TEXT);\nINSERT INTO stg VALUES (1,'asha old','2024-01-01'),(1,'asha new','2024-03-01'),\n(2,'ravi','2024-02-01'),(3,'meera v1','2024-01-15'),(3,'meera v2','2024-04-01');", "solution": "SELECT s.customer_id, s.name, s.updated_at\nFROM stg s\nJOIN (SELECT customer_id, MAX(updated_at) AS mx FROM stg GROUP BY customer_id) m\n  ON m.customer_id=s.customer_id AND m.mx=s.updated_at\nORDER BY s.customer_id;", "ordered": true, "hints": ["Aggregate to find each key's max timestamp, then join back to pull the whole row.", "This breaks if two rows share the max timestamp — it returns both."], "walkthrough": ["The subquery reduces the table to one max timestamp per customer.", "Joining back o
